const detailHindi={"It keeps organizational identities and sign-in configuration together. / Organization ki identities aur sign-in settings ek jagah manage hoti hain.": "संगठन की पहचान और साइन-इन सेटिंग एक जगह रहती हैं।", "A user signs in through a tenant. Azure then evaluates authorization for the requested subscription or resource. A subscription trusts one tenant at a time, while a tenant can be associated with multiple subscriptions. External users can also be invited. / Login identity tenant se aati hai; resource par action role aur scope ke hisaab se milta hai.": "लॉगिन पहचान tenant से आती है; कार्रवाई की अनुमति role और scope पर निर्भर है।", "Your HRMS can have employee and app identities in one tenant, with separate development and production subscriptions. / Ek identity directory, multiple billing scopes ho sakte hain.": "एक पहचान निर्देशिका से कई billing scopes जुड़े हो सकते हैं।", "Portal → search Microsoft Entra ID → Overview. Read the Tenant ID and primary domain. To check the active directory, use the account menu or portal directory filter. Viewing it does not require creating a new tenant. / Naya tenant banaye bina existing directory inspect karo.": "नया tenant बनाए बिना मौजूदा directory देखें।", "Tenant and subscription are not the same. A tenant does not itself supply VM capacity or automatically grant users access to every resource. / Tenant hona aur subscription Owner hona alag baatein hain.": "Tenant का सदस्य होना और subscription का Owner होना अलग हैं।", "It separates ownership, billing, quotas and administrative scopes. / Billing aur management ko alag organize karta hai.": "Billing और प्रबंधन की सीमाएँ अलग करता है।", "A resource is deployed into a subscription. Usage is recorded against billing meters and authorized actions are checked at inherited or direct scopes. / Resource ka usage subscription ke billing system mein record hota hai.": "Resource का उपयोग subscription के billing system में दर्ज होता है।", "Keep learning resources separate from a production subscription. / Learning aur production ka bill aur access alag rakha ja sakta hai.": "सीखने और production का खर्च व access अलग रख सकते हैं।", "Portal → search Subscriptions → select the exact subscription → Overview. Inspect status and offer; use Cost analysis for usage and Billing for invoices where available. / Sirf naam nahi, status aur billing bhi dekho.": "नाम के साथ status और billing भी देखें।", "A subscription name is a label, not proof of a free plan. A monthly budget is not an automatic spending cap. / Naam free hone se service free nahi.": "नाम में free होने से सेवा मुफ्त नहीं होती।", "It organizes lifecycle, access and cost reporting. / Project ko organize aur manage karna easy hota hai.": "Project को व्यवस्थित और प्रबंधित करना आसान होता है।", "Create the group, then deploy resources into it. Group-level operations can affect members. Deleting a group can delete its contained resources, so it is a lifecycle boundary, not just a harmless visual folder. / Group delete karne se andar ke resources bhi ja sakte hain.": "Group हटाने से उसके resources भी हट सकते हैं।", "hrms-db can contain SQL Database, Container Apps and a registry. The group total adds their charges even if SQL costs zero. / Naam DB hai, par charges dusri service ke ho sakte hain.": "Group के नाम से खर्च करने वाली सेवा तय नहीं होती।", "Portal → Resource groups → select a group → Overview. Inspect the Type column for each resource. Cost analysis → Group by Resource or Service name reveals which member is charged. / Type column aur cost breakdown dekho.": "Type column और खर्च का विवरण देखें।", "The group name does not identify the billing service. Group location also does not force every member into that region. / Group ka naam aur member type alag hain.": "Group का नाम और उसके resources का type अलग हैं।", "It provides a specific capability that can be configured and governed. / Har item ka specific kaam aur settings hoti hain.": "हर resource का अपना काम और settings होती हैं।", "A resource has a type, name, identifier, scope and configuration. Related resources form an application architecture. Cost may appear on a parent plan or a related resource rather than the app row. / App aur uska paid plan alag resources ho sakte hain.": "App और उसका paid plan अलग resources हो सकते हैं।", "A Web App resource runs your API; its App Service plan supplies capacity. / App chalti hai plan ki capacity par.": "App अपने plan की क्षमता पर चलती है।", "Portal → All resources or Resource group → Overview → select an item. Read Type, Location, Status and related resources. / Resource type se uska kaam identify karo.": "Resource type से उसका काम पहचानें।", "Not every visible resource has a separate charge, and a zero-cost app row does not prove its hosting plan is free. / Zero row ka matlab poora setup free nahi.": "एक शून्य लागत वाली पंक्ति का अर्थ पूरा setup मुफ्त नहीं है।", "It answers identity questions and supports secure sign-in. / Kaun login kar raha hai, iski identity establish hoti hai.": "लॉगिन करने वाले की पहचान स्थापित करता है।", "Applications request a token for a target service. The target validates the token and applies its authorization rules. Identity and permission remain separate concerns. / Token ke baad bhi target permission check karta hai.": "Token मिलने के बाद भी लक्ष्य अनुमति जाँचता है।", "A GitHub deployment identity signs in to Azure before deploying the HRMS app. / Login aur deployment permission alag steps hain.": "Login और deployment की अनुमति अलग हैं।", "Portal → search Microsoft Entra ID. Inspect Overview, Users, Groups or App registrations according to your role. / Sahi tenant select karke relevant section dekho.": "सही tenant चुनकर संबंधित section देखें।", "Entra ID is not the SQL database itself and does not replace network rules. / Login service network firewall ka replacement nahi.": "यह network firewall का विकल्प नहीं है।", "It establishes identity before access decisions. / Pehle identity prove hoti hai.": "पहले पहचान प्रमाणित होती है।", "Credentials or trusted tokens are validated by the identity system. Successful sign-in produces an authenticated identity, not unlimited permission. / Login success sab actions ki permission nahi deta.": "सफल login हर कार्रवाई की अनुमति नहीं देता।", "GitHub Azure login succeeds, but deployment can still fail if the app identity has no write role. / Login aur rights alag hain.": "Login और अधिकार अलग हैं।", "For a Web App inspect Authentication. For Azure management inspect the account and tenant; workload setup depends on OIDC or managed identity. / Service ke hisaab se authentication setting alag hai.": "Authentication setting सेवा के अनुसार बदलती है।", "A network timeout is not always a bad password. Separate connectivity, authentication and authorization errors. / Error layer identify karo.": "त्रुटि किस स्तर पर है, पहचानें।", "It restricts access to the intended operations. / Sirf required kaam allow karta hai.": "केवल आवश्यक कार्रवाई की अनुमति देता है।", "After identity verification, the target checks assigned permissions. Azure management and data-plane permissions can differ. / Management access aur data read access alag ho sakte hain.": "Management access और data पढ़ने का access अलग हो सकता है।", "An app can manage a storage account but still lack permission to read its blobs. / Contributor hona data reader hona zaroori nahi.": "Contributor को data पढ़ने की अनुमति आवश्यक रूप से नहीं मिलती।", "Resource → Access control (IAM) for Azure RBAC. For SQL, inspect database users and permissions as well. / SQL ka data authorization bhi configure karo.": "SQL का data authorization भी configure करें।", "Owner of a subscription is not a reason to put its credentials in browser code. / Backend credentials frontend mein mat do.": "Backend credentials frontend में न रखें।", "It gives controlled, reviewable Azure access. / Access ko minimum required scope par control karta hai.": "न्यूनतम आवश्यक scope पर access नियंत्रित करता है।", "A role assignment combines principal, role and scope. Permissions at a parent scope can be inherited by children. Data roles must be chosen for services that distinguish management from data. / Kaun, kya aur kahan: teen cheezein match karo.": "कौन, क्या और कहाँ—तीनों का मिलान करें।", "Assign read access to one lab group instead of Owner on the subscription. / Chhota scope choose karo.": "आवश्यकता के अनुसार छोटा scope चुनें।", "Target resource → Access control (IAM) → View my access / Role assignments. Before adding a role, verify the exact principal and scope. / Assignment ko review karo.": "Role assignment की समीक्षा करें।", "Enabling an identity is not a role assignment. / Identity on karna permission dena nahi hai.": "Identity चालू करना permission देना नहीं है।", "It prevents a change or report from affecting unintended resources. / Sahi boundary se galat target avoid hota hai.": "सही सीमा चुनने से गलत लक्ष्य से बचते हैं।", "Parent scopes can influence descendants through supported inheritance. Cost analysis also displays a selected scope, so different scopes show different totals. / Scope badalne se total badal sakta hai.": "Scope बदलने से कुल राशि बदल सकती है।", "₹318 group total and ₹1,882 subscription total cover different sets of resources. / Dono ka scope alag hai.": "दोनों आँकड़ों का scope अलग हो सकता है।", "Read the breadcrumb, subscription selection and scope label before changing settings or interpreting a chart. / Pehle selected scope dekho.": "पहले चुना हुआ scope देखें।", "Do not compare totals without matching scope, time period, metric and filters. / Chart ka context match karo.": "Chart की अवधि और संदर्भ भी मिलाएँ।", "It reduces the need to store application credentials for supported token-based access. / App mein password rakhne ki zaroorat kam hoti hai.": "App में password रखने की जरूरत कम होती है।", "The workload obtains a token and sends it to a supported target. The target still checks permissions. Networking and application driver support must also be correct. / Identity, target rights aur network tino chahiye.": "Identity, लक्ष्य की अनुमति और network तीनों चाहिए।", "A Web App uses its identity to read a Key Vault secret. / Secret read ke liye proper role chahiye.": "Secret पढ़ने के लिए सही role चाहिए।", "Web App → Identity. Inspect system-assigned status or user-assigned identities. Configure target permissions at the destination. / Target par role dena alag step hai.": "लक्ष्य पर role देना अलग चरण है।", "An identity alone does not grant SQL or Storage access. / Automatically full access nahi milta.": "अपने आप पूरा access नहीं मिलता।", "It helps place resources near users and required data locations. / Latency aur data requirements ke liye location choose karte hain.": "Latency और data की जरूरत के अनुसार स्थान चुनते हैं।", "You select a supported region during creation. Moving a resource later is service-specific; changing a group name does not relocate it. / Region change simple rename nahi.": "Region बदलना केवल नाम बदलना नहीं है।", "Central India can be evaluated for an India-based HRMS. / Availability aur requirements bhi check karo.": "उपलब्धता और आवश्यकताएँ भी जाँचें।", "Resource Overview → Location. Creation form → Region. / Actual deployment location dekho.": "वास्तविक deployment location देखें।", "Resource group region does not force all members into the same region. / Group metadata aur resource region alag hain.": "Group की metadata location और resource का region अलग हो सकते हैं।", "It supports higher availability when used correctly. / Failure ke dauran continuity improve ho sakti hai.": "Failure के दौरान सेवा जारी रखने में मदद मिल सकती है।", "Instances or replicas are placed according to the service zone configuration. Application and data layers must both be considered. / Sirf frontend multi-zone ho to DB single point ho sakta hai.": "केवल frontend multi-zone होने पर database कमजोर कड़ी हो सकता है।", "Two app instances in separate supported zones can survive one zone outage if dependencies also remain available. / Dependencies bhi resilient honi chahiye.": "निर्भर सेवाएँ भी resilient होनी चाहिए।", "Inspect Availability options during VM/service creation. Existing service zone changes may require redeployment or a different SKU. / Support tier-specific hai.": "समर्थन service tier पर निर्भर है।", "Zones are not different regions, and redundancy is not backup. / HA aur backup alag hain.": "High availability और backup अलग हैं।", "It provides network address space and connectivity boundaries. / Private network organize hota hai.": "Private network व्यवस्थित करता है।", "A VNet contains subnets. Interfaces receive private IP addresses. Connections to other networks need appropriate peering, gateways or service integration. / Subnet VNet ke andar hota hai.": "Subnet, VNet के भीतर होता है।", "10.20.0.0/16 VNet contains app subnet 10.20.1.0/24. / Range nested honi chahiye.": "Subnet range, VNet range के भीतर होनी चाहिए।", "Virtual networks → Create → IP addresses → add subnet → Review + create. / Address ranges aur optional add-ons check karo.": "Address ranges और अतिरिक्त सुविधाएँ जाँचें।", "VNet is not an automatic firewall and separate subnets do not automatically block traffic. / Rules alag configure karo.": "Network rules अलग configure करें।", "It separates address allocation and network configuration. / Network ko manageable ranges mein baantta hai.": "Network को प्रबंधनीय address ranges में बाँटता है।", "Choose a range contained within the VNet. Reserve enough addresses for expected resources and service requirements. Azure reserves addresses in each subnet. / Future capacity aur reserved addresses ko count karo.": "भविष्य की क्षमता और reserved addresses ध्यान में रखें।", "An app subnet and a private-endpoint subnet can have separate settings. / Service requirements match karo.": "सेवा की आवश्यकताओं से मिलान करें।", "VNet → Subnets → add or inspect a subnet. / Range, delegation aur NSG dekho.": "Range, delegation और NSG देखें।", "A /24 has 256 total IPv4 addresses, but not all are assignable in Azure. / Total aur usable addresses alag hain.": "कुल और उपयोग योग्य addresses अलग हैं।", "It enables private network communication. / Internal connectivity deta hai.": "आंतरिक connectivity देता है।", "The address is assigned from a subnet to a network interface or supported private endpoint. DNS and routes must lead clients to the correct destination. / Sirf IP nahi, route aur DNS bhi chahiye.": "IP के साथ route और DNS भी सही होने चाहिए।", "10.20.1.4 may be a VM private address in the lab subnet. / Ye sample address hai.": "यह केवल उदाहरण का address है।", "VM → Networking → network interface → IP configurations; private endpoint → network interface. / Resource-specific IP configuration dekho.": "संबंधित resource की IP configuration देखें।", "Private IP does not remove the need for authentication, authorization or network rules. / Private address full security nahi.": "Private address अपने आप पूरी सुरक्षा नहीं देता।", "It provides a public entry or exit address for supported resources. / Internet-facing connectivity ke liye use hota hai.": "Internet से connectivity के लिए उपयोग होता है।", "Attach it to a supported interface, load balancer or gateway. DNS can point a friendly name to the public endpoint. / Public address aur domain related par alag hain.": "Public address और domain जुड़े हुए, लेकिन अलग हैं।", "A test VM may have a public IP for restricted management access. / Management sources limited rakho.": "Management access के sources सीमित रखें।", "Public IP addresses → select resource → Overview and Configuration. / SKU, association aur cost inspect karo.": "SKU, association और खर्च देखें।", "An unused or unattached IP can still have charges depending on its type. / Unused ka matlab free nahi.": "इस्तेमाल न होने का अर्थ मुफ्त नहीं है।", "It lets applications use names rather than hard-coded addresses. / Friendly aur stable names use hote hain.": "याद रखने योग्य और स्थिर नाम इस्तेमाल कर सकते हैं।", "A resolver looks up records and caches results. Private endpoint clients must resolve the service name to the private address through correct DNS configuration. / Wrong DNS se wrong path milta hai.": "गलत DNS गलत network path दे सकता है।", "An API uses the SQL server hostname while DNS resolves the appropriate public or private route. / Hostname ko raw IP se replace mat karo.": "Hostname को सीधे IP से न बदलें।", "Azure DNS zones / Private DNS zones → select zone → Record sets. For a custom domain, follow the hosting service validation instructions. / Exact records use karo.": "सही DNS records इस्तेमाल करें।", "A DNS record alone does not configure TLS, user access or the hosting binding. / Domain complete setup ke multiple parts hain.": "Domain setup में कई हिस्से होते हैं।", "It defines VNet and subnet address spaces. / Network ki range set hoti hai.": "Network की address range तय करता है।", "10.20.0.0/16 includes 65,536 total IPv4 addresses. 10.20.1.0/24 includes 256 total addresses; Azure reserves five in each subnet. / Total se reserved addresses alag karo.": "कुल addresses में से reserved addresses घटाएँ।", "10.20.1.0/24 fits inside 10.20.0.0/16. / Dono ranges ka relation dekho.": "दोनों ranges का संबंध देखें।", "VNet → IP addresses / Subnets → inspect address prefix. / Prefix ko planning ke saath choose karo.": "योजना बनाकर prefix चुनें।", "Overlapping ranges complicate or prevent some network connections. / Peering ke liye overlap avoid karo.": "Peering के लिए overlapping ranges से बचें।", "It restricts network traffic for subnets and interfaces. / Required traffic hi allow karna aim hai.": "केवल आवश्यक traffic की अनुमति देना लक्ष्य है।", "Associate the NSG with a subnet or interface, then inspect effective rules. Multiple applicable rule sets and the OS firewall can affect connectivity. / Effective result dekho.": "प्रभावी rules का परिणाम देखें।", "Allow HTTPS 443, restrict SSH/RDP to approved sources. / Sabke liye management port open mat karo.": "Management port सभी के लिए न खोलें।", "Network security groups → resource → Inbound/Outbound security rules. / Association aur priority bhi verify karo.": "Association और priority भी जाँचें।", "NSG is not a WAF, login system or route table. / Inke roles alag hain.": "हर network component की भूमिका अलग है।", "It allows private-network access to a managed service. / Managed service tak private path milta hai.": "Managed service तक private रास्ता देता है।", "Endpoint approval, subresource selection, network connectivity and private DNS must all be correct. Public access settings are reviewed separately. / Public access automatically band samajhna galat hai.": "Public access अपने आप बंद हुआ न मानें।", "API reaches SQL via a private endpoint rather than an unrestricted public route. / Browser SQL ko direct nahi call karta.": "Browser सीधे SQL से बात नहीं करता।", "Target resource → Networking → Private endpoint connections. Review DNS and connected VNet as well. / DNS resolution verify karo.": "DNS resolution जाँचें।", "Creating the endpoint does not universally disable the public endpoint. / Public setting explicitly inspect karo.": "Public access setting अलग से देखें।", "It determines hosting capacity, features and cost. / App ko kitni capacity aur features milenge ye decide karta hai.": "App की क्षमता और सुविधाएँ तय करता है।", "An app is deployed into a plan. In paid dedicated tiers, provisioned plan capacity is billable even when an individual app is stopped. F1 has limited shared resources and quotas. / App Stop aur plan billing alag hain.": "App रोकना और plan की billing अलग हैं।", "A Web App row can show zero while its paid plan has the compute charge. / Cost plan par aa sakta hai.": "खर्च plan पर दर्ज हो सकता है।", "Web App → Overview → App Service plan, or search App Service plans → select plan. Read SKU and apps using it. / Shared apps inspect karo.": "Plan साझा करने वाली apps देखें।", "Changing or deleting a shared plan can affect several apps. Free F1 is not unlimited production hosting. / Tier deliberately choose karo.": "आवश्यकता के अनुसार tier चुनें।", "It hosts application code without requiring you to administer the underlying VM OS. / OS management ka kaam kam hota hai.": "Operating system प्रबंधन का काम कम होता है।", "Create the app, choose a compatible runtime and plan, publish code, then configure settings and connectivity. Creating an empty resource does not deploy your code. / Resource aur code deployment separate hain.": "Resource बनाना और code deploy करना अलग हैं।", "React frontend and .NET API are separate apps with appropriate runtimes. / Dono ka runtime match karo.": "Frontend और API का runtime सही चुनें।", "App Services → app → Overview, Deployment Center, Environment variables / Configuration and Log stream. Labels may vary. / Correct app select karo.": "सही app चुनें।", "Node runtime for a frontend does not mean the .NET API should also use Node. / Project runtime dekho.": "Project का runtime जाँचें।", "It makes deployment packaging repeatable across compatible container hosts. / Package repeatably run hota hai.": "Package को दोहराए जा सकने वाले तरीके से चलाता है।", "Build an image, push it to a registry and configure a host to pull a specific tag or digest. The host still needs ports, environment settings and access. / Image ke saath runtime config bhi chahiye.": "Image के साथ runtime configuration भी चाहिए।", "msr_api:20261023061344 is a historical image-and-tag example. / Ye sample historical tag hai.": "यह केवल पुराने tag का उदाहरण है।", "Container App → App → Containers → inspect registry, image and tag. / Secrets expose kiye bina details dekho.": "Secrets दिखाए बिना details देखें।", "An image is not a code publishing ZIP, and Blob containers are unrelated. / Container words ke meanings alag hain.": "Container शब्द अलग संदर्भों में अलग अर्थ रखता है।", "It runs an API or worker without directly managing Kubernetes infrastructure. / Container hosting simplify hoti hai.": "Containers की hosting आसान करता है।", "Pull the image from a registry, configure ingress and scaling, then route traffic to healthy revisions. Consumption offers a free grant; excess usage is billed. / Container hona alone paid reason nahi.": "केवल container इस्तेमाल करना खर्च का कारण नहीं है।", "Your earlier API had recorded usage cost while SQL was free. / Dono resources alag meters hain.": "Registry और चलने वाली app की billing अलग है।", "Container Apps → app → Containers, Revisions and replicas, Scale and Overview. / Cost Analysis mein resource wise dekho.": "Cost Analysis में resource के अनुसार देखें।", "Free allowance is not unlimited. Stopping the app does not prove registries, logs or dedicated environment costs stop. / Related costs inspect karo.": "संबंधित सेवाओं का खर्च भी देखें।", "Multiple copies can increase capacity or availability. / Zyada requests handle karne mein help mil sakti hai.": "अधिक requests संभालने में मदद मिल सकती है।", "A scheduler starts copies and a traffic layer distributes requests to healthy targets. Shared state and dependencies must support multiple copies. / Stateless design aur DB capacity matter karte hain.": "Stateless design और database की क्षमता भी मायने रखती है।", "Three API replicas can handle traffic concurrently. / Ek session local memory mein ho to issue aa sakta hai.": "Session केवल local memory में हो तो समस्या हो सकती है।", "Container App → Revisions and replicas; App Service plan → Scale out; VM scale set → Instances. / Service ka appropriate blade kholo.": "सेवा का संबंधित scaling section खोलें।", "More replicas do not automatically fix slow SQL queries. / Bottleneck identify karo.": "पहले bottleneck पहचानें।", "It supports version management, testing and traffic changes. / Deployment version ko manage karta hai.": "Deployment के version का प्रबंधन करता है।", "Change a revision-scoped setting to create a revision. Check health and traffic assignment before retiring the old version. / Healthy hona aur traffic milna alag checks hain.": "Healthy होना और traffic मिलना अलग जाँचें हैं।", "New image tag → new revision → test → traffic switch. / Rollback path rakho.": "Rollback का रास्ता रखें।", "Container App → Revisions and replicas → inspect active state, replicas and traffic. / Traffic percent verify karo.": "Traffic percentage जाँचें।", "A newly created revision may receive no traffic or fail startup. / Creation success full app success nahi.": "Version बन जाना पूरी app की सफलता नहीं है।", "It provides an image source for container hosts. / Host image yahan se pull karta hai.": "Host यहाँ से image pull करता है।", "Push an image under a repository name and tag. The running host authenticates to pull the selected image. Storage and registry tier are separate from execution cost. / Store karna aur run karna alag meters hain.": "Image रखना और चलाना अलग billing meters हैं।", "ACR stores msr_api; Container Apps runs it. / Godown aur execution ka difference.": "भंडारण और execution में अंतर समझें।", "Container registries → registry → Repositories. Inspect tags and host authentication without sharing credentials. / Tag aur access check karo.": "Tag और access जाँचें।", "A registry does not execute your API. Deleting a needed image may break future restarts or deployments. / Used image delete mat karo.": "इस्तेमाल हो रही image न हटाएँ।", "It stores structured application records and executes database operations. / Employee aur attendance records ka store.": "Employee और attendance records रखता है।", "The API authenticates and connects to the database, executes queries and returns selected results. Compute usage and stored data size are different measures. / Chhota data bhi compute consume kar sakta hai.": "कम data भी compute उपयोग कर सकता है।", "HRMS API returns employee JSON after a parameterized SQL query. / Browser SQL ko direct query nahi karta.": "Browser सीधे SQL query नहीं करता।", "SQL databases → database → Overview and Compute + storage. Inspect free amount, status and overage behavior for the actual offer. / Free plan explicitly verify karo.": "Free offer स्पष्ट रूप से जाँचें।", "Logical SQL server at ₹0 does not prove every database is free. A paused free DB can block API data tests. / Exact resource check karo.": "सही database resource देखें।", "It provides the server hostname and relevant shared settings. / Database access ka hostname aur settings deta hai.": "Database access के लिए hostname और settings देता है।", "Databases under the server have their own compute/storage configuration. Server-level networking and identity settings affect access. / Actual DB ka pricing alag inspect hota hai.": "वास्तविक database की pricing अलग देखें।", "msrhrmsdb.database.windows.net is a historical logical-server hostname example. / Ye VM computer name nahi.": "यह VM का computer name नहीं है।", "SQL servers → select server → Overview, Networking and authentication settings. / Database list bhi dekho.": "Database की सूची भी देखें।", "The term SQL Server also names a software product; do not confuse logical Azure server with a SQL VM. / Context important hai.": "Server शब्द का संदर्भ समझें।", "It describes or meters processing capacity. / Compute ka size ya usage samajhne ke liye.": "Compute का आकार या उपयोग समझने की इकाई है।", "As a simple arithmetic example, 2 vCores for 10 seconds equals 20 vCore-seconds. Actual billable usage depends on the service minimums, memory and scaling rules. / Ye arithmetic example hai, final billing formula nahi.": "यह गणना का उदाहरण है, अंतिम billing formula नहीं।", "A 25 MB database can exhaust its monthly free compute allowance. / Storage aur compute alag limits hain.": "Storage और compute की सीमाएँ अलग हैं।", "SQL database → Compute + storage / free amount metric; VM → Size; Container App → CPU allocation. / Service-specific measure dekho.": "सेवा के अनुसार माप देखें।", "A vCPU is not always a whole dedicated physical CPU core. / Virtual capacity ko physical hardware se equal mat samjho.": "Virtual capacity को physical hardware के बराबर न मानें।", "It holds actively used data and process state. / App ka active working area.": "App का सक्रिय working area है।", "Applications and caches consume memory. When capacity is exceeded, the service may fail, throttle or evict cache entries according to its design. / Memory finite hoti hai.": "Memory सीमित होती है।", "A 32 GB server cannot hold 1 TB of uncompressed data entirely in RAM. / Popular subset cache karo.": "लोकप्रिय data का सीमित हिस्सा cache करें।", "Check process/service metrics, VM size or container memory allocation. / Actual memory usage measure karo.": "वास्तविक memory उपयोग मापें।", "Adding disk space does not increase RAM. Caching also needs an eviction and refresh design. / Storage aur RAM mix mat karo.": "Storage और RAM अलग हैं।", "It reduces repeated connection setup work. / Har query ke liye physical connection banana avoid hota hai.": "हर query के लिए नया physical connection बनाने से बचाता है।", "Open borrows a connection when available; Dispose releases it after work. Pools depend on configuration and connection identity. Pool capacity must fit application concurrency and database limits. / Connection ko short time hold karo.": "Connection कम समय तक रखें।", "Use a connection within a using block for one operation, then release it. / Kaam khatam to dispose.": "काम पूरा होने पर connection dispose करें।", "This is mainly application-code configuration, not a universal Azure Portal switch. Inspect connection string and telemetry without exposing credentials. / Code aur driver settings dekho.": "Code और driver की settings देखें।", "Increasing the pool to 1000 can overload SQL or hide leaks. / Pehle slow query aur leaked connections check karo.": "पहले slow queries और leaked connections जाँचें।", "It speeds appropriate repeated reads and can support shared transient state. / Popular reads fast ho sakti hain.": "लोकप्रिय data जल्दी पढ़ सकते हैं।", "In cache-aside, read cache first. On miss, read SQL, store the result with expiry and return it. Define invalidation, memory limits and failure behavior. / Miss aur stale data ka rule clear rakho.": "Cache miss और पुराने data के नियम स्पष्ट रखें।", "Cache district summaries instead of every raw row from all 55 districts. / Required subset store karo.": "आवश्यक data का सीमित हिस्सा रखें।", "Current Azure managed offering: inspect Azure Managed Redis, tier, region and network settings. Cache logic still belongs in application code. / Resource banana alone cache implement nahi karta.": "Resource बनाने से app में caching अपने आप लागू नहीं होती।", "Cache does not guarantee fresh data and cannot fit unlimited data into small RAM. / Expiry aur capacity plan karo.": "Expiry और capacity की योजना बनाएँ।", "It exposes controlled application operations to clients. / Frontend ko required business operation deta hai.": "Frontend को आवश्यक business operations देता है।", "The API validates input, applies authorization, runs business logic, accesses dependencies and returns a response. It can be hosted on different Azure services. / Hosting platform aur API code alag hain.": "Hosting platform और API code अलग हैं।", "GET /employees returns authorized employee records from SQL. / Client ko sirf allowed data mile.": "Client को केवल अनुमत data मिले।", "Inspect the hosting resource: Web App or Container App. API routes and business logic come from deployed code, not from naming the Azure resource. / Resource ka naam API implement nahi karta.": "Resource का नाम रखने से API लागू नहीं होती।", "Never expose a database password in frontend JavaScript. / DB access backend kare.": "Database access backend करे।", "It presents data and collects user actions. / UI aur user experience ka layer.": "User interface और अनुभव की परत है।", "It requests authorized data from an API and displays results. Static build-time configuration may need a rebuild when the API URL changes. / API base URL update ke baad build lag sakti hai.": "API base URL बदलने पर नया build जरूरी हो सकता है।", "React displays the employee table after receiving JSON from the API. / Database se direct connection nahi.": "सीधे database से connection नहीं करता।", "Open the frontend Web App and its deployment workflow; inspect build settings and API base URL in the project. / Backend app ko overwrite mat karo.": "Frontend deploy करते समय backend overwrite न करें।", "Browser-delivered code is inspectable; environment variables included in a frontend bundle are not secret. / Frontend env ko secret store mat samjho.": "Frontend environment को secrets का सुरक्षित भंडार न मानें।", "It supports intentional browser access across origins. / Alag frontend/API origins ke liye.": "अलग frontend और API origins के लिए काम आता है।", "The browser may send a preflight request. API CORS configuration must match scheme, host and port, and credential requirements. / Exact origin match karo.": "Origin का सटीक मिलान करें।", "Frontend https://hrms.example.com calls https://api.example.com. / Dono origins alag hain.": "दोनों origins अलग हैं।", "Configure CORS in the API code or supported hosting CORS blade. Avoid conflicting duplicate policies. / Code aur hosting policies check karo.": "Code और hosting की policies देखें।", "CORS is not authentication and does not stop non-browser clients from calling a public API. / API auth alag chahiye.": "API authentication अलग चाहिए।", "It supplies the language execution platform. / App ko required environment deta hai.": "App को चलने का आवश्यक वातावरण देता है।", "The runtime version must match the project and supported hosting options. Startup commands and deployment output must also be compatible. / Version aur publish output match karo.": "Version और publish output का मिलान करें।", "A React build workflow can use Node while a separate API uses .NET. / Dono ko ek runtime force mat karo.": "अलग applications को एक runtime में चलाने की मजबूरी न रखें।", "Web App → Configuration / Stack settings or creation form → Runtime stack. Read lifecycle warnings. / Supported version choose karo.": "समर्थित version चुनें।", "Switching a runtime cannot convert one language’s code into another. / Node select karne se .NET API run nahi hogi.": "Node चुनने से .NET API नहीं चलेगी।", "It makes tested source changes available in a hosting environment. / Code ko running version tak le jata hai.": "Code को चलने वाले version तक पहुँचाता है।", "Check out code, build, test, authenticate and publish. Read each stage separately to find the first failure. / Har stage ka error alag diagnose karo.": "हर चरण की त्रुटि अलग पहचानें।", "Artifact upload failure is different from Azure login failure or startup failure. / Ek error ko dusri layer se fix mat karo.": "एक स्तर की त्रुटि दूसरे स्तर के बदलाव से ठीक न करें।", "Web App → Deployment Center; GitHub → repository → Actions → latest commit run. / Current workflow version dekho.": "वर्तमान workflow version देखें।", "A green deployment can still serve an unhealthy application. Test its endpoint and logs. / Deploy success aur user flow success alag hain.": "Deploy सफल होना और user flow सफल होना अलग हैं।", "It supports trusted workflow authentication. / Specific workflow ko token-based login deta hai.": "विशिष्ट workflow को token आधारित login देता है।", "The token issuer, audience and subject must match Azure trust configuration. The identity also needs permission on the intended deployment target. / Trust match aur role dono chahiye.": "Trust का मिलान और role दोनों चाहिए।", "A repo branch or GitHub environment is trusted to deploy one Web App. / Exact source boundary set hoti hai.": "अनुमत source की सटीक सीमा तय होती है।", "Deployment Center authentication settings and the chosen identity’s Federated credentials. Inspect workflow id-token permissions and matching IDs. / Exact subject compare karo.": "Subject का सटीक मिलान करें।", "Creating new trust grants security-sensitive access; do not broaden repo/branch scope to hide a configuration error. / Narrow trust rakho.": "Trust की सीमा संकीर्ण रखें।", "It transfers or retains build output between jobs and runs. / Build output preserve hota hai.": "Build का output सुरक्षित रखता है।", "The workflow uploads files, then another stage may download and deploy them. Retention determines future expiry. Existing artifacts are not removed by changing new upload retention. / Purane artifacts alag delete hote hain.": "पुराने artifacts अलग से हटाने पड़ते हैं।", "Quota hit during CreateArtifact means output upload failed. / Ye necessarily compile error nahi.": "यह जरूरी नहीं कि compilation error हो।", "GitHub repository → Actions → workflow run → Artifacts. Manage unneeded artifacts or revise workflow architecture. / Usage recalculation delay ho sakta hai.": "Usage दोबारा गणना होने में समय लग सकता है।", "Never delete a needed artifact before a dependent job has used it. / Running deployment ka dependency check karo.": "चलते deployment की dependency पहले जाँचें।", "It shows which services and resources produced usage charges. / Kharcha kahan se aaya ye pata chalta hai.": "खर्च किस सेवा से आया, पता चलता है।", "Choose period and scope, inspect filters, then group by service and resource. Credits, invoice and outstanding balance must be interpreted separately. / Usage ko direct amount due mat samjho.": "दर्ज usage को सीधे बकाया भुगतान न मानें।", "A group named DB can show a Container Apps charge. / Group label billing service nahi.": "Group का नाम billing service नहीं है।", "Cost Management → Cost analysis → Actual cost → This month → Group by Service name / Resource. / Same scope aur date compare karo.": "समान scope और तारीख की तुलना करें।", "Data can arrive late. Do not subtract a reported monthly usage total from an already adjusted available-credit balance again. / Double subtraction avoid karo.": "Credit दो बार न घटाएँ।", "It provides a limited trial or promotional benefit. / Paid usage ko temporary cover karta hai.": "योग्य paid usage अस्थायी रूप से cover करता है।", "Usage consumes eligible balance. Expiry behavior depends on subscription offer and upgrade state; do not assume every credit renews monthly. / Offe ica backup ka universal replacement nahi.": "Replica हर स्थिति में backup का विकल्प नहीं है।", "Restore HRMS SQL to a test DB and verify employee records. / Production overwrite kiye bina test karo.": "Production overwrite किए बिना recovery test करें।", "Use the resource-specific Backups/Restore blade or Backup center/vault workflow. / Service-specific recovery process follow karo.": "सेवा की recovery प्रक्रिया अपनाएँ।", "A lock is not a backup; replicated bad data can still be bad. / Recovery copy verify karo.": "Recovery copy की जाँच करें।", "It guides backup or replication frequency. / Recovery point kitna fresh chahiye.": "Recovery point कितना नया चाहिए, बताता है।", "Compare business tolerance with actual recovery points and tested data freshness. / Requirement aur result compare karo.": "आवश्यकता और वास्तविक परिणाम की तुलना करें।", "RPO of one hour means up to an hour of data loss may be acceptable, not guaranteed by writing the target down. / Setup ko target meet karna hoga.": "Setup को recovery target पूरा करना होगा।", "Document the target, then inspect backup/replication schedules and restore tests. / Portal mein target bolne se guarantee nahi.": "Portal में target दर्ज करने से guarantee नहीं बनती।", "RPO is not the time needed to bring the app back online. / Wo RTO hai.": "सेवा लौटाने का समय RTO है।", "It guides recovery architecture and operational readiness. / Kitni jaldi service chahiye.": "सेवा कितनी जल्दी लौटनी चाहिए, बताता है।", "Measure detection, restore, configuration, DNS/traffic changes and validation during a recovery test. / Full recovery time measure karo.": "पूरी recovery का समय मापें।", "A two-hour RTO requires a rehearsed recovery process that fits two hours. / Sirf policy select karna enough nahi.": "केवल policy चुनना पर्याप्त नहीं है।", "Use a recovery runbook and timed test with service-specific restore workflows. / Test se evidence milega.": "Test से वास्तविक प्रमाण मिलेगा।", "RTO and RPO are different targets. / Downtime aur data freshness alag hain.": "Downtime और data की ताजगी अलग हैं।", "It shows operational trends and alert conditions. / Performance pattern samajh aata hai.": "Performance के pattern समझ आते हैं।", "Collect samples and display average, max, total or another supported aggregation. Choose the one that answers the question. / Average spike ko hide kar sakta hai.": "Average छोटे spikes छिपा सकता है।", "Low CPU with slow API may mean waiting on SQL. / CPU akela health report nahi.": "CPU अकेला पूरी health report नहीं है।", "Resource → Monitoring → Metrics → choose signal, time range and aggregation. / Correct chart context dekho.": "Chart का scope और समय सही चुनें।", "A chart with no data may mean telemetry is missing, not that everything is healthy. / Missing data investigate karo.": "Missing data का कारण जाँचें।", "It helps investigate the reason behind a symptom. / Error ka detail context milta hai.": "त्रुटि का विस्तृत संदर्भ मिलता है।", "Enable appropriate collection, select the right workspace and time range, then correlate requests, errors and dependencies. / Sensitive values log mat karo.": "संवेदनशील values log न करें।", "An SQL timeout exception explains a failed API request. / Error aur request trace connect karo.": "Error और request trace को जोड़ें।", "Resource → Logs / Log stream / Activity log, according to the question. / Inko interchangeable mat samjho.": "अलग प्रकार के logs को समान न मानें।", "No records can mean collection was off or filters are wrong. / Empty result no-issue proof nahi.": "खाली result समस्या न होने का प्रमाण नहीं है।", "It helps explain application performance and failures. / Slow request ka dependency reason mil sakta hai.": "धीमी request की dependency का कारण पता चल सकता है।", "Instrument the app and correlate operations across dependencies. Sampling, retention and data collection affect what is visible and what it costs. / Every event stored assume mat karo.": "हर event store हुआ न मानें।", "Find a slow request and inspect its SQL dependency d <script>
(() => {
  const bank = JSON.parse(document.getElementById('az900-bank').textContent);
  const advanced = JSON.parse(document.getElementById('az900-advanced').textContent);
  const domains = { C: 'Cloud concepts', A: 'Azure architecture and services', G: 'Azure management and governance' };
  const levels = [
    ['Easy', 'Recognize core terms and definitions.'],
    ['Foundation', 'Distinguish closely related services and concepts.'],
    ['Moderate', 'Choose a service for a practical requirement.'],
    ['Challenging', 'Evaluate statements and match concepts to requirements.'],
    ['Hard', 'Select multiple services for combined requirements.'],
    ['Very Hard', 'Compare plausible designs across several constraints.'],
    ['Hardest', 'Solve grouped case questions and validate service combinations.'],
    ['Extreme', 'Resolve three-part designs and subtle trade-offs under time pressure.']
  ];
  const cases = {
    C: 'A company is modernizing payroll and employee services. It must choose a cloud model, a service model and a way to pay for workloads.',
    A: 'A company is moving its HRMS to Azure. Its team must choose deployment boundaries, connectivity, hosting, storage and identity services.',
    G: 'An operations team governs several Azure subscriptions. It must manage deployment standards, spending, outages and application performance.'
  };
  const key = 'azure-handbook-az900-v1';
  const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const shuffle = items => {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch {}
  let attempt = saved.attempt || null;
  const results = Array.isArray(saved.results) ? saved.results : [];
  const persist = () => {
    try { localStorage.setItem(key, JSON.stringify({ attempt, results: results.slice(0, 32) })); } catch {}
  };

  function question(item, index, level) {
    const [domain, term, definition, scenario, distractors, explanation] = item;
    const peers = bank.filter(other => other[0] === domain);
    const position = peers.indexOf(item);
    const second = peers[(position + 1 + level) % peers.length];
    const third = peers[(position + 3 + level) % peers.length];
    const choices = [term, ...distractors.split(';')];
    const caseText = level >= 6 ? cases[domain] : '';
    const base = { domain, caseText, explanation };
    const single = (prompt, options, correct) => ({
      ...base, type: 'single', prompt, options: shuffle(options), correct: [correct]
    });
    const matching = count => {
      const rows = [item, second, third].slice(0, count);
      return {
        ...base, type: 'match', prompt: 'Match each requirement to the best answer.',
        rows: rows.map(row => row[3]),
        options: shuffle([...new Set(rows.map(row => row[1]).concat(distractors.split(';')))]),
        correct: rows.map(row => row[1]), explanation: rows.map(row => row[5]).join(' ')
      };
    };
    const multiple = count => {
      const rows = [item, second, third].slice(0, count);
      const correct = rows.map(row => row[1]);
      const wrong = [...new Set(rows.flatMap(row => row[4].split(';')))].filter(value => !correct.includes(value));
      return {
        ...base, type: 'multi', prompt: 'Select exactly ' + count + ' answers, one for each requirement.',
        rows: rows.map(row => row[3]), options: shuffle(correct.concat(wrong.slice(0, count + 1))),
        correct, explanation: rows.map(row => row[5]).join(' ')
      };
    };
    const yesNo = () => {
      const correct = (index + level) % 3 === 0;
      const proposed = correct ? term : choices[1 + index % 3];
      return single(scenario + ' Would ' + proposed + ' meet this requirement?', ['Yes', 'No'], correct ? 'Yes' : 'No');
    };
    if (level === 0) return single('Which term matches this description? ' + definition, choices, term);
    if (level === 1) {
      const options = [definition, ...[second, third, peers[(position + 5) % peers.length]].map(row => row[2])];
      return single('Which statement best describes ' + term + '?', options, definition);
    }
    if (level === 2) return index % 5 === 0 ? yesNo() : single(scenario + ' Which option best fits?', choices, term);
    if (level === 3) return index % 3 === 0 ? matching(2) : index % 3 === 1 ? yesNo() : single(scenario + ' Which option best fits?', choices, term);
    if (level === 4) return index % 3 === 0 ? multiple(2) : index % 3 === 1 ? matching(2) : yesNo();
    if (level === 5) return index % 3 === 0 ? multiple(3) : index % 3 === 1 ? matching(3) : multiple(2);
    if (level === 6) return index % 3 === 0 ? yesNo() : index % 3 === 1 ? multiple(3) : matching(3);
    return index % 2 === 0 ? matching(3) : multiple(3);
  }

  function examQuestions(level) {
    const questions = bank.map((item, index) => question(item, index, level));
    if (level >= 6) {
      const offsets = { C: 0, A: 0, G: 0 };
      for (const [domain, prompt, requirements, answers, wrong, explanation] of advanced) {
        const indices = questions.flatMap((q, i) => q.domain === domain ? [i] : []);
        const offset = offsets[domain]++;
        const type = level === 7 && offset % 2 === 0 ? 'multi' : 'match';
        const correct = answers.split(';');
        questions[indices[offset]] = {
          domain, type, caseText: cases[domain], prompt: prompt.replace(/(?:Match|Choose) [^.]+[.]$/, '') + (type === 'multi' ? 'Select exactly ' + correct.length + ' answers.' : 'Match each requirement to the best answer.'),
          rows: requirements.split(';'), correct, options: shuffle(correct.concat(wrong.split(';'))), explanation
        };
      }
      return Object.keys(domains).flatMap(domain => shuffle(questions.filter(q => q.domain === domain)));
    }
    return shuffle(questions);
  }

  const dialog = document.createElement('dialog');
  dialog.className = 'az900-dialog';
  dialog.setAttribute('aria-labelledby', 'az900-title');
  document.body.append(dialog);
  const entry = document.createElement('button');
  entry.type = 'button';
  entry.className = 'btn primary az900-entry';
  entry.textContent = 'AZ-900 Mock Exams';
  document.querySelector('header .controls').prepend(entry);
  setInterval(() => {
    if (!attempt || attempt.finished) return;
    const remaining = Math.max(0, Math.ceil((attempt.end - Date.now()) / 1000));
    if (!remaining) { finish(true); return; }
    const target = dialog.querySelector('[data-clock]');
    if (target) target.textContent = time(remaining);
  }, 250);
  function time(seconds) {
    return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  }
  function frame(title, content) {
    dialog.innerHTML = '<div class="az900-head"><div><span class="tag">AZ-900 PRACTICE</span><h2 id="az900-title">' + escape(title) +
      '</h2></div><button type="button" class="btn" data-action="close">Close</button></div>' + content;
  }
  function dashboard() {
    frame('Azure Fundamentals exam room',
      '<p>Eight practice forms with shared topics and different question formats. Each has 40 questions and a 45-minute timer. The skill mix is 11 Cloud, 16 Architecture and 13 Governance questions. Forms are in English to simulate the English exam.</p>' +
      '<p class="tiny">Practice scoring uses whole-question accuracy. Microsoft uses a separate scaled score and does not publish the exact format for each exam. The timer keeps running when you close this window.</p>' +
      (attempt?.finished ? '<button class="btn" data-action="resume">Review last result</button>' : '') +
      (attempt && !attempt.finished ? '<button class="btn primary" data-action="resume">Resume ' + levels[attempt.level][0] + '</button>' : '') +
      '<div class="az900-grid">' + levels.map(([name, description], index) => {
        const best = Math.max(-1, ...results.filter(result => result.level === index).map(result => result.score));
        return '<button class="az900-card" data-level="' + index + '"' + (attempt && !attempt.finished ? ' disabled' : '') +
          '><small>LEVEL ' + (index + 1) + '</small><strong>' + name + '</strong><span>' + description +
          '</span><small>' + (best >= 0 ? 'Best ' + best + ' / 40' : '40 questions · 45 min') + '</small></button>';
      }).join('') + '</div><p><a href="https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900" target="_blank" rel="noopener">Microsoft study guide and exam sandbox</a></p>');
  }
  function start(level) {
    attempt = {
      level, end: Date.now() + 45 * 60 * 1000, index: 0, answers: {}, flags: {},
      questions: examQuestions(level)
    };
    persist();
    showQuestion();
  }
  function answered(index) {
    const response = attempt.answers[index] || [];
    const q = attempt.questions[index];
    return q.type === 'single' ? response.length === 1 : response.length === q.correct.length && response.every(Boolean);
  }
  function correct(index) {
    if (!answered(index)) return false;
    const response = attempt.answers[index], q = attempt.questions[index];
    return q.type === 'match' ? q.correct.every((value, i) => response[i] === value)
      : q.correct.every(value => response.includes(value));
  }
  function palette() {
    return '<div class="az900-palette" aria-label="Question navigator">' + attempt.questions.map((_, i) =>
      '<button class="btn' + (answered(i) ? ' az900-done' : '') + '" data-jump="' + i + '" aria-current="' + (i === attempt.index ? 'step' : 'false') +
      '" aria-label="Question ' + (i + 1) + (answered(i) ? ', answered' : ', unanswered') + (attempt.flags[i] ? ', marked' : '') +
      '">' + (i + 1) + (attempt.flags[i] ? ' ⚑' : '') + '</button>').join('') + '</div>';
  }
  function showQuestion() {
    if (attempt.finished) { scorecard(); return; }
    if (Date.now() >= attempt.end) { finish(true); return; }
    const index = attempt.index, q = attempt.questions[index], response = attempt.answers[index] || [];
    let inputs;
    if (q.type === 'match') {
      inputs = q.rows.map((row, i) => '<label class="az900-option"><span>' + escape(row) + '</span><select data-match="' + i + '">' +
        '<option value="">Choose an answer</option>' + q.options.map(option => '<option' + (response[i] === option ? ' selected' : '') + '>' +
        escape(option) + '</option>').join('') + '</select></label>').join('');
    } else {
      inputs = (q.rows ? '<ol>' + q.rows.map(row => '<li>' + escape(row) + '</li>').join('') + '</ol>' : '') +
        q.options.map((option, i) => '<label class="az900-option"><input data-option="' + i + '" name="az900-answer" type="' +
          (q.type === 'multi' ? 'checkbox' : 'radio') + '"' + (response.includes(option) ? ' checked' : '') +
          '> <span>' + escape(option) + '</span></label>').join('');
    }
    frame(levels[attempt.level][0] + ' mock exam',
      '<div class="az900-meta"><span>Question ' + (index + 1) + ' of 40 · ' + domains[q.domain] + '</span><strong data-clock>' +
      time(Math.max(0, Math.ceil((attempt.end - Date.now()) / 1000))) + '</strong></div>' +
      (q.caseText ? '<aside class="note">' + escape(q.caseText) + '</aside>' : '') +
      '<fieldset><legend>' + escape(q.prompt) + '</legend>' + inputs + '</fieldset>' +
      '<div class="az900-actions"><button class="btn" data-action="prev"' + (!index ? ' disabled' : '') +
      '>Previous</button><button class="btn" data-action="flag" aria-pressed="' + !!attempt.flags[index] + '">' +
      (attempt.flags[index] ? 'Unmark question' : 'Mark for review') + '</button><button class="btn" data-action="clear">Clear answer</button>' +
      '<button class="btn primary" data-action="' + (index < 39 ? 'next' : 'review') + '">' +
      (index < 39 ? 'Next' : 'Review exam') + '</button><button class="btn" data-action="review">Review &amp; submit</button></div>' +
      '<div data-palette>' + palette() + '</div>');
  }
  function review() {
    const answeredCount = attempt.questions.filter((_, i) => answered(i)).length;
    frame('Review before submitting',
      '<div class="az900-meta"><span>' + answeredCount + ' of 40 answered · ' + Object.values(attempt.flags).filter(Boolean).length +
      ' marked</span><strong data-clock></strong></div><p>Select any question to revisit it, or submit to see your result.</p>' +
      palette() + '<div class="az900-actions"><button class="btn" data-action="resume">Return to question</button>' +
      '<button class="btn primary" data-action="submit">Submit exam</button></div>');
  }
  function finish(expired) {
    if (attempt.finished) return;
    attempt.finished = true;
    attempt.expired = expired;
    attempt.score = attempt.questions.filter((_, i) => correct(i)).length;
    results.unshift({ level: attempt.level, score: attempt.score, date: Date.now() });
    persist();
    if (dialog.open) scorecard();
  }
  function scorecard() {
    const breakdown = Object.entries(domains).map(([key, name]) => {
      const indices = attempt.questions.flatMap((q, i) => q.domain === key ? [i] : []);
      return '<li>' + name + ' · ' + indices.filter(correct).length + ' / ' + indices.length + '</li>';
    }).join('');
    frame('Your score · ' + attempt.score + ' / 40',
      '<p>' + (attempt.expired ? 'Time expired and the exam was submitted. ' : '') +
      'Practice accuracy ' + Math.round(attempt.score / 40 * 100) + '%.</p><ul>' + breakdown + '</ul>' +
      '<button class="btn primary" data-action="dashboard">All exam levels</button><div class="az900-solutions">' +
      attempt.questions.map((q, i) => {
        const response = attempt.answers[i] || [];
        const answerText = q.type === 'match' ? q.correct.map((value, j) => q.rows[j] + ' → ' + value).join(' · ') : q.correct.join(' · ');
        return '<details><summary>' + (i + 1) + '. ' + (correct(i) ? 'Correct' : answered(i) ? 'Incorrect' : 'Unanswered or incomplete') +
          ' · ' + escape(q.prompt) + '</summary>' +
          (q.rows && q.type !== 'match' ? '<ol>' + q.rows.map(row => '<li>' + escape(row) + '</li>').join('') + '</ol>' : '') +
          '<p><b>Your answer</b> ' + escape(response.filter(Boolean).join(' · ') || '—') +
          '</p><p><b>Correct answer</b> ' + escape(answerText) + '</p><p>' + escape(q.explanation) + '</p></details>';
      }).join('') + '</div>');
  }
  dialog.addEventListener('change', event => {
    const target = event.target, index = attempt.index, q = attempt.questions[index];
    if (Date.now() >= attempt.end) { finish(true); return; }
    if (target.matches('[data-match]')) {
      const response = attempt.answers[index] || Array(q.correct.length).fill('');
      response[Number(target.dataset.match)] = target.value;
      attempt.answers[index] = response;
    } else if (target.matches('[data-option]')) {
      attempt.answers[index] = Array.from(dialog.querySelectorAll('[data-option]:checked'),
        input => q.options[Number(input.dataset.option)]);
    }
    persist();
    dialog.querySelector('[data-palette]').innerHTML = palette();
  });
  dialog.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.level !== undefined) { start(Number(button.dataset.level)); return; }
    if (button.dataset.jump !== undefined) {
      attempt.index = Number(button.dataset.jump); persist(); showQuestion(); return;
    }
    switch (button.dataset.action) {
      case 'close': dialog.close(); return;
      case 'dashboard': dashboard(); return;
      case 'resume': showQuestion(); return;
      case 'review': review(); return;
      case 'submit': finish(Date.now() >= attempt.end); return;
      case 'prev': attempt.index--; break;
      case 'next': attempt.index++; break;
      case 'flag': attempt.flags[attempt.index] = !attempt.flags[attempt.index]; break;
      case 'clear': delete attempt.answers[attempt.index]; break;
      default: return;
    }
    persist();
    showQuestion();
  });

e=''};let from=lessons.findIndex(l=>'#'+l.id===location.hash);if(from>=0){current=from;view='lesson'}render();
</script><dialog id="concept-dialog" class="concept-dialog" aria-labelledby="concept-title"><div class="modal-head"><div><button id="concept-back" aria-label="Previous concept">←</button> <button id="concept-forward" aria-label="Next concept">→</button> </div><div><select id="concept-lang" aria-label="Concept language"><option value="en">English</option><option value="hi">Hinglish</option></select> <button id="concept-close" aria-label="Close concept details">Close ✕</button></div></div><div id="concept-trail" class="modal-trail"></div><div id="concept-body" class="modal-body"></div></dialog><div id="concept-tooltip" class="concept-tooltip" role="tooltip" hidden></div><script id="concept-data" type="application/json">[{"id": "concept-1", "name": "Tenant", "aliases": ["Tenant", "tenant", "tenants", "directory", "Microsoft Entra tenant"], "en": "A tenant is a dedicated identity directory in Microsoft Entra ID. It contains users, groups, application registrations and workload identities. It represents an identity boundary; it is not a rented server, a database or a billing balance.", "hi": "Tenant Microsoft Entra ID ki dedicated identity directory hai. Ismein users, groups, application registrations aur workload identities hote hain. Isko company ki identity register book samjho. Ye server, database ya credit balance nahi hai.", "purpose": "It keeps organizational identities and sign-in configuration together. / Organization ki identities aur sign-in settings ek jagah manage hoti hain.", "working": "A user signs in through a tenant. Azure then evaluates authorization for the requested subscription or resource. A subscription trusts one tenant at a time, while a tenant can be associated with multiple subscriptions. External users can also be invited. / Login identity tenant se aati hai; resource par action role aur scope ke hisaab se milta hai.", "example": "Your HRMS can have employee and app identities in one tenant, with separate development and production subscriptions. / Ek identity directory, multiple billing scopes ho sakte hain.", "portal": "Portal → search Microsoft Entra ID → Overview. Read the Tenant ID and primary domain. To check the active directory, use the account menu or portal directory filter. Viewing it does not require creating a new tenant. / Naya tenant banaye bina existing directory inspect karo.", "mistake": "Tenant and subscription are not the same. A tenant does not itself supply VM capacity or automatically grant users access to every resource. / Tenant hona aur subscription Owner hona alag baatein hain.", "related": ["Microsoft Entra ID", "Subscription", "RBAC", "Managed identity"], "chapter": 1}, {"id": "concept-2", "name": "Subscription", "aliases": ["Subscription", "subscriptions", "Azure subscription"], "en": "An Azure subscription is a billing and resource-management boundary. It contains resource groups and resources and is associated with a Microsoft Entra tenant. Its offer determines credits, spending protection and some service eligibility.", "hi": "Subscription Azure ka billing aur management scope hai. Iske andar resource groups aur resources hote hain. Ye ek Entra tenant se associated hoti hai. Offer ke hisaab se credits aur free service eligibility milti hai.", "purpose": "It separates ownership, billing, quotas and administrative scopes. / Billing aur management ko alag organize karta hai.", "working": "A resource is deployed into a subscription. Usage is recorded against billing meters and authorized actions are checked at inherited or direct scopes. / Resource ka usage subscription ke billing system mein record hota hai.", "example": "Keep learning resources separate from a production subscription. / Learning aur production ka bill aur access alag rakha ja sakta hai.", "portal": "Portal → search Subscriptions → select the exact subscription → Overview. Inspect status and offer; use Cost analysis for usage and Billing for invoices where available. / Sirf naam nahi, status aur billing bhi dekho.", "mistake": "A subscription name is a label, not proof of a free plan. A monthly budget is not an automatic spending cap. / Naam free hone se service free nahi.", "related": ["Tenant", "Resource group", "Resource", "Budget", "Credit"], "chapter": 1}, {"id": "concept-3", "name": "Resource group", "aliases": ["Resource group", "resource groups", "Resource Group"], "en": "A resource group is a logical management container for related Azure resources. A resource belongs to one resource group at a time. Resources in a group can be in different regions. Permissions and policies can be applied at group scope.", "hi": "Resource group related Azure resources ka logical folder hai. Ek resource ek time par ek resource group mein hota hai. Group ke members alag regions mein ho sakte hain.", "purpose": "It organizes lifecycle, access and cost reporting. / Project ko organize aur manage karna easy hota hai.", "working": "Create the group, then deploy resources into it. Group-level operations can affect members. Deleting a group can delete its contained resources, so it is a lifecycle boundary, not just a harmless visual folder. / Group delete karne se andar ke resources bhi ja sakte hain.", "example": "hrms-db can contain SQL Database, Container Apps and a registry. The group total adds their charges even if SQL costs zero. / Naam DB hai, par charges dusri service ke ho sakte hain.", "portal": "Portal → Resource groups → select a group → Overview. Inspect the Type column for each resource. Cost analysis → Group by Resource or Service name reveals which member is charged. / Type column aur cost breakdown dekho.", "mistake": "The group name does not identify the billing service. Group location also does not force every member into that region. / Group ka naam aur member type alag hain.", "related": ["Subscription", "Resource", "Region", "Cost analysis"], "chapter": 1}, {"id": "concept-4", "name": "Resource", "aliases": ["Resource", "resources", "Azure resource"], "en": "A resource is an individually manageable Azure item, such as a web app, VM, database, network interface or storage account. Some resources are standalone products; others are supporting configuration or infrastructure.", "hi": "Resource Azure ka manageable item hai, jaise Web App, VM, database ya network interface. Har resource alag product nahi hota; kuch supporting infrastructure hote hain.", "purpose": "It provides a specific capability that can be configured and governed. / Har item ka specific kaam aur settings hoti hain.", "working": "A resource has a type, name, identifier, scope and configuration. Related resources form an application architecture. Cost may appear on a parent plan or a related resource rather than the app row. / App aur uska paid plan alag resources ho sakte hain.", "example": "A Web App resource runs your API; its App Service plan supplies capacity. / App chalti hai plan ki capacity par.", "portal": "Portal → All resources or Resource group → Overview → select an item. Read Type, Location, Status and related resources. / Resource type se uska kaam identify karo.", "mistake": "Not every visible resource has a separate charge, and a zero-cost app row does not prove its hosting plan is free. / Zero row ka matlab poora setup free nahi.", "related": ["Resource group", "App Service plan", "Subscription"], "chapter": 1}, {"id": "concept-5", "name": "Microsoft Entra ID", "aliases": ["Microsoft Entra ID", "Entra ID", "Azure Active Directory", "Azure AD"], "en": "Microsoft Entra ID is Microsoft’s cloud identity and access service. It supports user sign-in, application identities and tokens. A tenant is one directory instance within this identity system.", "hi": "Microsoft Entra ID cloud identity service hai. Users ko login, apps ko identity aur tokens deta hai. Tenant isi identity system ki directory instance hai.", "purpose": "It answers identity questions and supports secure sign-in. / Kaun login kar raha hai, iski identity establish hoti hai.", "working": "Applications request a token for a target service. The target validates the token and applies its authorization rules. Identity and permission remain separate concerns. / Token ke baad bhi target permission check karta hai.", "example": "A GitHub deployment identity signs in to Azure before deploying the HRMS app. / Login aur deployment permission alag steps hain.", "portal": "Portal → search Microsoft Entra ID. Inspect Overview, Users, Groups or App registrations according to your role. / Sahi tenant select karke relevant section dekho.", "mistake": "Entra ID is not the SQL database itself and does not replace network rules. / Login service network firewall ka replacement nahi.", "related": ["Tenant", "Authentication", "Authorization", "RBAC"], "chapter": 18}, {"id": "concept-6", "name": "Authentication", "aliases": ["Authentication", "authenticate", "sign-in"], "en": "Authentication verifies who a user or workload is. It may use a password, multifactor authentication, a certificate or a token-based trust.", "hi": "Authentication identity verify karta hai: aap ya app kaun ho. Password, MFA, certificate ya token use ho sakta hai.", "purpose": "It establishes identity before access decisions. / Pehle identity prove hoti hai.", "working": "Credentials or trusted tokens are validated by the identity system. Successful sign-in produces an authenticated identity, not unlimited permission. / Login success sab actions ki permission nahi deta.", "example": "GitHub Azure login succeeds, but deployment can still fail if the app identity has no write role. / Login aur rights alag hain.", "portal": "For a Web App inspect Authentication. For Azure management inspect the account and tenant; workload setup depends on OIDC or managed identity. / Service ke hisaab se authentication setting alag hai.", "mistake": "A network timeout is not always a bad password. Separate connectivity, authentication and authorization errors. / Error layer identify karo.", "related": ["Authorization", "Microsoft Entra ID", "OIDC", "Managed identity"], "chapter": 18}, {"id": "concept-7", "name": "Authorization", "aliases": ["Authorization", "authorize", "permissions"], "en": "Authorization decides which actions an authenticated identity may perform on a target. The decision depends on roles, scope and the target service permission model.", "hi": "Authorization decide karta hai verified identity ko kya action allowed hai. Role, scope aur target service ka permission model matter karta hai.", "purpose": "It restricts access to the intended operations. / Sirf required kaam allow karta hai.", "working": "After identity verification, the target checks assigned permissions. Azure management and data-plane permissions can differ. / Management access aur data read access alag ho sakte hain.", "example": "An app can manage a storage account but still lack permission to read its blobs. / Contributor hona data reader hona zaroori nahi.", "portal": "Resource → Access control (IAM) for Azure RBAC. For SQL, inspect database users and permissions as well. / SQL ka data authorization bhi configure karo.", "mistake": "Owner of a subscription is not a reason to put its credentials in browser code. / Backend credentials frontend mein mat do.", "related": ["Authentication", "RBAC", "Scope", "Managed identity"], "chapter": 18}, {"id": "concept-8", "name": "RBAC", "aliases": ["RBAC", "Role-Based Access Control", "role assignment"], "en": "Azure Role-Based Access Control grants a principal a role at a specific scope. The principal can be a user, group, service principal or managed identity.", "hi": "RBAC mein identity ko specific scope par role diya jata hai. Identity user, group ya app ho sakti hai.", "purpose": "It gives controlled, reviewable Azure access. / Access ko minimum required scope par control karta hai.", "working": "A role assignment combines principal, role and scope. Permissions at a parent scope can be inherited by children. Data roles must be chosen for services that distinguish management from data. / Kaun, kya aur kahan: teen cheezein match karo.", "example": "Assign read access to one lab group instead of Owner on the subscription. / Chhota scope choose karo.", "portal": "Target resource → Access control (IAM) → View my access / Role assignments. Before adding a role, verify the exact principal and scope. / Assignment ko review karo.", "mistake": "Enabling an identity is not a role assignment. / Identity on karna permission dena nahi hai.", "related": ["Scope", "Authorization", "Managed identity", "Subscription"], "chapter": 18}, {"id": "concept-9", "name": "Scope", "aliases": ["Scope", "scopes"], "en": "A scope is the boundary where an action, role, policy or cost query applies. It can be a management group, subscription, resource group or individual resource.", "hi": "Scope batata hai action ya setting kis boundary par apply hoti hai. Subscription, group ya individual resource scope ho sakta hai.", "purpose": "It prevents a change or report from affecting unintended resources. / Sahi boundary se galat target avoid hota hai.", "working": "Parent scopes can influence descendants through supported inheritance. Cost analysis also displays a selected scope, so different scopes show different totals. / Scope badalne se total badal sakta hai.", "example": "₹318 group total and ₹1,882 subscription total cover different sets of resources. / Dono ka scope alag hai.", "portal": "Read the breadcrumb, subscription selection and scope label before changing settings or interpreting a chart. / Pehle selected scope dekho.", "mistake": "Do not compare totals without matching scope, time period, metric and filters. / Chart ka context match karo.", "related": ["Subscription", "Resource group", "RBAC", "Cost analysis"], "chapter": 3}, {"id": "concept-10", "name": "Managed identity", "aliases": ["Managed identity", "Managed Identities", "system-assigned identity", "user-assigned identity"], "en": "A managed identity is an Azure-managed workload identity. System-assigned identities follow a resource lifecycle. User-assigned identities are separate resources that can be attached to supported workloads.", "hi": "Managed identity Azure-managed app identity hai. System-assigned resource ke saath linked hoti hai. User-assigned separate resource hai jo supported app se attach hoti hai.", "purpose": "It reduces the need to store application credentials for supported token-based access. / App mein password rakhne ki zaroorat kam hoti hai.", "working": "The workload obtains a token and sends it to a supported target. The target still checks permissions. Networking and application driver support must also be correct. / Identity, target rights aur network tino chahiye.", "example": "A Web App uses its identity to read a Key Vault secret. / Secret read ke liye proper role chahiye.", "portal": "Web App → Identity. Inspect system-assigned status or user-assigned identities. Configure target permissions at the destination. / Target par role dena alag step hai.", "mistake": "An identity alone does not grant SQL or Storage access. / Automatically full access nahi milta.", "related": ["Microsoft Entra ID", "RBAC", "Key Vault", "OIDC"], "chapter": 18}, {"id": "concept-11", "name": "Region", "aliases": ["Region", "regions", "Location"], "en": "A region is a geographic area containing Azure infrastructure. Services and tiers are not available in every region, and prices, quotas and resilience options can differ.", "hi": "Region Azure infrastructure ka geographic area hai. Har service aur tier har region mein available nahi hota.", "purpose": "It helps place resources near users and required data locations. / Latency aur data requirements ke liye location choose karte hain.", "working": "You select a supported region during creation. Moving a resource later is service-specific; changing a group name does not relocate it. / Region change simple rename nahi.", "example": "Central India can be evaluated for an India-based HRMS. / Availability aur requirements bhi check karo.", "portal": "Resource Overview → Location. Creation form → Region. / Actual deployment location dekho.", "mistake": "Resource group region does not force all members into the same region. / Group metadata aur resource region alag hain.", "related": ["Availability zone", "Resource group", "VNet"], "chapter": 2}, {"id": "concept-12", "name": "Availability zone", "aliases": ["Availability zone", "availability zones", "zones"], "en": "An availability zone is a physically separate location in a supported Azure region. Zone-aware or zone-redundant configurations can reduce some local failure risks.", "hi": "Availability zone region ke andar physically separate location hai. Supported multi-zone setup ek location failure ka risk kam kar sakta hai.", "purpose": "It supports higher availability when used correctly. / Failure ke dauran continuity improve ho sakti hai.", "working": "Instances or replicas are placed according to the service zone configuration. Application and data layers must both be considered. / Sirf frontend multi-zone ho to DB single point ho sakta hai.", "example": "Two app instances in separate supported zones can survive one zone outage if dependencies also remain available. / Dependencies bhi resilient honi chahiye.", "portal": "Inspect Availability options during VM/service creation. Existing service zone changes may require redeployment or a different SKU. / Support tier-specific hai.", "mistake": "Zones are not different regions, and redundancy is not backup. / HA aur backup alag hain.", "related": ["Region", "Backup", "Replica"], "chapter": 2}, {"id": "concept-13", "name": "VNet", "aliases": ["VNet", "Virtual network", "virtual networks", "virtual network"], "en": "An Azure Virtual Network is a private address network. Connected resources can communicate through configured routes, security rules and service integrations.", "hi": "VNet Azure ka private address network hai. Connected resources routing aur security rules ke hisaab se communicate karte hain.", "purpose": "It provides network address space and connectivity boundaries. / Private network organize hota hai.", "working": "A VNet contains subnets. Interfaces receive private IP addresses. Connections to other networks need appropriate peering, gateways or service integration. / Subnet VNet ke andar hota hai.", "example": "10.20.0.0/16 VNet contains app subnet 10.20.1.0/24. / Range nested honi chahiye.", "portal": "Virtual networks → Create → IP addresses → add subnet → Review + create. / Address ranges aur optional add-ons check karo.", "mistake": "VNet is not an automatic firewall and separate subnets do not automatically block traffic. / Rules alag configure karo.", "related": ["Subnet", "Private IP", "NSG", "Private Endpoint"], "chapter": 9}, {"id": "concept-14", "name": "Subnet", "aliases": ["Subnet", "subnets"], "en": "A subnet is an address range inside a VNet. Supported resources connect to it. A subnet may also have service delegation, network security rules and routing settings.", "hi": "Subnet VNet ke andar chhoti IP range hai. Resource is range se connect hota hai. Delegation, NSG aur routes bhi associated ho sakte hain.", "purpose": "It separates address allocation and network configuration. / Network ko manageable ranges mein baantta hai.", "working": "Choose a range contained within the VNet. Reserve enough addresses for expected resources and service requirements. Azure reserves addresses in each subnet. / Future capacity aur reserved addresses ko count karo.", "example": "An app subnet and a private-endpoint subnet can have separate settings. / Service requirements match karo.", "portal": "VNet → Subnets → add or inspect a subnet. / Range, delegation aur NSG dekho.", "mistake": "A /24 has 256 total IPv4 addresses, but not all are assignable in Azure. / Total aur usable addresses alag hain.", "related": ["VNet", "CIDR", "NSG", "Private IP"], "chapter": 9}, {"id": "concept-15", "name": "Private IP", "aliases": ["Private IP", "private IP address", "private address"], "en": "A private IP is an address used within private networking. It is not globally routed as a public internet destination.", "hi": "Private IP private network ka address hai. Ye normally public internet destination ki tarah route nahi hota.", "purpose": "It enables private network communication. / Internal connectivity deta hai.", "working": "The address is assigned from a subnet to a network interface or supported private endpoint. DNS and routes must lead clients to the correct destination. / Sirf IP nahi, route aur DNS bhi chahiye.", "example": "10.20.1.4 may be a VM private address in the lab subnet. / Ye sample address hai.", "portal": "VM → Networking → network interface → IP configurations; private endpoint → network interface. / Resource-specific IP configuration dekho.", "mistake": "Private IP does not remove the need for authentication, authorization or network rules. / Private address full security nahi.", "related": ["Public IP", "Subnet", "DNS", "Private Endpoint"], "chapter": 9}, {"id": "concept-16", "name": "Public IP", "aliases": ["Public IP", "public IP address", "public address"], "en": "A public IP is an internet-routable address resource. Reachability still depends on association, routing, listeners and security rules.", "hi": "Public IP internet-routable address hai. Actual access association, listener, routing aur security rules par depend karta hai.", "purpose": "It provides a public entry or exit address for supported resources. / Internet-facing connectivity ke liye use hota hai.", "working": "Attach it to a supported interface, load balancer or gateway. DNS can point a friendly name to the public endpoint. / Public address aur domain related par alag hain.", "example": "A test VM may have a public IP for restricted management access. / Management sources limited rakho.", "portal": "Public IP addresses → select resource → Overview and Configuration. / SKU, association aur cost inspect karo.", "mistake": "An unused or unattached IP can still have charges depending on its type. / Unused ka matlab free nahi.", "related": ["Private IP", "DNS", "NSG", "Load Balancer"], "chapter": 11}, {"id": "concept-17", "name": "DNS", "aliases": ["DNS", "Domain Name System", "hostname"], "en": "DNS is the name-resolution system that maps hostnames to addresses or other names. Public DNS and private DNS serve different network contexts.", "hi": "DNS hostname ko address ya dusre naam se map karta hai. Public aur private DNS ka context alag hota hai.", "purpose": "It lets applications use names rather than hard-coded addresses. / Friendly aur stable names use hote hain.", "working": "A resolver looks up records and caches results. Private endpoint clients must resolve the service name to the private address through correct DNS configuration. / Wrong DNS se wrong path milta hai.", "example": "An API uses the SQL server hostname while DNS resolves the appropriate public or private route. / Hostname ko raw IP se replace mat karo.", "portal": "Azure DNS zones / Private DNS zones → select zone → Record sets. For a custom domain, follow the hosting service validation instructions. / Exact records use karo.", "mistake": "A DNS record alone does not configure TLS, user access or the hosting binding. / Domain complete setup ke multiple parts hain.", "related": ["Private Endpoint", "Public IP", "TLS"], "chapter": 11}, {"id": "concept-18", "name": "CIDR", "aliases": ["CIDR", "/16", "/24"], "en": "CIDR notation specifies an IP range using an address and prefix length. For IPv4, a larger prefix number represents a smaller address range.", "hi": "CIDR address aur prefix se IP range batata hai. IPv4 mein bada prefix number chhoti range hoti hai.", "purpose": "It defines VNet and subnet address spaces. / Network ki range set hoti hai.", "working": "10.20.0.0/16 includes 65,536 total IPv4 addresses. 10.20.1.0/24 includes 256 total addresses; Azure reserves five in each subnet. / Total se reserved addresses alag karo.", "example": "10.20.1.0/24 fits inside 10.20.0.0/16. / Dono ranges ka relation dekho.", "portal": "VNet → IP addresses / Subnets → inspect address prefix. / Prefix ko planning ke saath choose karo.", "mistake": "Overlapping ranges complicate or prevent some network connections. / Peering ke liye overlap avoid karo.", "related": ["VNet", "Subnet", "Private IP"], "chapter": 9}, {"id": "concept-19", "name": "NSG", "aliases": ["NSG", "Network security group", "Network Security Groups"], "en": "A Network Security Group filters traffic by source, destination, direction, protocol and port. Rules are evaluated by priority, with lower numbers first.", "hi": "NSG source, destination, direction, protocol aur port ke basis par traffic allow/deny karta hai. Chhota priority number pehle evaluate hota hai.", "purpose": "It restricts network traffic for subnets and interfaces. / Required traffic hi allow karna aim hai.", "working": "Associate the NSG with a subnet or interface, then inspect effective rules. Multiple applicable rule sets and the OS firewall can affect connectivity. / Effective result dekho.", "example": "Allow HTTPS 443, restrict SSH/RDP to approved sources. / Sabke liye management port open mat karo.", "portal": "Network security groups → resource → Inbound/Outbound security rules. / Association aur priority bhi verify karo.", "mistake": "NSG is not a WAF, login system or route table. / Inke roles alag hain.", "related": ["Subnet", "Public IP", "Authorization"], "chapter": 10}, {"id": "concept-20", "name": "Private Endpoint", "aliases": ["Private Endpoint", "Private endpoint", "private endpoints"], "en": "A private endpoint connects a supported Azure service to your VNet using a private network interface and private IP.", "hi": "Private endpoint supported Azure service ke liye VNet mein private interface aur IP deta hai.", "purpose": "It allows private-network access to a managed service. / Managed service tak private path milta hai.", "working": "Endpoint approval, subresource selection, network connectivity and private DNS must all be correct. Public access settings are reviewed separately. / Public access automatically band samajhna galat hai.", "example": "API reaches SQL via a private endpoint rather than an unrestricted public route. / Browser SQL ko direct nahi call karta.", "portal": "Target resource → Networking → Private endpoint connections. Review DNS and connected VNet as well. / DNS resolution verify karo.", "mistake": "Creating the endpoint does not universally disable the public endpoint. / Public setting explicitly inspect karo.", "related": ["VNet", "DNS", "Private IP", "Azure SQL Database"], "chapter": 12}, {"id": "concept-21", "name": "App Service plan", "aliases": ["App Service plan", "App Service Plan", "hosting plan", "F1"], "en": "An App Service plan provides the compute capacity and pricing tier for Web Apps. Compatible apps can share the same plan and its capacity.", "hi": "App Service plan Web Apps ki compute capacity aur pricing tier deta hai. Compatible apps ek plan share kar sakti hain.", "purpose": "It determines hosting capacity, features and cost. / App ko kitni capacity aur features milenge ye decide karta hai.", "working": "An app is deployed into a plan. In paid dedicated tiers, provisioned plan capacity is billable even when an individual app is stopped. F1 has limited shared resources and quotas. / App Stop aur plan billing alag hain.", "example": "A Web App row can show zero while its paid plan has the compute charge. / Cost plan par aa sakta hai.", "portal": "Web App → Overview → App Service plan, or search App Service plans → select plan. Read SKU and apps using it. / Shared apps inspect karo.", "mistake": "Changing or deleting a shared plan can affect several apps. Free F1 is not unlimited production hosting. / Tier deliberately choose karo.", "related": ["Web App", "Resource", "Scale out", "Container image"], "chapter": 4}, {"id": "concept-22", "name": "Web App", "aliases": ["Web App", "App Service", "App Services"], "en": "A Web App is an App Service application resource for hosting a website or API. It uses a hosting plan and configured runtime or supported container mode.", "hi": "Web App website ya API host karne ka App Service resource hai. Iska hosting plan aur runtime hota hai.", "purpose": "It hosts application code without requiring you to administer the underlying VM OS. / OS management ka kaam kam hota hai.", "working": "Create the app, choose a compatible runtime and plan, publish code, then configure settings and connectivity. Creating an empty resource does not deploy your code. / Resource aur code deployment separate hain.", "example": "React frontend and .NET API are separate apps with appropriate runtimes. / Dono ka runtime match karo.", "portal": "App Services → app → Overview, Deployment Center, Environment variables / Configuration and Log stream. Labels may vary. / Correct app select karo.", "mistake": "Node runtime for a frontend does not mean the .NET API should also use Node. / Project runtime dekho.", "related": ["App Service plan", "API", "Runtime", "Deployment"], "chapter": 4}, {"id": "concept-23", "name": "Container image", "aliases": ["Container image", "image tag", "Docker image"], "en": "A container image is a versioned package of an application and its dependencies. It is a template; a running container is an execution of that image.", "hi": "Container image app aur dependencies ka versioned package hai. Image template hai; running container uska execution hai.", "purpose": "It makes deployment packaging repeatable across compatible container hosts. / Package repeatably run hota hai.", "working": "Build an image, push it to a registry and configure a host to pull a specific tag or digest. The host still needs ports, environment settings and access. / Image ke saath runtime config bhi chahiye.", "example": "msr_api:20261023061344 is a historical image-and-tag example. / Ye sample historical tag hai.", "portal": "Container App → App → Containers → inspect registry, image and tag. / Secrets expose kiye bina details dekho.", "mistake": "An image is not a code publishing ZIP, and Blob containers are unrelated. / Container words ke meanings alag hain.", "related": ["Container Apps", "Registry", "Revision", "Runtime"], "chapter": 5}, {"id": "concept-24", "name": "Container Apps", "aliases": ["Container Apps", "Azure Container Apps", "Container App"], "en": "Azure Container Apps runs containerized workloads with managed revisions, replicas and supported autoscaling. Its cost depends on the plan and measured usage.", "hi": "Container Apps images se workload chalata hai. Revisions, replicas aur supported scaling manage karta hai. Cost plan aur usage par depend karta hai.", "purpose": "It runs an API or worker without directly managing Kubernetes infrastructure. / Container hosting simplify hoti hai.", "working": "Pull the image from a registry, configure ingress and scaling, then route traffic to healthy revisions. Consumption offers a free grant; excess usage is billed. / Container hona alone paid reason nahi.", "example": "Your earlier API had recorded usage cost while SQL was free. / Dono resources alag meters hain.", "portal": "Container Apps → app → Containers, Revisions and replicas, Scale and Overview. / Cost Analysis mein resource wise dekho.", "mistake": "Free allowance is not unlimited. Stopping the app does not prove registries, logs or dedicated environment costs stop. / Related costs inspect karo.", "related": ["Container image", "Replica", "Revision", "Registry", "Cost analysis"], "chapter": 5}, {"id": "concept-25", "name": "Replica", "aliases": ["Replica", "replicas", "instance", "instances"], "en": "A replica is a running copy of a workload. In many hosting contexts an instance is a unit of running compute capacity, but the exact meaning depends on the service.", "hi": "Replica running workload ki copy hai. Instance generally compute capacity ki unit hai, lekin exact meaning service-specific hota hai.", "purpose": "Multiple copies can increase capacity or availability. / Zyada requests handle karne mein help mil sakti hai.", "working": "A scheduler starts copies and a traffic layer distributes requests to healthy targets. Shared state and dependencies must support multiple copies. / Stateless design aur DB capacity matter karte hain.", "example": "Three API replicas can handle traffic concurrently. / Ek session local memory mein ho to issue aa sakta hai.", "portal": "Container App → Revisions and replicas; App Service plan → Scale out; VM scale set → Instances. / Service ka appropriate blade kholo.", "mistake": "More replicas do not automatically fix slow SQL queries. / Bottleneck identify karo.", "related": ["Scale out", "Load Balancer", "Revision"], "chapter": 8}, {"id": "concept-26", "name": "Revision", "aliases": ["Revision", "revisions"], "en": "A Container Apps revision is an immutable versioned snapshot of application configuration. Multiple revisions can be retained or active depending on revision mode.", "hi": "Revision Container App configuration ka immutable versioned snapshot hai. Revision mode ke hisaab se multiple versions active ho sakte hain.", "purpose": "It supports version management, testing and traffic changes. / Deployment version ko manage karta hai.", "working": "Change a revision-scoped setting to create a revision. Check health and traffic assignment before retiring the old version. / Healthy hona aur traffic milna alag checks hain.", "example": "New image tag → new revision → test → traffic switch. / Rollback path rakho.", "portal": "Container App → Revisions and replicas → inspect active state, replicas and traffic. / Traffic percent verify karo.", "mistake": "A newly created revision may receive no traffic or fail startup. / Creation success full app success nahi.", "related": ["Container Apps", "Replica", "Deployment"], "chapter": 5}, {"id": "concept-27", "name": "Registry", "aliases": ["Registry", "Container Registry", "ACR"], "en": "A container registry stores and distributes container images. Azure Container Registry is Azure’s managed registry service.", "hi": "Registry container images store aur distribute karti hai. ACR Azure ki managed registry service hai.", "purpose": "It provides an image source for container hosts. / Host image yahan se pull karta hai.", "working": "Push an image under a repository name and tag. The running host authenticates to pull the selected image. Storage and registry tier are separate from execution cost. / Store karna aur run karna alag meters hain.", "example": "ACR stores msr_api; Container Apps runs it. / Godown aur execution ka difference.", "portal": "Container registries → registry → Repositories. Inspect tags and host authentication without sharing credentials. / Tag aur access check karo.", "mistake": "A registry does not execute your API. Deleting a needed image may break future restarts or deployments. / Used image delete mat karo.", "related": ["Container image", "Container Apps", "Managed identity"], "chapter": 5}, {"id": "concept-28", "name": "Azure SQL Database", "aliases": ["Azure SQL Database", "SQL Database", "SQL databases", "database"], "en": "Azure SQL Database is a managed relational database. It stores tables and supports SQL queries. A logical server provides grouping, endpoint and some access settings.", "hi": "Azure SQL Database managed relational database hai. Tables mein records rakhta hai aur SQL queries support karta hai. Logical server endpoint aur grouping deta hai.", "purpose": "It stores structured application records and executes database operations. / Employee aur attendance records ka store.", "working": "The API authenticates and connects to the database, executes queries and returns selected results. Compute usage and stored data size are different measures. / Chhota data bhi compute consume kar sakta hai.", "example": "HRMS API returns employee JSON after a parameterized SQL query. / Browser SQL ko direct query nahi karta.", "portal": "SQL databases → database → Overview and Compute + storage. Inspect free amount, status and overage behavior for the actual offer. / Free plan explicitly verify karo.", "mistake": "Logical SQL server at ₹0 does not prove every database is free. A paused free DB can block API data tests. / Exact resource check karo.", "related": ["SQL logical server", "vCore", "Connection pool", "API"], "chapter": 14}, {"id": "concept-29", "name": "SQL logical server", "aliases": ["SQL logical server", "logical SQL server", "SQL server"], "en": "An Azure SQL logical server is a management grouping and connection endpoint for databases. In this context it is not a dedicated SQL Server VM.", "hi": "Azure SQL logical server databases ka management grouping aur endpoint hai. Is context mein ye dedicated SQL Server VM nahi hai.", "purpose": "It provides the server hostname and relevant shared settings. / Database access ka hostname aur settings deta hai.", "working": "Databases under the server have their own compute/storage configuration. Server-level networking and identity settings affect access. / Actual DB ka pricing alag inspect hota hai.", "example": "msrhrmsdb.database.windows.net is a historical logical-server hostname example. / Ye VM computer name nahi.", "portal": "SQL servers → select server → Overview, Networking and authentication settings. / Database list bhi dekho.", "mistake": "The term SQL Server also names a software product; do not confuse logical Azure server with a SQL VM. / Context important hai.", "related": ["Azure SQL Database", "Private Endpoint", "Authentication"], "chapter": 14}, {"id": "concept-30", "name": "vCore", "aliases": ["vCore", "vCores", "vCore seconds", "vCPU", "CPU"], "en": "A vCore or vCPU is a virtual CPU capacity unit in the relevant service. It is not a measure of stored database size. vCore-seconds combine allocated or billed compute capacity with time under the service’s metering rules.", "hi": "vCore/vCPU virtual processor capacity ki unit hai. Ye database storage size nahi hai. vCore-seconds compute capacity aur time ka combined measure hai.", "purpose": "It describes or meters processing capacity. / Compute ka size ya usage samajhne ke liye.", "working": "As a simple arithmetic example, 2 vCores for 10 seconds equals 20 vCore-seconds. Actual billable usage depends on the service minimums, memory and scaling rules. / Ye arithmetic example hai, final billing formula nahi.", "example": "A 25 MB database can exhaust its monthly free compute allowance. / Storage aur compute alag limits hain.", "portal": "SQL database → Compute + storage / free amount metric; VM → Size; Container App → CPU allocation. / Service-specific measure dekho.", "mistake": "A vCPU is not always a whole dedicated physical CPU core. / Virtual capacity ko physical hardware se equal mat samjho.", "related": ["RAM", "Azure SQL Database", "Scale up"], "chapter": 14}, {"id": "concept-31", "name": "RAM", "aliases": ["RAM", "memory", "GiB"], "en": "RAM is working memory used by running processes. It differs from persistent storage. A GiB is a binary capacity unit; 1 GiB equals 1,073,741,824 bytes.", "hi": "RAM running processes ki working memory hai. Disk storage alag hai. GiB binary capacity unit hai.", "purpose": "It holds actively used data and process state. / App ka active working area.", "working": "Applications and caches consume memory. When capacity is exceeded, the service may fail, throttle or evict cache entries according to its design. / Memory finite hoti hai.", "example": "A 32 GB server cannot hold 1 TB of uncompressed data entirely in RAM. / Popular subset cache karo.", "portal": "Check process/service metrics, VM size or container memory allocation. / Actual memory usage measure karo.", "mistake": "Adding disk space does not increase RAM. Caching also needs an eviction and refresh design. / Storage aur RAM mix mat karo.", "related": ["Redis", "vCore", "Storage account"], "chapter": 15}, {"id": "concept-32", "name": "Connection pool", "aliases": ["Connection pool", "pooling", "Max Pool Size", "ADO.NET"], "en": "A connection pool reuses suitable database connections. In ADO.NET, closing or disposing a pooled connection normally returns it to the pool rather than destroying the physical connection.", "hi": "Connection pool suitable DB connections reuse karta hai. ADO.NET mein Close/Dispose generally connection ko pool mein wapas karta hai.", "purpose": "It reduces repeated connection setup work. / Har query ke liye physical connection banana avoid hota hai.", "working": "Open borrows a connection when available; Dispose releases it after work. Pools depend on configuration and connection identity. Pool capacity must fit application concurrency and database limits. / Connection ko short time hold karo.", "example": "Use a connection within a using block for one operation, then release it. / Kaam khatam to dispose.", "portal": "This is mainly application-code configuration, not a universal Azure Portal switch. Inspect connection string and telemetry without exposing credentials. / Code aur driver settings dekho.", "mistake": "Increasing the pool to 1000 can overload SQL or hide leaks. / Pehle slow query aur leaked connections check karo.", "related": ["Azure SQL Database", "API", "Redis"], "chapter": 15}, {"id": "concept-33", "name": "Redis", "aliases": ["Redis", "cache", "cache-aside"], "en": "Redis is an in-memory data system often used as a cache. It can store selected results so the application does not query a slower source for every repeated request.", "hi": "Redis in-memory data system hai jo cache ke liye use hota hai. Repeated result cache se milne par DB ka work kam ho sakta hai.", "purpose": "It speeds appropriate repeated reads and can support shared transient state. / Popular reads fast ho sakti hain.", "working": "In cache-aside, read cache first. On miss, read SQL, store the result with expiry and return it. Define invalidation, memory limits and failure behavior. / Miss aur stale data ka rule clear rakho.", "example": "Cache district summaries instead of every raw row from all 55 districts. / Required subset store karo.", "portal": "Current Azure managed offering: inspect Azure Managed Redis, tier, region and network settings. Cache logic still belongs in application code. / Resource banana alone cache implement nahi karta.", "mistake": "Cache does not guarantee fresh data and cannot fit unlimited data into small RAM. / Expiry aur capacity plan karo.", "related": ["RAM", "Azure SQL Database", "API"], "chapter": 15}, {"id": "concept-34", "name": "API", "aliases": ["API", "Web API", "backend"], "en": "An API is a defined interface through which software makes requests. A web API usually receives HTTP requests and returns a response such as JSON.", "hi": "API software ke beech request/response ka interface hai. Web API HTTP request leti hai aur JSON jaisa response deti hai.", "purpose": "It exposes controlled application operations to clients. / Frontend ko required business operation deta hai.", "working": "The API validates input, applies authorization, runs business logic, accesses dependencies and returns a response. It can be hosted on different Azure services. / Hosting platform aur API code alag hain.", "example": "GET /employees returns authorized employee records from SQL. / Client ko sirf allowed data mile.", "portal": "Inspect the hosting resource: Web App or Container App. API routes and business logic come from deployed code, not from naming the Azure resource. / Resource ka naam API implement nahi karta.", "mistake": "Never expose a database password in frontend JavaScript. / DB access backend kare.", "related": ["Frontend", "Azure SQL Database", "CORS", "Web App"], "chapter": 26}, {"id": "concept-35", "name": "Frontend", "aliases": ["Frontend", "React", "browser"], "en": "The frontend is the user-facing application that renders screens and interacts with users. Browser-based frontend code runs on the user’s device.", "hi": "Frontend user ko screen dikhata hai aur interaction handle karta hai. Browser ka frontend code user ke device par run hota hai.", "purpose": "It presents data and collects user actions. / UI aur user experience ka layer.", "working": "It requests authorized data from an API and displays results. Static build-time configuration may need a rebuild when the API URL changes. / API base URL update ke baad build lag sakti hai.", "example": "React displays the employee table after receiving JSON from the API. / Database se direct connection nahi.", "portal": "Open the frontend Web App and its deployment workflow; inspect build settings and API base URL in the project. / Backend app ko overwrite mat karo.", "mistake": "Browser-delivered code is inspectable; environment variables included in a frontend bundle are not secret. / Frontend env ko secret store mat samjho.", "related": ["API", "CORS", "Deployment"], "chapter": 26}, {"id": "concept-36", "name": "CORS", "aliases": ["CORS", "Cross-Origin Resource Sharing", "allowed origin"], "en": "CORS is a browser-enforced cross-origin response access mechanism. The API sends headers that tell a browser whether a particular origin may read the response.", "hi": "CORS browser ki cross-origin response access policy hai. API headers batati hain ki particular origin response read kar sakta hai ya nahi.", "purpose": "It supports intentional browser access across origins. / Alag frontend/API origins ke liye.", "working": "The browser may send a preflight request. API CORS configuration must match scheme, host and port, and credential requirements. / Exact origin match karo.", "example": "Frontend https://hrms.example.com calls https://api.example.com. / Dono origins alag hain.", "portal": "Configure CORS in the API code or supported hosting CORS blade. Avoid conflicting duplicate policies. / Code aur hosting policies check karo.", "mistake": "CORS is not authentication and does not stop non-browser clients from calling a public API. / API auth alag chahiye.", "related": ["API", "Frontend", "Authentication"], "chapter": 26}, {"id": "concept-37", "name": "Runtime", "aliases": ["Runtime", "runtime stack", "Node", "Node.js", ".NET"], "en": "A runtime is the execution environment required by application code. Node.js executes JavaScript server workloads; .NET hosts compatible .NET applications.", "hi": "Runtime code chalane ka environment hai. Node.js JavaScript server workload aur .NET compatible .NET apps chalata hai.", "purpose": "It supplies the language execution platform. / App ko required environment deta hai.", "working": "The runtime version must match the project and supported hosting options. Startup commands and deployment output must also be compatible. / Version aur publish output match karo.", "example": "A React build workflow can use Node while a separate API uses .NET. / Dono ko ek runtime force mat karo.", "portal": "Web App → Configuration / Stack settings or creation form → Runtime stack. Read lifecycle warnings. / Supported version choose karo.", "mistake": "Switching a runtime cannot convert one language’s code into another. / Node select karne se .NET API run nahi hogi.", "related": ["Web App", "Deployment", "Container image"], "chapter": 4}, {"id": "concept-38", "name": "Deployment", "aliases": ["Deployment", "deploy", "GitHub Actions", "workflow"], "en": "Deployment publishes a particular application version and configuration to a running target. A workflow automates build, authentication and publishing steps.", "hi": "Deployment specific app version aur config ko hosting target par publish karta hai. Workflow build/login/publish automate karta hai.", "purpose": "It makes tested source changes available in a hosting environment. / Code ko running version tak le jata hai.", "working": "Check out code, build, test, authenticate and publish. Read each stage separately to find the first failure. / Har stage ka error alag diagnose karo.", "example": "Artifact upload failure is different from Azure login failure or startup failure. / Ek error ko dusri layer se fix mat karo.", "portal": "Web App → Deployment Center; GitHub → repository → Actions → latest commit run. / Current workflow version dekho.", "mistake": "A green deployment can still serve an unhealthy application. Test its endpoint and logs. / Deploy success aur user flow success alag hain.", "related": ["OIDC", "Artifact", "Runtime", "API"], "chapter": 20}, {"id": "concept-39", "name": "OIDC", "aliases": ["OIDC", "OpenID Connect", "federated identity", "federation"], "en": "OpenID Connect is an identity protocol. GitHub-to-Azure OIDC can use a short-lived token and configured federated trust instead of a long-lived deployment password.", "hi": "OIDC identity protocol hai. GitHub-to-Azure setup short-lived token aur federated trust use kar sakta hai, permanent deployment password ki jagah.", "purpose": "It supports trusted workflow authentication. / Specific workflow ko token-based login deta hai.", "working": "The token issuer, audience and subject must match Azure trust configuration. The identity also needs permission on the intended deployment target. / Trust match aur role dono chahiye.", "example": "A repo branch or GitHub environment is trusted to deploy one Web App. / Exact source boundary set hoti hai.", "portal": "Deployment Center authentication settings and the chosen identity’s Federated credentials. Inspect workflow id-token permissions and matching IDs. / Exact subject compare karo.", "mistake": "Creating new trust grants security-sensitive access; do not broaden repo/branch scope to hide a configuration error. / Narrow trust rakho.", "related": ["Managed identity", "Authentication", "RBAC", "Deployment"], "chapter": 20}, {"id": "concept-40", "name": "Artifact", "aliases": ["Artifact", "Artifacts", "upload-artifact"], "en": "An artifact is stored output from a build or workflow, such as a publish ZIP. GitHub Actions artifact storage is separate from source-code storage and Azure hosting.", "hi": "Artifact workflow ka stored build output hai, jaise publish ZIP. Ye source repo aur Azure hosting se alag storage hai.", "purpose": "It transfers or retains build output between jobs and runs. / Build output preserve hota hai.", "working": "The workflow uploads files, then another stage may download and deploy them. Retention determines future expiry. Existing artifacts are not removed by changing new upload retention. / Purane artifacts alag delete hote hain.", "example": "Quota hit during CreateArtifact means output upload failed. / Ye necessarily compile error nahi.", "portal": "GitHub repository → Actions → workflow run → Artifacts. Manage unneeded artifacts or revise workflow architecture. / Usage recalculation delay ho sakta hai.", "mistake": "Never delete a needed artifact before a dependent job has used it. / Running deployment ka dependency check karo.", "related": ["Deployment", "Credit", "Budget"], "chapter": 20}, {"id": "concept-41", "name": "Cost analysis", "aliases": ["Cost analysis", "Actual cost", "Forecast", "billing"], "en": "Cost Analysis is Azure’s usage-cost reporting view for a selected scope, time range and metric. Actual cost is recorded usage; a forecast is an estimate of future total.", "hi": "Cost Analysis selected scope aur period ka usage-cost view hai. Actual cost recorded usage hai; forecast future estimate hai.", "purpose": "It shows which services and resources produced usage charges. / Kharcha kahan se aaya ye pata chalta hai.", "working": "Choose period and scope, inspect filters, then group by service and resource. Credits, invoice and outstanding balance must be interpreted separately. / Usage ko direct amount due mat samjho.", "example": "A group named DB can show a Container Apps charge. / Group label billing service nahi.", "portal": "Cost Management → Cost analysis → Actual cost → This month → Group by Service name / Resource. / Same scope aur date compare karo.", "mistake": "Data can arrive late. Do not subtract a reported monthly usage total from an already adjusted available-credit balance again. / Double subtraction avoid karo.", "related": ["Subscription", "Resource group", "Credit", "Budget"], "chapter": 3}, {"id": "concept-42", "name": "Credit", "aliases": ["Credit", "credits", "trial credit", "free credits"], "en": "A credit is an offer-specific balance used to cover eligible charges until its expiry or exhaustion. It is different from an always-free tier or monthly free grant.", "hi": "Credit offer-specific balance hai jo eligible paid charges cover karta hai. Expiry ya balance khatam hone tak use hota hai. Ye free tier se alag hai.", "purpose": "It provides a limited trial or promotional benefit. / Paid usage ko temporary cover karta hai.", "working": "Usage consumes eligible balance. Expiry behavior depends on subscription offer and upgrade state; do not assume every credit renews monthly. / Offer terms aur actual status dekho.", "example": "An API can produce a charge while credits pay for that usage. / Charge record aur bank payment alag hain.", "portal": "Subscription Overview and billing offer/credits information. Read the actual expiry date rather than a historical handbook example. / Current date verify karo.", "mistake": "Free credit does not make the selected paid resource permanently free. / Credit expire ke baad behavior check karo.", "related": ["Cost analysis", "Budget", "Subscription"], "chapter": 3}, {"id": "concept-43", "name": "Budget", "aliases": ["Budget", "budgets", "budget alert"], "en": "A budget tracks spending against a planned amount and can trigger notifications or configured actions. A budget by itself is not a hard billing cap.", "hi": "Budget planned amount ke against spending track karta hai aur alert de sakta hai. Budget alone hard bill limit nahi hai.", "purpose": "It helps notice unexpected cost early. / Kharcha jaldi detect hota hai.", "working": "Cost data is evaluated against configured thresholds. Automation can be connected deliberately, but notification latency and service behavior matter. / Alert aur shutdown different configurations hain.", "example": "A ₹500 budget can alert you; it does not guarantee the bill cannot exceed ₹500. / Cap samajhkar rely mat karo.", "portal": "Cost Management → Budgets → Add → scope, period, amount and notification thresholds. / Email recipient aur thresholds verify karo.", "mistake": "Quota, spending limit and budget are different controls. / Capacity limit aur paisa limit alag hain.", "related": ["Cost analysis", "Credit", "Subscription"], "chapter": 3}, {"id": "concept-44", "name": "Scale out", "aliases": ["Scale out", "scaling", "autoscale", "Autoscaler", "horizontal scaling"], "en": "Scale out adds running instances. Autoscaling evaluates supported rules or signals to decide when to change capacity. A load balancer is the traffic distributor, not the autoscaling controller.", "hi": "Scale out instances ki count badhata hai. Autoscaler rules/signals par count badhata-ghatata hai. Load balancer traffic baantta hai.", "purpose": "It adjusts concurrency capacity for demand. / Demand ke hisaab se copies change hoti hain.", "working": "Minimum, maximum, metric thresholds and evaluation periods guide the controller. The app and its dependencies must tolerate multiple instances. / DB aur session design bhi ready honi chahiye.", "example": "CPU remains high long enough → controller adds an instance → traffic layer routes to healthy instances. / Capacity aur routing coordinated par alag roles hain.", "portal": "App Service plan → Scale out, VM scale set → Scaling or Container App → Scale. Capabilities differ by plan. / Service-specific scaling dekho.", "mistake": "Scaling cannot fix every slow query, and more instances usually change cost. / Bottleneck aur budget dono dekho.", "related": ["Scale up", "Load Balancer", "Replica", "Connection pool"], "chapter": 8}, {"id": "concept-45", "name": "Scale up", "aliases": ["Scale up", "vertical scaling"], "en": "Scale up increases capacity of an instance or selected hosting tier, for example more CPU or RAM. It differs from adding instances.", "hi": "Scale up ek instance ya plan ko zyada capacity deta hai, jaise CPU/RAM. Instance count badhana scale out hai.", "purpose": "It helps a workload that needs more capacity per instance. / Ek machine ki capacity badhti hai.", "working": "Choose a larger compatible size or tier; restarts, limits and availability effects depend on the service. / Har change zero downtime nahi.", "example": "Change a VM size from smaller memory to a larger size after measuring need. / Metrics par decision lo.", "portal": "VM → Size; App Service plan → Scale up; SQL → Compute + storage. / Correct capacity owner choose karo.", "mistake": "A bigger tier is not a substitute for fixing inefficient code. / Pehle bottleneck samjho.", "related": ["Scale out", "vCore", "RAM", "App Service plan"], "chapter": 8}, {"id": "concept-46", "name": "Load Balancer", "aliases": ["Load Balancer", "load balancer", "Application Gateway", "Front Door"], "en": "A load-balancing layer distributes requests to healthy targets. Azure Load Balancer is regional layer-4 TCP/UDP balancing. Application Gateway and Front Door provide different HTTP routing scopes and features.", "hi": "Traffic balancing healthy targets mein requests baantti hai. Azure Load Balancer regional TCP/UDP ke liye hai. Application Gateway regional HTTP aur Front Door global HTTP ke use cases cover karte hain.", "purpose": "It routes traffic according to supported health and distribution rules. / Healthy backends ko traffic milta hai.", "working": "Configure frontend entry, backend targets, health checks and routing rules. Secure origin access separately where needed. / Origin ko automatically hidden/secure mat samjho.", "example": "Users → routing layer → healthy API instances. / Load badhne par count autoscaler badhayega.", "portal": "Search the exact service → inspect backend pools/origins, health and rules. / Teen services interchangeable nahi.", "mistake": "Load balancing is not the same as scaling. An unhealthy probe can remove a healthy app if the path or port is wrong. / Probe config test karo.", "related": ["Scale out", "Replica", "DNS", "NSG"], "chapter": 13}, {"id": "concept-47", "name": "Storage account", "aliases": ["Storage account", "Blob Storage", "blob container", "Azure Files"], "en": "A storage account provides management and access configuration for Azure Storage services. Blob Storage stores objects; Azure Files provides managed file shares.", "hi": "Storage account Azure Storage services ka management scope hai. Blob objects store karta hai aur Azure Files file shares deta hai.", "purpose": "It stores application files independently of database rows. / PDF/image ko separately store kar sakte ho.", "working": "Create a private container, upload a blob and authorize access through supported identity or scoped access. Redundancy and retention affect recovery and cost. / Public access deliberate rakho.", "example": "SQL has employee metadata; Blob has the uploaded PDF. / Database aur files ki roles alag hain.", "portal": "Storage accounts → account → Containers / File shares, Networking, Access control and Data protection. / Selected data service dekho.", "mistake": "Blob container is unrelated to a Docker container. A URL alone does not make a private file readable. / Name similarity se confuse mat ho.", "related": ["Azure SQL Database", "Managed identity", "Backup"], "chapter": 16}, {"id": "concept-48", "name": "Key Vault", "aliases": ["Key Vault", "Key vaults", "secret", "secrets"], "en": "Key Vault manages secrets, cryptographic keys and certificates. A secret value must be accessed only by authorized identities and never exposed in browser code or logs.", "hi": "Key Vault secrets, keys aur certificates manage karta hai. Secret authorized identity hi read kare; frontend ya logs mein expose nahi hona chahiye.", "purpose": "It centralizes sensitive configuration and key management. / Sensitive values ka controlled store.", "working": "Authorize the workload, allow its network path and resolve the reference or use an SDK. Rotation needs an application refresh strategy. / Permission aur connectivity dono chahiye.", "example": "API reads a DB secret; React receives only the API URL. / Server secret server par.", "portal": "Key vaults → vault → Secrets and Access control / access model. Web App settings can use supported references. / Secret value share mat karo.", "mistake": "Creating a vault does not automatically move secrets out of existing code. / Code cleanup aur rotation separately karo.", "related": ["Managed identity", "RBAC", "API"], "chapter": 19}, {"id": "concept-49", "name": "Backup", "aliases": ["Backup", "restore", "recovery point"], "en": "A backup is a retained recoverable copy or version of data. Restore is the process of recovering it. Backup success must be followed by a tested recovery procedure.", "hi": "Backup data ki recoverable copy/version hai. Restore usko wapas lana hai. Backup job success ke saath restore test bhi zaroori hai.", "purpose": "It supports recovery from deletion, corruption and disruption. / Lost data recover karna goal hai.", "working": "Set policy and retention, inspect recovery points and restore to a separate test target. Replication and high availability solve different problems. / Replica backup ka universal replacement nahi.", "example": "Restore HRMS SQL to a test DB and verify employee records. / Production overwrite kiye bina test karo.", "portal": "Use the resource-specific Backups/Restore blade or Backup center/vault workflow. / Service-specific recovery process follow karo.", "mistake": "A lock is not a backup; replicated bad data can still be bad. / Recovery copy verify karo.", "related": ["RPO", "RTO", "Replica", "Azure SQL Database"], "chapter": 23}, {"id": "concept-50", "name": "RPO", "aliases": ["RPO", "Recovery Point Objective"], "en": "RPO is the maximum acceptable data-loss window after a disruption. It describes how far back the recovered data may be.", "hi": "RPO maximum acceptable data-loss time window hai. Recovery ke baad data kitna purana acceptable hai.", "purpose": "It guides backup or replication frequency. / Recovery point kitna fresh chahiye.", "working": "Compare business tolerance with actual recovery points and tested data freshness. / Requirement aur result compare karo.", "example": "RPO of one hour means up to an hour of data loss may be acceptable, not guaranteed by writing the target down. / Setup ko target meet karna hoga.", "portal": "Document the target, then inspect backup/replication schedules and restore tests. / Portal mein target bolne se guarantee nahi.", "mistake": "RPO is not the time needed to bring the app back online. / Wo RTO hai.", "related": ["RTO", "Backup"], "chapter": 23}, {"id": "concept-51", "name": "RTO", "aliases": ["RTO", "Recovery Time Objective"], "en": "RTO is the target maximum time to restore service after a disruption. It includes the practical work needed to resume usable application service.", "hi": "RTO disruption ke baad service wapas lane ka target maximum time hai. Sirf DB restore nahi, app usable hone ka time.", "purpose": "It guides recovery architecture and operational readiness. / Kitni jaldi service chahiye.", "working": "Measure detection, restore, configuration, DNS/traffic changes and validation during a recovery test. / Full recovery time measure karo.", "example": "A two-hour RTO requires a rehearsed recovery process that fits two hours. / Sirf policy select karna enough nahi.", "portal": "Use a recovery runbook and timed test with service-specific restore workflows. / Test se evidence milega.", "mistake": "RTO and RPO are different targets. / Downtime aur data freshness alag hain.", "related": ["RPO", "Backup"], "chapter": 23}, {"id": "concept-52", "name": "Metric", "aliases": ["Metric", "metrics", "CPU percentage"], "en": "A metric is a numeric time-series measurement such as request count, latency or CPU percentage. Aggregation and time range determine what the chart means.", "hi": "Metric time ke saath numeric measurement hai, jaise requests, latency ya CPU %. Aggregation aur time range important hain.", "purpose": "It shows operational trends and alert conditions. / Performance pattern samajh aata hai.", "working": "Collect samples and display average, max, total or another supported aggregation. Choose the one that answers the question. / Average spike ko hide kar sakta hai.", "example": "Low CPU with slow API may mean waiting on SQL. / CPU akela health report nahi.", "portal": "Resource → Monitoring → Metrics → choose signal, time range and aggregation. / Correct chart context dekho.", "mistake": "A chart with no data may mean telemetry is missing, not that everything is healthy. / Missing data investigate karo.", "related": ["Log", "Application Insights", "Alert"], "chapter": 21}, {"id": "concept-53", "name": "Log", "aliases": ["Log", "logs", "Activity log", "Log Analytics"], "en": "A log is a detailed event record. Application logs describe code behavior. Activity log describes Azure resource management operations. Log Analytics queries collected log tables.", "hi": "Log detailed event record hai. Application log code ka behavior, Activity log resource management changes aur Log Analytics collected tables query karta hai.", "purpose": "It helps investigate the reason behind a symptom. / Error ka detail context milta hai.", "working": "Enable appropriate collection, select the right workspace and time range, then correlate requests, errors and dependencies. / Sensitive values log mat karo.", "example": "An SQL timeout exception explains a failed API request. / Error aur request trace connect karo.", "portal": "Resource → Logs / Log stream / Activity log, according to the question. / Inko interchangeable mat samjho.", "mistake": "No records can mean collection was off or filters are wrong. / Empty result no-issue proof nahi.", "related": ["Metric", "Application Insights", "Alert"], "chapter": 21}, {"id": "concept-54", "name": "Application Insights", "aliases": ["Application Insights", "App Insights", "trace", "telemetry"], "en": "Application Insights is application observability within Azure Monitor. It can collect requests, dependencies, exceptions and traces when instrumented and configured.", "hi": "Application Insights app observability hai. Instrumentation/config ke baad requests, exceptions aur dependencies collect kar sakta hai.", "purpose": "It helps explain application performance and failures. / Slow request ka dependency reason mil sakta hai.", "working": "Instrument the app and correlate operations across dependencies. Sampling, retention and data collection affect what is visible and what it costs. / Every event stored assume mat karo.", "example": "Find a slow request and inspect its SQL dependency duration. / App aur DB time alag dekho.", "portal": "Application Insights resource → Failures, Performance, Transaction search or Logs. / Incident time range match karo.", "mistake": "It is not a replacement for application testing or access control. / Monitoring app ko auto-correct nahi karta.", "related": ["Log", "Metric", "API"], "chapter": 21}, {"id": "concept-55", "name": "Alert", "aliases": ["Alert", "alerts", "Action group"], "en": "An alert evaluates a configured signal and can notify or trigger an action group. It detects a condition; remediation requires a separately configured action.", "hi": "Alert signal ki condition evaluate karta hai aur notification/action group trigger kar sakta hai. Detect aur fix alag kaam hain.", "purpose": "It helps detect important failures or spending changes. / Issue jaldi pata chalta hai.", "working": "Select scope, signal, threshold, evaluation period and notification/action target. Test delivery. / Sirf rule banana enough nahi.", "example": "Sustained failed-request rate triggers an operations email. / One noisy spike par alert avoid karo.", "portal": "Azure Monitor → Alerts → Create alert rule, or resource → Alerts. / Cost budget alerts ka workflow alag ho sakta hai.", "mistake": "An alert is not a hard spending cap. / Notification billing ko automatically stop nahi karti.", "related": ["Metric", "Budget", "Log"], "chapter": 21}, {"id": "concept-56", "name": "TLS", "aliases": ["TLS", "HTTPS", "certificate"], "en": "TLS protects data in transit and authenticates the server endpoint through certificate validation. HTTPS is HTTP over TLS.", "hi": "TLS transit data protect karta hai aur certificate se server identity validate hoti hai. HTTPS HTTP over TLS hai.", "purpose": "It secures the transport path between client and endpoint. / Network path ka encryption.", "working": "The client validates a certificate for the hostname and negotiates encryption. This does not replace user authentication or secure backend code. / HTTPS ka matlab business authorization nahi.", "example": "A custom domain must have a matching valid certificate. / Name mismatch se browser error aata hai.", "portal": "Web App → Certificates / Custom domains or gateway TLS settings. / Service ke actual binding verify karo.", "mistake": "Do not bypass certificate validation to hide a hostname or trust problem. / Root issue fix karo.", "related": ["DNS", "Authentication", "API"], "chapter": 11}, {"id": "service-availability-sets", "name": "Availability sets", "aliases": ["Availability sets"], "en": "", "hi": "VMs ko alag fault aur update domains mein distribute karne ki grouping; physical proximity guarantee nahi.", "purpose": "", "working": "", "example": "Do API VMs ko ek hardware failure se dono down hone ka risk kam karna.", "portal": "", "mistake": "This is a reference entry. Do not assume it has a standalone Create action; it may be a feature, portal tool, supporting resource or legacy offe w one. A resource page usually has Overview, Settings, Monitoring and Access control. Reading these pages does not create a paid resource.", "hi": "Azure Microsoft ka cloud platform hai. Apna physical server kharidne ke bajay aap computing, storage aur managed services use karte ho. Azure Portal in services ka control panel hai. Aapki app portal ke andar nahi, us service ke server par chalti hai jise aap deploy karte ho.\nSabse pehle top search bar use karo. Service search karo, phir existing resource kholo ya naya banao. Overview par basic details, Settings mein configuration aur Monitoring mein performance milti hai.", "purpose": "", "working": "", "example": "HRMS: React frontend displays the screen, an API processes requests, and SQL Database stores employee records. / React screen dikhata hai, API request process karti hai aur SQL records rakhta hai.", "portal": "", "mistake": "An empty list can mean the wrong subscription filter, directory or missing permission. Check these before creating another resource. / Empty list par directory, subscription filter aur permission check karo.", "related": [], "chapter": 0, "diagramContext": true}, {"id": "diagram-0-330", "name": "Application", "aliases": ["Application"], "en": "Azure is Microsoft’s cloud platform. Instead of buying a physical server, you can rent computing, storage and managed services. Azure Portal is the website used to create and manage these resources. The portal itself is a control panel; your application runs on the resources you choose.\nStart with the search box at the top. Open a service, then choose an existing resource or create a new one. A resource page usually has Overview, Settings, Monitoring and Access control. Reading these pages does not create a paid resource.", "hi": "Azure Microsoft ka cloud platform hai. Apna physical server kharidne ke bajay aap computing, storage aur managed services use karte ho. Azure Portal in services ka control panel hai. Aapki app portal ke andar nahi, us service ke server par chalti hai jise aap deploy karte ho.\nSabse pehle top search bar use karo. Service search karo, phir existing resource kholo ya naya banao. Overview par basic details, Settings mein configuration aur Monitoring mein performance milti hai.", "purpose": "", "working": "", "example": "HRMS: React frontend displays the screen, an API processes requests, and SQL Database stores employee records. / React screen dikhata hai, API request process karti hai aur SQL records rakhta hai.", "portal": "", "mistake": "An empty list can mean the wrong subscription filter, directory or missing permission. Check these before creating another resource. / Empty list par directory, subscription filter aur permission check karo.", "related": [], "chapter": 0, "diagramContext": true}, {"id": "diagram-2-331", "name": "Zone A", "aliases": ["Zone A"], "en": "A region is a geographic area where Azure operates data centres. An availability zone is a physically separate location inside a supported region. Using two instances in different zones can reduce the impact of a single zone failure, but only if the selected service and configuration support it.\nChoose a region near users and required data locations. Also check service availability, quota and price. Disaster recovery across regions is a separate design decision; selecting a region alone does not create a backup system.", "hi": "Region ek geographic area hai, jaise Central India. Availability zone us region ke andar alag physical location hai. Supported service ko multiple zones mein configure karne se ek zone failure ka impact kam ho sakta hai.\nUsers ke paas region choose karo, lekin service availability aur quota bhi dekho. Sirf region select karne se backup ya disaster recovery setup nahi hota.", "purpose": "", "working": "", "example": "A Bhopal HRMS can evaluate an India region for latency and data needs. / Region sirf distance se nahi, requirements se choose karo.", "portal": "", "mistake": "A region missing fro and period. An invoice is a billing document, and an outstanding balance is an amount still due. Do not treat every usage total as a payment request. Cost data can arrive later, and forecasts are estimates.", "hi": "Free tier, trial credit aur budget alag cheezein hain. Free tier mein limit tak usage free hota hai. Credit paid service ka kharcha temporarily cover karta hai. Budget alert deta hai; apne aap maximum bill fix nahi karta.\nCost Analysis usage ka hisaab dikhata hai. Invoice billing document hai aur amount due wo paisa hai jo dena baaki hai. Forecast future estimate hai, ab tak ka actual charge nahi. Data update hone mein delay bhi ho sakta hai.", "purpose": "", "working": "", "example": "Historical example from your portal: SQL ₹0, Container Apps ₹318.60 in the same group. These are earlier observations, not a current bill. / Ye purana example hai, live balance nahi.", "portal": "", "mistake": "₹0 on a logical SQL server does not prove every child database is free. Group totals also include other services. / SQL server ka zero aur poore group ka total alag hai.", "related": [], "chapter": 3, "diagramContext": true}, {"id": "diagram-3-334", "name": "Recorded cost", "aliases": ["Recorded cost"], "en": "A free tier, trial credit and a budget are three different things. A free tier covers specified usage or features. Trial credit pays eligible charges for a limited period. A budget tracks a target and can send alerts; it does not automatically guarantee a hard spending cap.\nCost Analysis shows recorded usage for the chosen scope and period. An invoice is a billing document, and an outstanding balance is an amount still due. Do not treat every usage total as a payment request. Cost data can arrive later, and forecasts are estimates.", "hi": "Free tier, trial credit aur budget alag cheezein hain. Free tier mein limit tak usage free hota hai. Credit paid service ka kharcha temporarily cover karta hai. Budget alert deta hai; apne aap maximum bill fix nahi karta.

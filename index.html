</style></head><body><header><div class="brand"><span>◈</span> Azure Hand book<small>THEORY + PORTAL PRACTICE HANDBOOK</small></div><div class="controls"><button class="menu" id="menu" aria-label="Open chapter navigation">☰</button><select id="language" aria-label="Language"><option value="en">English</option><option value="hi">Hinglish</option></select><button id="theme">Dark</button><button id="print">Print</button></div></header><div class="layout"><aside id="sidebar"><input id="search" type="search" placeholder="Find chapter: SQL, billing…" aria-label="Find chapter"><div class="navtop"><button id="home">Start here</button><button id="catalog">293 references</button></div><div class="tiny" id="progresslabel"></div><div class="progress"><i id="progress"></i></div><nav id="chapters" aria-label="Chapters"></nav><p class="tiny">Offline handbook · Illustrated guides, not a live Azure session. Portal labels and available tiers may vary.</p><button class="btn" id="export">Export progress</button> <button class="btn" id="import">Import</button><input hidden type="file" id="progressfile" accept=".json"></aside><main id="content"></main></div><script id="lessons" type="application/json">[{"id": "lesson-1", "title": "Azure Portal: start here", "group": "01 · Foundations", "en": "Azure is Microsoft’s cloud platform. Instead of buying a physical server, you can rent computing, storage and managed services. Azure Portal is the website used to create and manage these resources. The portal itself is a control panel; your application runs on the resources you choose.\nStart with the search box at the top. Open a service, then choose an existing resource or create a new one. A resource page usually has Overview, Settings, Monitoring and Access control. Reading these pages does not create a paid resource.", "hi": "Azure Microsoft ka cloud platform hai. Apna physical server kharidne ke bajay aap computing, storage aur managed services use karte ho. Azure Portal in services ka control panel hai. Aapki app portal ke andar nahi, us service ke server par chalti hai jise aap deploy karte ho.\nSabse pehle top search bar use karo. Service search karo, phir existing resource kholo ya naya banao. Overview par basic details, Settings mein configuration aur Monitoring mein performance milti hai.", "example": "HRMS: React frontend displays the screen, an API processes requests, and SQL Database stores employee records. / React screen dikhata hai, API request process karti hai aur SQL records rakhta hai.", "steps": [["Open the portal", "Sign in to portal.azure.com. Read the current directory and subscription. / Login karke directory aur subscription dekho."], ["Find a service", "Use the top search box and enter App Services. / Top search mein App Services likho."], ["Read a resource", "Open an existing app and inspect Overview: status, region, domain and plan. / Existing app ki basic details dekho."], ["Find settings", "Use the resource menu search to find Configuration, Metrics or Activity log. / Left menu search se setting dhundho."]], "verify": ["You can identify the subscription and resource type.", "You can explain the difference between Azure and Azure Portal."], "fix": "An empty list can mean the wrong subscription filter, directory or missing permission. Check these before creating another resource. / Empty list par directory, subscription filter aur permission check karo.", "cost": "Opening and reading portal pages does not itself deploy a chargeable resource. / Portal dekhne se resource deploy nahi hota.", "flow": ["Azure Portal", "Resource", "Application"], "source": "https://learn.microsoft.com/azure/azure-portal/azure-portal-overview", "hindi": "Azure, Microsoft का क्लाउड प्लेटफ़ॉर्म है। अपना भौतिक सर्वर खरीदने के बजाय आप कंप्यूटिंग, स्टोरेज और प्रबंधित सेवाएँ इस्तेमाल कर सकते हैं। Azure Portal इन सेवाओं का नियंत्रण पटल है। आपकी एप्लिकेशन पोर्टल के अंदर नहीं, चुने गए संसाधनों पर चलती है।\nऊपर दिए खोज बॉक्स से कोई सेवा खोजें और उसका संसाधन खोलें। Overview में मुख्य जानकारी, Settings में कॉन्फ़िगरेशन और Monitoring में प्रदर्शन मिलता है। केवल जानकारी देखने से कोई नया भुगतान वाला संसाधन नहीं बनता।"}, {"id": "lesson-2", "title": "Tenant, subscription and resource group", "group": "01 · Foundations", "en": "A tenant is the identity directory: it contains users, groups and application identities. A subscription is a billing and management boundary associated with a tenant. A resource group organizes resources that you want to manage together. A resource is an actual item such as a web app or database.\nA resource group name does not tell you which service produced a charge. A group called hrms-db can contain a database, a container app and a registry. Its cost is the sum of the resources inside it.", "hi": "Tenant identities ki directory hai: users, groups aur app identities yahan hoti hain. Subscription billing aur management ka scope hai. Resource group ek logical folder jaisa hai. Web App, database aur VM actual resources hain.\nGroup ka naam hrms-db ho to bhi uske andar API aur registry ho sakte hain. Group ka total cost database ka cost samajhna galat hoga. Charge kis service ne banaya, ye resource ya service breakdown se pata chalega.", "example": "One subscription → rg-hrms-dev → frontend, API and SQL. / Ek project ke related resources ek group mein.", "steps": [["Open Resource groups", "Search Resource groups, select Create and choose the intended subscription. / Resource groups search karke Create kholo."], ["Name the group", "Use rg-azure-handbook-lab. Choose a metadata region. Resources can use other regions. / Naam do; group ka region members ko force nahi karta."], ["Review and create", "Read Review + create, then create the empty group. / Details review karke empty group banao."], ["Inspect the result", "Open the group; its resource list is empty until you add something. / Abhi resource list empty hogi."]], "verify": ["The empty group appears in the selected subscription.", "You can distinguish a group name from a resource type."], "fix": "An authorization failure usually needs the correct RBAC role at the selected scope. / Permission error par scope aur role check karo.", "cost": "A resource group has no separate compute charge; resources inside can be chargeable. / Group ka alag compute bill nahi, andar ki services ka ho sakta hai.", "flow": ["Tenant", "Subscription", "Resource group", "Resources"], "source": "https://learn.microsoft.com/azure/azure-resource-manager/management/overview", "hindi": "Tenant, Microsoft Entra ID की पहचान निर्देशिका है। इसमें उपयोगकर्ता, समूह और एप्लिकेशन की पहचान रहती है। Subscription बिलिंग और प्रबंधन की सीमा है। Resource group संबंधित संसाधनों को साथ व्यवस्थित करता है। Web App, डेटाबेस और VM वास्तविक संसाधन हैं।\nकिसी समूह का नाम उसके खर्च का स्रोत नहीं बताता। hrms-db नाम के समूह में डेटाबेस, Container App और Registry साथ हो सकते हैं। समूह का कुल खर्च सभी सदस्यों का योग है; डेटाबेस का खर्च जानने के लिए अलग विवरण देखें।"}, {"id": "lesson-3", "title": "Regions, zones and availability", "group": "01 · Foundations", "en": "A region is a geographic area where Azure operates data centres. An availability zone is a physically separate location inside a supported region. Using two instances in different zones can reduce the impact of a single zone failure, but only if the selected service and configuration support it.\nChoose a region near users and required data locations. Also check service availability, quota and price. Disaster recovery across regions is a separate design decision; selecting a region alone does not create a backup system.", "hi": "Region ek geographic area hai, jaise Central India. Availability zone us region ke andar alag physical location hai. Supported service ko multiple zones mein configure karne se ek zone failure ka impact kam ho sakta hai.\nUsers ke paas region choose karo, lekin service availability aur quota bhi dekho. Sirf region select karne se backup ya disaster recovery setup nahi hota.", "example": "A Bhopal HRMS can evaluate an India region for latency and data needs. / Region sirf distance se nahi, requirements se choose karo.", "steps": [["Inspect an existing resource", "Open Overview and read Location. / Overview mein Location dekho."], ["Check creation choices", "Open a service Create form and inspect its Region dropdown without submitting. / Form mein available regions dekho."], ["Check zone support", "Read Availability options on that service; options differ by SKU. / Zone options tier par depend karte hain."]], "verify": ["You can name the resource region.", "You do not confuse a zone with another region."], "fix": "A region missing from a dropdown may indicate service, subscription or SKU restrictions. / Missing region ka matlab service ya offer restriction ho sakta hai.", "cost": "Zone redundancy, replication and cross-region transfers can change cost. / Redundancy aur transfer ka charge alag ho sakta hai.", "flow": ["Region", "Zone A", "Zone B"], "source": "https://learn.microsoft.com/azure/reliability/availability-zones-overview", "hindi": "Region वह भौगोलिक क्षेत्र है जहाँ Azure का बुनियादी ढाँचा उपलब्ध है। Availability zone किसी समर्थित region के भीतर भौतिक रूप से अलग स्थान है। कई zones में समर्थित कॉन्फ़िगरेशन रखने से एक स्थान की विफलता का असर कम हो सकता है।\nRegion चुनते समय उपयोगकर्ताओं की दूरी, डेटा की आवश्यकताएँ, सेवा की उपलब्धता, कोटा और मूल्य देखें। केवल region चुनने से बैकअप या disaster recovery तैयार नहीं होती। दूसरे region में पुनर्प्राप्ति अलग से डिज़ाइन करनी पड़ती है।"}, {"id": "lesson-4", "title": "Billing: free, credits and actual cost", "group": "02 · Cost and safety", "en": "A free tier, trial credit and a budget are three different things. A free tier covers specified usage or features. Trial credit pays eligible charges for a limited period. A budget tracks a target and can send alerts; it does not automatically guarantee a hard spending cap.\nCost Analysis shows recorded usage for the chosen scope and period. An invoice is a billing document, and an outstanding balance is an amount still due. Do not treat every usage total as a payment request. Cost data can arrive later, and forecasts are estimates.", "hi": "Free tier, trial credit aur budget alag cheezein hain. Free tier mein limit tak usage free hota hai. Credit paid service ka kharcha temporarily cover karta hai. Budget alert deta hai; apne aap maximum bill fix nahi karta.\nCost Analysis usage ka hisaab dikhata hai. Invoice billing document hai aur amount due wo paisa hai jo dena baaki hai. Forecast future estimate hai, ab tak ka actual charge nahi. Data update hone mein delay bhi ho sakta hai.", "example": "Historical example from your portal: SQL ₹0, Container Apps ₹318.60 in the same group. These are earlier observations, not a current bill. / Ye purana example hai, live balance nahi.", "steps": [["Open cost analysis", "Search Cost Management, choose the subscription and open Cost analysis. / Sahi subscription ka Cost analysis kholo."], ["Set the period", "Choose This month and Actual cost. / Date aur metric sahi rakho."], ["Break down charges", "Group by Service name, then Resource. Remove accidental filters. / Service aur resource wise kharcha dekho."], ["Inspect billing separately", "Open subscription Billing / Invoices where available, and inspect credits and offer expiry. / Invoice aur credit ko alag dekho."], ["Create an alert", "Open Budgets, add a monthly budget and notification thresholds. / Budget ko alert samjho, hard cap nahi."]], "verify": ["The period and scope match your question.", "You can identify the resource producing the cost.", "You can distinguish actual cost, forecast, credit and amount due."], "fix": "₹0 on a logical SQL server does not prove every child database is free. Group totals also include other services. / SQL server ka zero aur poore group ka total alag hai.", "cost": "No fixed rupee prices are assumed in this handbook. Read the chosen tier and current subscription offer before deployment. / Price tier aur offer ke hisaab se badalta hai.", "flow": ["Usage", "Recorded cost", "Credits or invoice"], "source": "https://learn.microsoft.com/azure/cost-management-billing/costs/quick-acm-cost-analysis", "hindi": "Free tier, trial credit और budget अलग सुविधाएँ हैं। Free tier तय सीमा तक उपयोग को कवर करता है। Trial credit सीमित अवधि में योग्य भुगतान वाली सेवाओं का खर्च भरता है। Budget खर्च पर नज़र रखता है और सूचना दे सकता है; वह अपने आप बिल की कठोर सीमा नहीं बनाता।\nCost Analysis चुने हुए दायरे और अवधि का दर्ज उपयोग दिखाता है। Invoice बिलिंग दस्तावेज़ है और outstanding balance वह राशि है जो देना बाकी है। Forecast अनुमान है। उपयोग का डेटा देर से आ सकता है, इसलिए हर cost figure को भुगतान की माँग न समझें।"}, {"id": "lesson-5", "title": "Web App and App Service plan", "group": "03 · Host an application", "en": "App Service hosts websites and APIs without requiring you to maintain the underlying VM operating system. The Web App is your application resource. The App Service plan supplies compute capacity and determines the tier. Multiple compatible apps can share a plan.\nFree F1 is a limited development option, not unlimited production hosting. Paid plans can keep charging even when an app is stopped. A custom container has different tier requirements from deploying application code; do not assume a container image can run on F1.", "hi": "App Service par website ya API deploy karte ho aur underlying VM ka OS khud maintain nahi karna padta. Web App aapki application hai; App Service plan uski computing capacity aur pricing decide karta hai.\nFree F1 learning ke liye limited plan hai. Paid plan mein sirf app Stop karne se plan ka charge zaroori nahi rukta. Container image aur normal code deployment ki requirements alag hoti hain.", "example": "React frontend and .NET API can be separate web apps. Match each runtime to its actual code. / React ke liye Node aur .NET API ke liye supported .NET runtime.", "steps": [["Open the creation form", "Search App Services → Create → Web App. / App Services se Web App form kholo."], ["Set basics", "Choose subscription, lab group and a unique name; select Code for code deployment. / Basics bharo aur Code select karo."], ["Match the runtime", "Select a supported runtime that matches the project, then OS and region. / Project ke hisaab se runtime choose karo."], ["Check the plan", "Create or select a compatible plan. Select Free F1 only if offered and suitable. Do not accept a paid default unintentionally. / Default paid tier ko dhyan se check karo."], ["Review and deploy", "Review the summary, create, wait for completion, then Go to resource. / Summary ke baad deploy karo."], ["Publish your application", "Use Deployment Center or a supported local publishing workflow. Creation alone does not upload your code. / App banana aur code publish karna alag steps hain."]], "verify": ["Overview shows the expected runtime and plan.", "The default domain opens your application after deployment.", "Logs show startup without repeated failures."], "fix": "503 or startup failure: inspect Log stream, startup command, runtime version and application port. A default welcome page means your code may not be deployed. / Welcome page ka matlab code deploy nahi hua ho sakta.", "cost": "F1 has quotas and feature limits. Paid plans are billed for provisioned capacity; check all apps sharing a plan before deleting or changing it. / Shared plan badalne se dusri apps bhi affect hongi.", "flow": ["Browser", "Web App", "App Service plan"], "source": "https://learn.microsoft.com/azure/app-service/overview-hosting-plans", "hindi": "App Service वेबसाइट और API चलाने की सेवा है। इसमें मूल VM के ऑपरेटिंग सिस्टम का रखरखाव आपको नहीं करना पड़ता। Web App आपकी एप्लिकेशन का संसाधन है, जबकि App Service plan उसकी कंप्यूटिंग क्षमता और कीमत वाला स्तर तय करता है। कई उपयुक्त apps एक plan साझा कर सकती हैं।\nFree F1 सीखने और विकास के लिए सीमित विकल्प है। भुगतान वाले plan पर एक app रोकने से plan का खर्च आवश्यक रूप से नहीं रुकता। सामान्य code deployment और custom container की आवश्यकताएँ अलग हैं; किसी image को सीधे F1 पर चलने योग्य न मानें।"}, {"id": "lesson-6", "title": "Container Apps: images, replicas and cost", "group": "03 · Host an application", "en": "A container image packages an application and its dependencies. A registry stores that image. Container Apps pulls the image and runs replicas. A revision is a versioned snapshot of the app configuration. Traffic can be assigned to active revisions.\nContainer Apps is not automatically always paid and not automatically always free. Consumption has a monthly free grant; usage beyond it is billable. Plan type, CPU, memory, replicas and requests affect charges. Related registries and logs have their own pricing.", "hi": "Container image app aur dependencies ka package hai. Registry image ko store karti hai. Container Apps image se running replicas banata hai. Revision app configuration ka version hai.\nContainer use karna akela paid hone ka reason nahi. Consumption plan mein free allowance ho sakta hai; uske baad usage bill hota hai. CPU, RAM, replicas, requests aur plan type matter karte hain. Registry aur logs ka cost alag ho sakta hai.", "example": "An API image lives in ACR, while Container Apps executes it. / Registry godown jaisa hai; Container App actual app chalata hai.", "steps": [["Inspect the current app", "Search Container Apps → select app → Overview. Read environment and URL. / Overview se environment aur URL dekho."], ["Read image settings", "App → Containers: record registry, image and tag without changing secrets. / Image aur tag dekho."], ["Read scaling", "App → Scale: inspect minimum, maximum and triggers. Minimum zero does not guarantee every workload can scale to zero. / Scaling rules samjho."], ["Create a lab app if needed", "Create a Container App with a chosen environment and sample image; review plan and ingress before submitting. / Sample ke liye pricing aur ingress pehle check karo."], ["Verify a revision", "Open Revisions and replicas, check health and traffic assignment, then test its URL. / Healthy revision aur traffic check karo."]], "verify": ["The running image tag matches the intended build.", "A healthy revision receives the intended traffic.", "Cost analysis is grouped by resource to verify cost."], "fix": "Image pull errors usually involve registry access or a missing tag. Startup failures can be a port mismatch or missing environment setting. / Registry permission, tag, port aur variables check karo.", "cost": "Compare actual billing meters, not just the app name. Stopping an app does not prove its environment, registry or logs are free. / Related resources bhi inspect karo.", "flow": ["Registry image", "Revision", "Replica", "API response"], "source": "https://learn.microsoft.com/azure/container-apps/billing", "hindi": "Container image में एप्लिकेशन और उसकी आवश्यक निर्भरताएँ पैक होती हैं। Registry इस image को रखती है। Container Apps image लेकर उसकी चलती प्रतियाँ, यानी replicas, बनाता है। Revision कॉन्फ़िगरेशन का संस्करण है; traffic स्वस्थ revisions को दिया जाता है।\nContainer इस्तेमाल करने का अर्थ अपने आप भुगतान लगना नहीं है। Consumption plan में मासिक free allowance हो सकता है; उसके बाहर का उपयोग शुल्क वाला होता है। CPU, memory, replicas, requests और plan का प्रकार खर्च बदलते हैं। Registry और logs की कीमत अलग हो सकती है।"}, {"id": "lesson-7", "title": "Azure Functions: run on an event", "group": "03 · Host an application", "en": "Azure Functions runs small pieces of application code when a trigger occurs. A trigger can be an HTTP request, timer or queue message. The Function App groups functions and supplies hosting configuration. The selected hosting plan controls scaling and billing.\nUse a function for a focused task such as processing a file after upload. It is not necessary to rewrite every API as functions. Long-running work, dependencies and execution limits should influence the design.", "hi": "Azure Functions event aane par code chalata hai. Event HTTP request, timer ya queue message ho sakta hai. Function App multiple functions ka hosting container hai. Hosting plan scaling aur billing decide karta hai.\nFile upload ke baad PDF process karna ek acha example hai. Har API ko Function banana zaroori nahi. Execution time aur dependencies pehle samjho.", "example": "An uploaded attendance file triggers validation and a queue message. / File aayi to validation chale.", "steps": [["Choose a hosting option", "Search Function App → Create and inspect available hosting plans. / Hosting options padho."], ["Set runtime and storage", "Choose a runtime, group, region and required storage configuration. / Runtime aur storage configure karo."], ["Create and publish", "Review pricing, create the app, then publish a trigger function using a supported development tool. / App ke baad function code publish karo."], ["Test the trigger", "For HTTP, use the test interface or function URL with its configured authentication. / Trigger test karo, keys share mat karo."]], "verify": ["A test trigger creates one expected execution.", "Invocation logs show success or a useful exception."], "fix": "A function with no invocations may have a disabled trigger, wrong queue/storage or incorrect endpoint. / Trigger aur binding config dekho.", "cost": "Hosting and storage can both produce charges. Free grants depend on the selected plan. / Serverless ka matlab unlimited free nahi.", "flow": ["Event", "Trigger", "Function", "Result"], "source": "https://learn.microsoft.com/azure/azure-functions/functions-overview", "hindi": "Azure Functions किसी घटना के आने पर छोटा कार्य चलाता है। HTTP request, timer और queue message इसके trigger हो सकते हैं। Function App इन functions और उनकी hosting configuration को साथ रखता है। चुना गया plan scaling और बिलिंग तय करता है।\nउदाहरण के लिए फ़ाइल आने पर उसकी जाँच करवाना उपयोगी कार्य है। हर API को Function में बदलना ज़रूरी नहीं। कार्य की अवधि, निर्भरताएँ, retry और execution limits देखकर विकल्प चुनें।"}, {"id": "lesson-8", "title": "Virtual Machines: your cloud server", "group": "03 · Host an application", "en": "A VM is a rented computer with an operating system. You choose CPU, memory, disks and networking, then maintain the OS and installed applications. Compared with App Service, it offers more control and more operational responsibility.\nStopping inside Windows is different from deallocating the VM in Azure. Deallocation normally releases compute allocation, but disks and other attached services can still cost money.", "hi": "VM cloud mein rented computer hai. CPU, RAM, disk aur OS choose karte ho. Software install karna, patching aur OS maintenance aapki responsibility hoti hai.\nWindows ke andar shutdown aur Azure mein deallocate alag hain. Deallocate se compute charge ruk sakta hai, lekin disk aur dusre resources ka charge reh sakta hai.", "example": "An older application requiring custom IIS modules may need a Windows VM. / Extra OS control ki zaroorat ho to VM.", "steps": [["Create a VM form", "Search Virtual machines → Create → Azure virtual machine. / VM creation form kholo."], ["Choose essentials", "Select lab group, region, supported OS image and smallest suitable size. / OS aur size sochkar choose karo."], ["Configure access", "Use SSH keys for Linux or secure Windows access; avoid opening management ports to everyone. / Management access restricted rakho."], ["Check disks and network", "Review disk tier, VNet, subnet, public IP and inbound rules. / Sirf VM size ka cost mat dekho."], ["Review and connect", "Review estimated cost, create, wait and connect using the approved method. / Deployment ke baad connect karo."], ["Clean up the lab", "Deallocate when finished; review disks and group resources before deleting disposable lab resources. / Disk aur IP bhi check karo."]], "verify": ["Overview reports Running and the intended size.", "A secure connection reaches the selected OS."], "fix": "Connection failure: check VM status, NSG source/port, route and OS firewall. / Sirf NSG nahi, OS firewall bhi dekho.", "cost": "Compute, disks, IPs, backup and outbound traffic may be separate meters. / VM ka total multiple resources ka ho sakta hai.", "flow": ["User", "Network rules", "VM operating system", "Application"], "source": "https://learn.microsoft.com/azure/virtual-machines/overview", "hindi": "Virtual Machine क्लाउड में किराए का कंप्यूटर है। आप CPU, RAM, disk, network और operating system चुनते हैं। उसके बाद OS, patches और स्थापित software का रखरखाव आपकी ज़िम्मेदारी होती है। App Service की तुलना में नियंत्रण अधिक है, लेकिन प्रबंधन भी अधिक है।\nWindows के अंदर shutdown करना और Azure में VM deallocate करना अलग हैं। Deallocation से compute allocation हट सकता है, लेकिन disk, backup और अन्य संबंधित संसाधनों का खर्च जारी रह सकता है।"}, {"id": "lesson-9", "title": "Scaling and load balancing", "group": "04 · Networking", "en": "Scale up means giving an instance more capacity. Scale out means adding instances. A load balancer distributes traffic across healthy backends; an autoscaling controller decides when to add or remove capacity according to supported rules. These are separate jobs.\nAdding instances works only when the application supports it. Shared state, session storage, database capacity and connection pools can become bottlenecks. A bigger pool does not make the database infinitely fast.", "hi": "Scale up mein ek instance ko zyada CPU/RAM dete hain. Scale out mein instances ki count badhti hai. Load balancer requests baantta hai. Autoscaler rules ke hisaab se instances badhata ya ghatata hai.\nApp ko multiple instances par chalne layak banana bhi padta hai. Session, database aur connection pool bottleneck ho sakte hain. Pool ko bahut bada karna har problem ka solution nahi.", "example": "If three API instances are healthy, the balancer can distribute requests. An autoscale rule may later add a fourth. / Baantna aur count badhana alag kaam hain.", "steps": [["Inspect the hosting plan", "Open your App Service plan or VM scale set. / App ka actual compute owner kholo."], ["Compare controls", "Read Scale up and Scale out. Available features depend on SKU. / Tier support dekho."], ["Plan a rule", "Choose a real metric, threshold, evaluation period and minimum/maximum. / Example: sustained high CPU, not one spike."], ["Validate before enabling", "Check stateless behavior, health probes and database limits; review cost before saving. / App aur DB capacity verify karo."]], "verify": ["Traffic distribution and capacity control are described separately.", "Metrics and health show whether extra instances help."], "fix": "If scaling does not improve latency, inspect database time, external calls, locks and queue depth. / Bottleneck kahin aur ho sakta hai.", "cost": "Extra instances usually increase cost. Free/shared tiers do not provide every scale capability. / Autoscale cost ko bhi scale kar sakta hai.", "flow": ["Users", "Load balancer", "Healthy API instances", "Database"], "source": "https://learn.microsoft.com/azure/azure-monitor/autoscale/autoscale-overview", "hindi": "Scale up में एक instance को अधिक क्षमता दी जाती है। Scale out में instances की संख्या बढ़ती है। Load balancer स्वस्थ instances में traffic बाँटता है। Autoscaling controller तय नियमों के अनुसार क्षमता बढ़ाने या घटाने का निर्णय लेता है।\nकई instances तभी लाभ देते हैं जब app और उसकी निर्भरताएँ उसके लिए तैयार हों। Session state, SQL queries और connection pools bottleneck बन सकते हैं। केवल pool बड़ा करने से डेटाबेस असीमित तेज़ नहीं हो जाता।"}, {"id": "lesson-10", "title": "VNet, subnet and private IP", "group": "04 · Networking", "en": "A virtual network is a private address network in Azure. A subnet is a smaller range inside it. Resources connected to a subnet can receive private IP addresses from that range. A private IP is not an internet address, but private addressing alone is not a complete security policy.\nFor a learning example, use VNet 10.20.0.0/16 and subnet 10.20.1.0/24. The subnet sits inside the VNet range. Avoid overlapping ranges when networks may later connect.", "hi": "VNet Azure ka private address network hai. Subnet us network ka chhota hissa hai. Subnet se connected resource ko us range ka private IP mil sakta hai. Private IP internet address nahi hota, lekin security ke liye rules bhi chahiye.\nExample VNet 10.20.0.0/16 aur subnet 10.20.1.0/24 hai. Subnet ki range VNet ke andar honi chahiye. Future connection ke liye overlapping range avoid karo.", "example": "Keep application VMs in an app subnet and database VMs in a data subnet, then apply appropriate traffic rules. / Sirf subnet alag karne se traffic block nahi hota.", "steps": [["Open Virtual networks", "Search Virtual networks → Create. / VNet form kholo."], ["Choose basics", "Use the lab group and intended region, name vnet-handbook. / Basic details bharo."], ["Set address space", "On IP addresses enter 10.20.0.0/16 for the lab. / Address space set karo."], ["Add a subnet", "Create snet-app with 10.20.1.0/24. Leave unrelated paid features off for this simple lab. / Subnet add karo."], ["Review and inspect", "Create, open Subnets and verify the range. / Range verify karo."]], "verify": ["The subnet range belongs to the VNet.", "No unwanted gateway, firewall or other paid add-on was selected."], "fix": "Overlapping ranges prevent some network connections. An invalid subnet may be outside its VNet address space. / CIDR range check karo.", "cost": "VNet alone has no hourly network-container charge; connected services, peering and traffic features can have charges. / Add-on services ka cost alag hai.", "flow": ["VNet 10.20.0.0/16", "App subnet 10.20.1.0/24", "Private IP 10.20.1.4"], "source": "https://learn.microsoft.com/azure/virtual-network/quickstart-create-virtual-network", "hindi": "Virtual network या VNet, Azure का निजी IP network है। Subnet उसकी छोटी address range है। उससे जुड़े संसाधन उस range से निजी IP ले सकते हैं। निजी IP अपने आप पूरी सुरक्षा नीति नहीं है; routing और access rules भी चाहिए।\nउदाहरण में VNet 10.20.0.0/16 और subnet 10.20.1.0/24 है। Subnet की सीमा VNet के अंदर होनी चाहिए। जिन networks को आगे जोड़ना है, उनकी ranges एक-दूसरे पर चढ़नी नहीं चाहिए।"}, {"id": "lesson-11", "title": "NSG: allow and deny network traffic", "group": "04 · Networking", "en": "A Network Security Group filters network traffic using rules. Rules compare source, destination, protocol, port and direction. Lower priority numbers are evaluated first. NSGs can be associated with subnets or network interfaces.\nAn NSG is not a web application firewall and does not authenticate a user. It filters traffic at the network level. Existing default rules and rules on both subnet and interface affect the effective result.", "hi": "NSG traffic ka gatekeeper hai. Source, destination, port, protocol aur direction dekhkar allow ya deny karta hai. Chhota priority number pehle evaluate hota hai. NSG subnet ya network interface par lag sakta hai.\nNSG user login nahi karata aur website attacks ka full WAF nahi hai. Subnet aur interface dono ki effective rules samajhna zaroori hai.", "example": "Allow HTTPS 443 to a web VM, but restrict RDP/SSH management to approved sources. / Management port sabke liye open mat rakho.", "steps": [["Create an NSG", "Search Network security groups → Create in the lab group. / NSG banao."], ["Read default rules", "Open Inbound security rules and inspect defaults first. / Pehle existing rules padho."], ["Add a narrow rule", "Set a specific source, destination port, protocol and unused priority. / Required traffic ka narrow rule banao."], ["Associate intentionally", "Open Subnets or Network interfaces and associate with the intended test target. / Sahi target par lagao."], ["Check effective access", "Use the VM network interface effective security rules or Network Watcher diagnostics. / Effective result check karo."]], "verify": ["The intended test traffic is allowed.", "Unnecessary management access remains restricted."], "fix": "A higher-priority deny may override your new allow. Also inspect OS firewall and routing. / Priority aur firewall dono dekho.", "cost": "NSG rules do not replace paid firewall/WAF services when those capabilities are required. / Dono ka purpose alag hai.", "flow": ["Source IP", "NSG rule", "Allowed port", "Target"], "source": "https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview", "hindi": "Network Security Group यानी NSG, network traffic को नियमों के आधार पर अनुमति देता या रोकता है। नियम source, destination, port, protocol और direction देखते हैं। कम priority number वाला नियम पहले जाँचा जाता है। NSG subnet या network interface पर लगाया जा सकता है।\nNSG उपयोगकर्ता का login नहीं कराता और Web Application Firewall का विकल्प नहीं है। Subnet और interface दोनों के लागू नियम तथा OS firewall मिलकर अंतिम connectivity तय कर सकते हैं।"}, {"id": "lesson-12", "title": "Public IP, DNS and domains", "group": "04 · Networking", "en": "A public IP can be reached from the internet when routing and security permit it. DNS converts a name into an address or another name. A custom domain gives your application a friendly name; it does not by itself add authentication or secure the application.\nA DNS record, TLS certificate and hosting binding are related but separate pieces. You must verify domain ownership and bind the hostname on the service. Private DNS is used for private network name resolution.", "hi": "Public IP internet se reachable address ho sakta hai, agar routing aur rules allow karein. DNS naam ko address se map karta hai. Custom domain app ko friendly naam deta hai, lekin login security apne aap nahi deta.\nDNS record, certificate aur hosting binding alag parts hain. Domain ownership verify karke app par hostname add karna hota hai. Private DNS private network ke names resolve karta hai.", "example": "hrms.example.com points to your supported hosting endpoint. / Browser pehle DNS se destination dhundhta hai.", "steps": [["Read your existing hostname", "Open Web App Overview and note Default domain. / Default domain dekho."], ["Inspect custom domains", "Open Custom domains and read tier requirements before adding a domain. / Tier support check karo."], ["Prepare DNS", "At the domain DNS provider, add the exact validation and routing records requested by Azure. / Exact values copy karo."], ["Validate and secure", "Validate ownership, add the binding and configure a supported TLS certificate. / Domain aur TLS dono verify karo."]], "verify": ["DNS resolves to the expected target.", "HTTPS certificate matches the hostname."], "fix": "Wrong DNS zone, cached records and missing domain bindings cause common failures. / Sirf DNS entry banana kaafi nahi.", "cost": "Domain registration, public IP and DNS hosting can each be billed separately. / Free hostname aur purchased domain alag hain.", "flow": ["Domain name", "DNS lookup", "Hosting endpoint", "HTTPS app"], "source": "https://learn.microsoft.com/azure/dns/dns-overview", "hindi": "Public IP इंटरनेट पर route होने योग्य पता है, लेकिन पहुँच के लिए routing और सुरक्षा नियम सही होने चाहिए। DNS किसी hostname को address या दूसरे नाम से जोड़ता है। Custom domain आपकी app को आसान नाम देता है; उससे authentication अपने आप नहीं मिलता।\nDNS record, TLS certificate और hosting binding तीन अलग हिस्से हैं। Domain का स्वामित्व प्रमाणित करके सेवा पर उसका binding जोड़ना पड़ता है। Private DNS निजी network में नाम हल करने के लिए होता है।"}, {"id": "lesson-13", "title": "Private Endpoint and service access", "group": "04 · Networking", "en": "A private endpoint gives a supported service a private network interface in your VNet. Clients use a private IP path to the service. Correct private DNS is essential: clients must resolve the service name to the intended private address.\nCreating a private endpoint does not universally disable public access. Review the service network settings separately. A public frontend can call an API whose database is private; the frontend browser does not need direct database access.", "hi": "Private endpoint supported service ko VNet mein private IP path deta hai. Client service ke normal naam ko private IP par resolve kare, isliye DNS sahi hona bahut zaroori hai.\nPrivate endpoint banate hi public access har service mein automatically band nahi hota. Service ki public network setting alag check karo. Browser ko database se direct connect nahi karna chahiye.", "example": "API → private endpoint → SQL. The user’s browser only talks to the frontend/API. / Database connection backend ka kaam hai.", "steps": [["Inspect the target service", "Open SQL server or Storage account → Networking. / Target ka Networking kholo."], ["Start private endpoint creation", "Select Private endpoint connections → add a private endpoint. / Resource aur subresource sahi select karo."], ["Choose network and DNS", "Select VNet, subnet and appropriate private DNS integration. / DNS integration samjho."], ["Review the change", "Review cost and access impact before creating. Verify DNS from a connected client. / Connected client se test karo."], ["Review public access", "After private connectivity works, decide public access settings explicitly. / Pehle working access verify karo."]], "verify": ["The service name resolves to its private IP from the connected network.", "The app can connect using its normal service hostname."], "fix": "A timeout with a correct password is often networking or DNS, not authentication. / DNS, route aur endpoint approval check karo.", "cost": "Private endpoints and data processing can be chargeable. Do not deploy one just to follow a free lab. / Ye optional paid lab hai.", "flow": ["API in connected network", "Private DNS", "Private endpoint", "SQL service"], "source": "https://learn.microsoft.com/azure/private-link/private-endpoint-overview", "hindi": "Private Endpoint किसी समर्थित सेवा के लिए VNet में निजी network interface और IP देता है। सही Private DNS आवश्यक है, ताकि client सामान्य service hostname को सही निजी पते पर resolve करे।\nEndpoint बन जाने से हर सेवा का public access अपने आप बंद नहीं होता। सेवा की network settings अलग जाँचें। सार्वजनिक frontend का API निजी डेटाबेस से जुड़ सकता है; browser को डेटाबेस तक सीधे पहुँच नहीं चाहिए।"}, {"id": "lesson-14", "title": "Load Balancer, Application Gateway and Front Door", "group": "04 · Networking", "en": "Azure Load Balancer distributes TCP/UDP traffic to regional backends. Application Gateway routes HTTP traffic within a region and can use a WAF tier. Front Door provides a global HTTP entry point with edge routing and optional security features.\nChoose by protocol and scope. A TCP service does not need the same gateway as a global website. A reverse proxy forwards a client request to a backend; it can hide an origin from normal client use, but origin access must still be secured explicitly.", "hi": "Load Balancer regional TCP/UDP traffic baantta hai. Application Gateway regional HTTP routing karta hai. Front Door global website entry point de sakta hai. WAF capability selected tier par depend karti hai.\nProtocol aur scope ke hisaab se service choose karo. Reverse proxy backend ko request forward karta hai. Sirf proxy lagane se backend ka direct access automatically secure nahi hota.", "example": "Global HRMS users → Front Door → regional web/API origins. / Ye architecture example hai, har chhoti app ko zaroorat nahi.", "steps": [["Choose the requirement", "Decide HTTP versus TCP and regional versus global. / Requirement likho."], ["Inspect a creation form", "Search the chosen service → Create. Review SKU and frontend configuration without deploying yet. / Paid default dekho."], ["Configure backends and health", "Define the actual backend target and a valid health check. / Backend aur probe set karo."], ["Configure routing", "Add the required listener, routing rule or load-balancing rule for that service. / Service-specific routing bharo."], ["Test before switching", "Check health, hostname, HTTPS and origin restrictions before changing client traffic. / Pehle test karo."]], "verify": ["Backends report healthy.", "The entry point routes to the expected backend without redirect loops."], "fix": "A failed health probe may use the wrong path, port or host header. / Probe ko actual app ke response se match karo.", "cost": "These services can have base and usage charges. A simple learning app may not need any of them. / Har service add karna goal nahi.", "flow": ["Clients", "Entry point", "Health check", "Backend application"], "source": "https://learn.microsoft.com/azure/architecture/guide/technology-choices/load-balancing-overview", "hindi": "Azure Load Balancer क्षेत्रीय TCP/UDP traffic बाँटता है। Application Gateway क्षेत्रीय HTTP routing के लिए है और उपयुक्त tier में WAF मिल सकता है। Front Door वैश्विक HTTP प्रवेश बिंदु और edge routing दे सकता है।\nचुनाव protocol और geographic scope के आधार पर करें। Reverse proxy client की request backend तक भेजता है। Proxy लगाने से origin का सीधा access अपने आप सुरक्षित नहीं होता; उसकी सुरक्षा अलग तय करनी पड़ती है।"}, {"id": "lesson-15", "title": "Azure SQL Database and the free offer", "group": "05 · Data and storage", "en": "Azure SQL Database is a managed relational database. A logical SQL server groups databases and provides settings such as the server name and network access. It is not the same as renting a SQL Server VM. Tables store rows, while your API executes queries and returns only the required data.\nThe free offer has compute and storage limits. Its exact offer version and settings matter. When free compute is exhausted, a database configured to stop rather than bill can pause until the allowance resets. Storage size and compute usage are different limits.", "hi": "Azure SQL Database managed relational database hai. Logical SQL server databases ko group karta hai aur server name/network settings deta hai. Ye SQL Server wali VM nahi hai. API query chalakar required records leti hai.\nFree offer ki compute aur storage limits hoti hain. Agar extra billing disabled hai, free compute khatam hone par DB pause ho sakta hai. Database chhota hone ka matlab compute quota bacha hai, aisa nahi.", "example": "Your earlier DB showed 25 MB stored but zero free vCore seconds. / Data kam tha, phir bhi compute allowance khatam tha.", "steps": [["Open SQL databases", "Search SQL databases → Create, or Azure SQL → the available free-offer entry. / Free offer ka actual option dekho."], ["Choose database and logical server", "Select group, database name and a new or existing logical server. / Server aur DB alag names hain."], ["Inspect Compute + storage", "Apply the intended free offer if available. Read compute, storage and free-limit behavior. / Free limit ke baad pause ya billing kya hoga padho."], ["Configure access", "Choose supported authentication and limited network access for the API/developer. / Browser mein connection string mat rakho."], ["Review and verify", "Create after cost review. In Overview inspect Pricing tier, Status, free amount and overage setting. / Overview par actual configuration dekho."]], "verify": ["Pricing tier explicitly reflects the intended offer.", "Overage behavior matches your choice.", "A permitted test client can query the database."], "fix": "Paused due to exhausted free amount is different from an incorrect password. Do not enable additional charges just to remove the message without deciding cost. / Error ka exact reason padho.", "cost": "Free limits and offer versions differ. Use the values displayed in your DB rather than assuming every subscription has the same allowance. / Current offer hi authoritative hai.", "flow": ["API", "SQL logical server endpoint", "Database", "Rows"], "source": "https://learn.microsoft.com/azure/azure-sql/database/free-offer", "hindi": "Azure SQL Database प्रबंधित relational database है। Logical SQL server डेटाबेसों का समूह, connection endpoint और कुछ साझा access settings देता है। यह SQL Server वाली अलग VM किराए पर लेने जैसा नहीं है। API query चलाकर आवश्यक rows वापस देती है।\nFree offer की compute और storage सीमाएँ अलग होती हैं। चुने हुए offer और overage behavior को देखें। Free compute समाप्त होने पर, अतिरिक्त बिलिंग बंद रखने वाला डेटाबेस allowance reset होने तक pause हो सकता है। कम डेटा होने का अर्थ compute quota बचना नहीं है।"}, {"id": "lesson-16", "title": "SQL connections, pooling and Redis", "group": "05 · Data and storage", "en": "A database connection is a communication session. ADO.NET pooling reuses suitable connections after application code closes or disposes them. Opening a connection often borrows one from the pool; it does not always create a new physical connection. Use connections briefly and release them reliably.\nRedis caches selected data in memory. It does not automatically put a terabyte database into a smaller RAM server. Cache popular results, choose an expiry and design how stale data is refreshed. Cache capacity, eviction and database capacity must be considered separately.", "hi": "DB connection communication session hai. ADO.NET connection pooling suitable connection ko reuse karta hai. Code mein Open karne par pool se existing connection mil sakta hai. Kaam hone ke baad Close/Dispose karna zaroori hai, taaki connection pool ko wapas mile.\nRedis memory mein selected data cache karta hai. 32 GB RAM mein 1 TB ka pura data automatically nahi aa jayega. Popular district results cache karo, expiry set karo aur refresh ka rule banao.", "example": "For 55 districts, cache frequently requested summaries rather than loading every raw row. / Required summary cache karo, pura DB nahi.", "steps": [["Inspect the application first", "Find connection creation/disposal and the exact connection-string identity. / Code mein using/Dispose dekho."], ["Measure the bottleneck", "Inspect query duration, active sessions, timeouts and app concurrency. / Pool size guess mat karo."], ["Inspect cache creation options", "Search Azure Managed Redis and read region, tier, networking and price. / Current managed Redis offering dekho."], ["Implement cache-aside in code", "Read cache first; on miss query SQL, cache the result with expiry, then respond. / Miss par DB query aur expiry ke saath cache."], ["Verify behavior", "Test a cold request, warm request and changed data. / Fast ke saath stale data bhi test karo."]], "verify": ["Connections are released after each operation.", "Repeated cached reads reduce SQL work.", "Stale data has an explicit refresh policy."], "fix": "Pool exhaustion can be leaked connections or slow queries. More pool slots can overload SQL rather than fix it. / Pehle reason measure karo.", "cost": "Managed cache is a separate resource with its own cost. Cache misses still use database compute. / Redis add karna free optimization nahi.", "flow": ["API", "Cache hit or miss", "SQL on miss", "Cache with expiry"], "source": "https://learn.microsoft.com/dotnet/framework/data/adonet/sql-server-connection-pooling", "hindi": "Database connection संचार का session है। ADO.NET pooling उपयुक्त connections का दोबारा उपयोग करता है। Open करने पर pool से connection मिल सकता है। Close या Dispose करने पर वह सामान्यतः pool में वापस जाता है। Connections थोड़े समय के लिए रखें और भरोसेमंद ढंग से छोड़ें।\nRedis चुनिंदा डेटा memory में cache करता है। वह 1 TB का पूरा डेटाबेस छोटी RAM में अपने आप नहीं रख सकता। लोकप्रिय परिणाम चुनें, expiry और refresh तय करें। Cache capacity, eviction तथा डेटाबेस की क्षमता अलग-अलग देखें।"}, {"id": "lesson-17", "title": "Storage accounts, Blob and Files", "group": "05 · Data and storage", "en": "A storage account is the management and security boundary for Azure Storage data services. Blob Storage stores objects such as images, PDFs and exports in containers. Azure Files provides managed file shares. A blob container is unrelated to a Docker container.\nChoose access permissions, redundancy and retention deliberately. A private blob is not accessible to everyone just because it has a URL. Applications can use managed identity or scoped temporary access when required.", "hi": "Storage account Azure Storage ka management container hai. Blob mein PDF, images aur exports jaise objects rakhte hain. Azure Files file shares deta hai. Blob container aur Docker container alag concepts hain.\nPermissions aur redundancy sochkar set karo. File ka URL hone se private file public nahi hoti. App identity ya limited temporary access se file mil sakti hai.", "example": "SQL stores an employee record; Blob stores that employee’s uploaded PDF. / SQL mein metadata aur Blob mein actual document.", "steps": [["Create an account", "Search Storage accounts → Create, choose lab group, unique name and region. / Storage account banao."], ["Choose protection and redundancy", "Review redundancy, public access, network and recovery settings. / Default settings samjho."], ["Create a blob container", "Open Data storage → Containers → add a private container named documents. / Private container banao."], ["Upload a harmless sample", "Upload a non-sensitive test file through the portal. / Sample file upload karo."], ["Test access", "Confirm anonymous access is blocked and authorized download works. / Private access verify karo."]], "verify": ["The sample blob appears in the intended container.", "Anonymous access behaves as configured.", "Recovery settings are understood."], "fix": "403 may mean missing data-plane role, expired SAS or blocked networking. A management role alone may not grant blob data access. / Data role alag ho sakta hai.", "cost": "Stored bytes, operations, redundancy and outbound transfers can be charged. Soft-deleted data may still consume storage. / Sirf upload size nahi, operations bhi matter karte hain.", "flow": ["API", "Storage account", "Private blob container", "PDF object"], "source": "https://learn.microsoft.com/azure/storage/blobs/storage-blobs-introduction", "hindi": "Storage account, Azure Storage की सेवाओं के प्रबंधन और सुरक्षा का दायरा है। Blob Storage में images, PDF और exports जैसे objects रहते हैं। Azure Files प्रबंधित file shares देता है। Blob container और Docker container अलग अवधारणाएँ हैं।\nPermissions, redundancy और retention सोचकर चुनें। किसी private blob का URL होने से सबको access नहीं मिल जाता। App managed identity या उचित सीमित access से फ़ाइल ले सकती है।"}, {"id": "lesson-18", "title": "Cosmos DB: document data", "group": "05 · Data and storage", "en": "Cosmos DB is a managed distributed database family. For a document workload, data is organized into databases, containers and items. A partition key distributes data and strongly affects performance and cost. It is not simply a faster replacement for every relational database.\nSelect an API and capacity model that match the application. Relational transactions and joins may be easier in SQL, while flexible document access patterns may fit Cosmos DB. Start from queries and consistency needs.", "hi": "Cosmos DB managed distributed database hai. Document use case mein database, container aur items hote hain. Partition key data distribution decide karti hai aur performance/cost par impact karti hai.\nHar SQL database ko Cosmos se replace karna zaroori nahi. Pehle queries, relationships aur consistency ki requirement samjho.", "example": "A district document can contain a flexible summary, but the partition key must match access patterns. / Partition sirf random field choose mat karo.", "steps": [["Inspect account types", "Search Azure Cosmos DB → Create and choose the intended API. / API choice padho."], ["Select capacity deliberately", "Read provisioned/serverless and free-tier eligibility before submission. / Capacity cost check karo."], ["Create a test container", "In Data Explorer create a database and container with a planned partition key. / Partition key plan karo."], ["Insert and query a sample", "Use harmless sample JSON, run a query and inspect request consumption. / Query cost dekho."]], "verify": ["The sample query returns expected items.", "The partition key and capacity model are understood."], "fix": "Cross-partition queries or a hot key can create uneven load. / Query pattern aur key distribution check karo.", "cost": "Free-tier eligibility and capacity settings are account-specific. Do not assume the default is free. / Default option check karo.", "flow": ["Application", "Partition key", "Container", "JSON item"], "source": "https://learn.microsoft.com/azure/cosmos-db/introduction", "hindi": "Cosmos DB प्रबंधित distributed database परिवार है। Document workload में database, container और items होते हैं। Partition key डेटा का वितरण तय करती है और performance तथा cost पर बड़ा असर डालती है। यह हर relational database का अपने आप बेहतर विकल्प नहीं है।\nपहले queries, relationships और consistency की ज़रूरत समझें। SQL में relational transactions और joins अधिक स्वाभाविक हो सकते हैं; document access pattern Cosmos DB के लिए उचित हो सकता है। क्षमता और API मॉडल आवश्यकता के अनुसार चुनें।"}, {"id": "lesson-19", "title": "Entra ID, RBAC and managed identity", "group": "06 · Identity and security", "en": "Authentication answers who you are. Authorization answers what you may do. Microsoft Entra ID provides identities and sign-in. Azure RBAC grants roles at scopes such as subscription, resource group or resource. Choose the smallest suitable scope and role.\nA managed identity lets an Azure workload obtain tokens without storing its own password. Enabling the identity does not automatically grant access to SQL, Key Vault or Storage. The destination must authorize the identity using the relevant permission model.", "hi": "Authentication batata hai aap kaun ho. Authorization batata hai aap kya kar sakte ho. Entra ID identity/sign-in deta hai. RBAC role aur scope ke hisaab se Azure actions allow karta hai.\nManaged identity se app token le sakti hai bina apna password store kiye. Identity enable karne se SQL ya Storage access automatically nahi milta. Target service par permission deni hoti hai.", "example": "API identity can read one vault secret without making the API owner of the whole subscription. / Minimum required access do.", "steps": [["Read existing access", "Open a resource → Access control (IAM) → View my access. / Apna role dekho."], ["Enable an app identity when required", "Web App → Identity → inspect system-assigned or user-assigned choices. / Identity type samjho."], ["Plan a role assignment", "On the target resource choose the narrow data/action role and the exact identity. / Scope aur principal verify karo."], ["Apply only intended access", "Review the role assignment before saving, then test using the workload identity. / Access change carefully review karo."]], "verify": ["The identity is the intended principal.", "Allowed actions succeed and unrelated actions remain denied."], "fix": "A Contributor management role is not automatically SQL database authorization or all Storage data permissions. / Management aur data access alag ho sakte hain.", "cost": "Identity features and licensed Entra capabilities differ. No universal free licensing assumption is made. / Feature licensing check karo.", "flow": ["Identity", "Authentication token", "Target permission", "Allowed action"], "source": "https://learn.microsoft.com/azure/role-based-access-control/overview", "hindi": "Authentication पहचान प्रमाणित करता है: आप कौन हैं। Authorization तय करता है: आप क्या कर सकते हैं। Microsoft Entra ID पहचान और sign-in देता है। Azure RBAC subscription, resource group या resource जैसे दायरे पर roles देता है। न्यूनतम उपयुक्त role और scope चुनें।\nManaged identity, Azure workload की प्रबंधित पहचान है। उससे app अपना password रखे बिना token ले सकती है। Identity चालू करने से SQL, Key Vault या Storage का access अपने आप नहीं मिलता। लक्ष्य सेवा को अलग अनुमति देनी होती है।"}, {"id": "lesson-20", "title": "Key Vault and application settings", "group": "06 · Identity and security", "en": "Key Vault stores secrets, keys and certificates. Application settings supply runtime configuration. Keep database credentials and API keys out of frontend JavaScript and source control. Browser-delivered code can be inspected by users.\nA Key Vault reference is a way for a supported app setting to refer to a secret, but the application identity still needs access and network connectivity. Secret rotation must be tested so applications continue to work.", "hi": "Key Vault secrets, keys aur certificates rakhta hai. Application settings runtime configuration deti hain. DB password ya API key frontend JavaScript aur Git repository mein mat rakho. Browser ka code user dekh sakta hai.\nKey Vault reference secret ka address hota hai. App identity ko secret read permission aur network access phir bhi chahiye. Rotation ke baad app test karo.", "example": "API uses a secret-backed DB connection; React only has the API base URL. / Frontend mein DB password nahi.", "steps": [["Create or inspect a vault", "Search Key vaults, review access model, region and recovery settings. / Vault ka access model padho."], ["Add a test secret", "Use a harmless placeholder secret for the lab; do not paste production credentials into notes. / Sample secret use karo."], ["Authorize the workload", "Give the intended identity the required secret-read permission at a narrow scope. / Exact identity select karo."], ["Configure the app", "Set the supported Key Vault reference or identity-based connection configuration. / App configuration set karo."], ["Restart or refresh if required", "Check reference resolution and app logs without printing secret values. / Secret value logs mein mat dikhao."]], "verify": ["The app resolves the secret without exposing its value.", "The browser bundle contains no server credentials."], "fix": "Failed resolution can be permission, DNS, firewall, wrong URI or identity selection. / Har error password error nahi.", "cost": "Vault operations and related protection features may be billed. / Usage aur selected features ka cost check karo.", "flow": ["App identity", "Key Vault authorization", "Secret reference", "Runtime configuration"], "source": "https://learn.microsoft.com/azure/key-vault/general/overview", "hindi": "Key Vault secrets, cryptographic keys और certificates रखता है। Application settings runtime configuration देती हैं। Database credentials और API keys को frontend JavaScript या source control में न रखें। Browser तक पहुँचा code उपयोगकर्ता देख सकता है।\nKey Vault reference किसी secret की ओर संकेत कर सकता है, लेकिन app identity को उसे पढ़ने की अनुमति और network connectivity फिर भी चाहिए। Secret rotation के बाद application काम कर रही है या नहीं, यह जाँचना आवश्यक है।"}, {"id": "lesson-21", "title": "GitHub deployment and OIDC", "group": "07 · Deploy and troubleshoot", "en": "A deployment workflow checks out source, builds it and publishes output to a hosting service. GitHub-to-Azure OIDC uses a short-lived token and a matching federated identity configuration. Repository, branch or environment identity must match the trust settings.\nAn artifact is stored build output, not the source repository itself. Artifact storage quota failures occur during upload and do not prove the application code failed to compile. Login failures are another separate stage. Read the first failing step rather than changing unrelated settings.", "hi": "Deployment workflow source leta hai, build karta hai aur hosting par publish karta hai. OIDC short-lived token se GitHub ko Azure login deta hai. Repo, branch ya environment ka trust configuration match hona chahiye.\nArtifact stored build output hai. Artifact storage full ho to upload fail hota hai; iska matlab code compile error nahi. Login failure alag stage hai. Sabse pehla failed step dekho.", "example": "Frontend Node build → Azure login → deploy to frontend Web App. API uses its own runtime and target. / Dono targets mix mat karo.", "steps": [["Open Deployment Center", "Open the intended Web App → Deployment Center. / Pehle correct frontend/API app verify karo."], ["Choose source", "Select GitHub, organization, repository and deployment branch. / Correct repository aur branch select karo."], ["Inspect authentication", "For identity-based authentication review the exact user-assigned identity and federated trust. / New identity ka scope samjho."], ["Review workflow", "Preview build/runtime and deployment target. Save only after understanding the access grant. / Workflow aur permissions review karo."], ["Read the newest run", "In GitHub Actions open the run for the new commit and inspect each stage. / Purana run nahi, current commit dekho."]], "verify": ["The newest workflow uses the intended repository and branch.", "Azure login succeeds.", "Deployment target is correct and the app serves the new version."], "fix": "For OIDC failure compare tenant/client/subscription IDs, federated subject and token audience; ensure workflow id-token permission. For quota failure remove unneeded artifacts and allow usage recalculation. / Error stage ke hisaab se fix karo.", "cost": "GitHub build/storage and Azure hosting have separate limits. Artifact retention does not make a paid Azure plan free. / Dono ka billing alag hai.", "flow": ["Git commit", "Build", "Authenticate", "Deploy"], "source": "https://learn.microsoft.com/azure/app-service/deploy-github-actions", "hindi": "Deployment workflow source code लेता है, build बनाता है और output hosting service पर प्रकाशित करता है। GitHub-to-Azure OIDC में अल्पकालिक token और सही federated trust configuration का उपयोग हो सकता है। Repository, branch या environment की पहचान trust से मेल खानी चाहिए।\nArtifact build का stored output है, source repository नहीं। Artifact storage quota error upload stage का failure है; उससे compile error सिद्ध नहीं होता। Login failure अलग stage है। सबसे पहले failed step पढ़ें और उसी स्तर का कारण खोजें।"}, {"id": "lesson-22", "title": "Monitoring: metrics, logs and alerts", "group": "07 · Deploy and troubleshoot", "en": "A metric is a numeric measurement over time, such as CPU percentage. A log is a detailed event record. Application Insights observes application requests, exceptions and dependencies. Activity log records Azure management operations such as changing a resource.\nBegin with the user symptom and time range. Check failed requests and slow dependencies before increasing resources. An alert evaluates a condition and triggers an action group; an alert alone does not fix the application.", "hi": "Metric time ke saath number hai, jaise CPU %. Log detailed event record hai. Application Insights request, exception aur dependency dekhta hai. Activity log Azure resource ke management changes dikhata hai.\nPehle user ka issue aur time range lo. Phir failed requests aur slow SQL calls dekho. Alert condition detect karta hai; app ko khud fix nahi karta.", "example": "An API can be slow with low CPU because it is waiting on SQL. / Low CPU ka matlab app healthy hona zaroori nahi.", "steps": [["Open Metrics", "Select the resource → Monitoring → Metrics and a meaningful time range. / Sahi time range lo."], ["Choose a measurement", "Pick CPU, requests, errors or a service-specific metric and proper aggregation. / Average aur Max ka difference samjho."], ["Inspect logs", "Open Log stream, Application Insights or Logs according to the resource and diagnostic setup. / Available telemetry dekho."], ["Create a targeted alert", "Choose scope, signal, threshold and action group; review evaluation and notification settings. / Useful alert banao."], ["Trigger a controlled test", "Use a safe test condition and confirm notification delivery. / Alert delivery test karo."]], "verify": ["Metrics cover the incident time.", "A request can be connected to its error or dependency.", "The test alert reaches the expected destination."], "fix": "No logs may mean diagnostics were not enabled or the selected workspace/time range is wrong. / Empty logs ka matlab no errors nahi.", "cost": "Log ingestion, retention, tests and alerts can have separate charges. / Monitoring bhi unlimited free nahi.", "flow": ["Application request", "Metric and trace", "Investigation", "Alert action"], "source": "https://learn.microsoft.com/azure/azure-monitor/overview", "hindi": "Metric समय के साथ संख्या है, जैसे CPU प्रतिशत। Log किसी घटना का विस्तृत record है। Application Insights requests, exceptions और dependencies देख सकता है। Activity log, Azure संसाधनों पर हुए management operations दर्ज करता है।\nसमस्या और उसका समय पहले तय करें। अधिक resources जोड़ने से पहले failed requests और धीमी dependencies देखें। Alert condition पहचानकर action group चला सकता है; केवल alert बनाना app को अपने आप ठीक करना नहीं है।"}, {"id": "lesson-23", "title": "Queues, events and messaging", "group": "08 · Build reliable systems", "en": "A queue decouples work: the API records a message and a worker handles it later. Service Bus supports application messaging patterns. Event Grid routes notifications that something happened. Event Hubs ingests streams of events for consumers. These services are not interchangeable.\nDesign retries and duplicate handling. A worker may receive a message again after a failure, so processing should be idempotent when possible. Use dead-letter handling for messages that repeatedly fail.", "hi": "Queue se API aur background work alag ho jate hain. API message rakhti hai, worker baad mein process karta hai. Service Bus application messages ke liye, Event Grid event notifications ke liye aur Event Hubs event streams ke liye use hota hai.\nRetry aur duplicate handling plan karo. Same message dobara aa sakta hai, isliye same payment/report do baar create na ho. Repeated failure ko dead-letter mein investigate karo.", "example": "Leave request accepted → queue message → worker sends notification. / User ko long email process ka wait nahi.", "steps": [["Choose the right service", "Command/job → queue; event notification → Event Grid; telemetry stream → Event Hubs. / Requirement match karo."], ["Create an isolated test namespace", "Review tier, capacity and networking before creating. / Paid tier check karo."], ["Create the entity", "For Service Bus, create a test queue and review lock, TTL and dead-letter options. / Queue settings padho."], ["Send a sample", "Use a supported portal explorer or SDK to send non-sensitive test data. / Sample message bhejo."], ["Receive and complete", "Receive in the worker, process, complete on success and inspect failures. / Success ke baad acknowledge karo."]], "verify": ["The message is received and completed once for the test.", "A failed message has an observable retry/dead-letter path."], "fix": "A message disappearing from the active queue may be received, expired or dead-lettered. / Active count akela full picture nahi.", "cost": "Namespace tier, operations and capacity can be billed. / Queues ka pricing model padho.", "flow": ["API producer", "Queue", "Worker", "Completed job"], "source": "https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messaging-overview", "hindi": "Queue, API और background काम को अलग करती है। API message रखती है और worker बाद में उसे process करता है। Service Bus application messaging, Event Grid घटनाओं की सूचना और Event Hubs बड़े event streams के लिए उपयोगी हैं। ये एक-दूसरे के पूर्ण विकल्प नहीं हैं।\nRetry और duplicate handling की योजना बनाएँ। Failure के बाद वही message फिर मिल सकता है, इसलिए processing जहाँ संभव हो idempotent रखें। बार-बार fail होने वाले messages को dead-letter handling से जाँचें।"}, {"id": "lesson-24", "title": "Backup and disaster recovery", "group": "08 · Build reliable systems", "en": "A backup preserves recoverable versions. High availability keeps service operating through some failures. Disaster recovery restores service after a major disruption. Replication copies changes, including some accidental or unwanted changes, so it is not a universal substitute for backup.\nDefine RPO as the acceptable data-loss window and RTO as the acceptable recovery time. A backup is only useful when a restore can be performed and tested. Retention and recovery permissions matter as much as the schedule.", "hi": "Backup recoverable versions rakhta hai. High availability kuch failures ke dauran service chalaye rakhti hai. Disaster recovery bade disruption ke baad service wapas lana hai. Replication galat changes bhi copy kar sakta hai, isliye backup ka full replacement nahi.\nRPO batata hai kitna recent data loss acceptable hai. RTO batata hai kitne time mein service wapas chahiye. Backup ka restore test karna zaroori hai.", "example": "An HRMS needs a tested restore point before a destructive migration. / Backup exists aur restore works alag claims hain.", "steps": [["Identify data and recovery goals", "List database, uploads and configuration; decide RPO/RTO. / Sirf DB nahi, files bhi dekho."], ["Open the service recovery blade", "SQL → Backups/Restore; VM backup → vault or Backup center workflow. / Resource-specific recovery kholo."], ["Read retention and protection", "Inspect policy, restore points, redundancy and deletion protection. / Retention samjho."], ["Perform a non-production restore", "Restore to a separate test target and validate data and connectivity. / Production overwrite mat karo."], ["Clean up the test target", "Remove disposable restore resources after validation and cost review. / Test restore ka cost bhi dekho."]], "verify": ["A separate restore target opens successfully.", "Application data is verified against the recovery goal."], "fix": "A successful backup job is not evidence that application-level restore is complete. / Data aur app test karo.", "cost": "Backup retention, replicated storage and restored targets may incur charges. / Restore ke baad target bhool mat jana.", "flow": ["Production data", "Recovery point", "Separate restore", "Validation"], "source": "https://learn.microsoft.com/azure/backup/backup-overview", "hindi": "Backup डेटा के recoverable versions रखता है। High availability कुछ failures के दौरान सेवा चालू रखने की व्यवस्था है। Disaster recovery बड़े व्यवधान के बाद सेवा लौटाने की प्रक्रिया है। Replication गलत बदलाव भी कॉपी कर सकता है, इसलिए वह backup का सार्वभौमिक विकल्प नहीं है।\nRPO स्वीकार्य डेटा-हानि की अवधि है। RTO सेवा वापस लाने का स्वीकार्य समय है। Backup के साथ restore test भी आवश्यक है। Retention और recovery permissions भी schedule जितनी महत्वपूर्ण हैं।"}, {"id": "lesson-25", "title": "Policy, locks, tags and Advisor", "group": "08 · Build reliable systems", "en": "Tags label resources for ownership and cost reporting. Azure Policy evaluates or enforces organizational rules. A resource lock can protect against deletion or changes at its scope. Advisor provides recommendations; it does not know every application requirement.\nRBAC controls who may act, while Policy constrains what configurations are allowed. A lock is not a backup. Use these tools together rather than expecting one to solve identity, recovery and cost management.", "hi": "Tags resources ko owner/project labels dete hain. Policy rules evaluate ya enforce karti hai. Lock deletion ya changes ko rok sakta hai. Advisor recommendations deta hai, lekin app ki har requirement nahi janta.\nRBAC batata hai kaun action kar sakta hai. Policy batati hai allowed configuration kya hai. Lock backup nahi hai. Inka purpose alag hai.", "example": "Add project=hrms and environment=dev tags, then inspect cost by tag. / Tags reporting ko easy banate hain.", "steps": [["Add a harmless tag", "Open the lab group → Tags and set project=handbook. / Lab ko label karo."], ["Inspect Policy", "Search Policy → Compliance and read an existing assignment. / Existing rule samjho."], ["Review a lock", "Open lab resource Locks; understand scope and effect before applying. / Delete/read-only difference dekho."], ["Read Advisor", "Open Advisor and assess cost/security/reliability suggestions before accepting. / Recommendation blindly apply mat karo."]], "verify": ["Tags appear on the intended scope.", "You can distinguish Policy, RBAC and locks."], "fix": "An unexpected deny can come from inherited Policy or a lock even when RBAC allows the action. / Error details padho.", "cost": "Recommendations can change availability or capacity. Check impact before downsizing. / Cost bachane mein reliability mat tod do.", "flow": ["Identity role", "Policy rule", "Resource configuration", "Compliance"], "source": "https://learn.microsoft.com/azure/governance/policy/overview", "hindi": "Tags resources पर ownership और project labels देते हैं। Azure Policy संगठन के नियम जाँचती या लागू करती है। Resource lock अपने दायरे में deletion या changes रोक सकता है। Advisor सुझाव देता है, लेकिन उसे आपकी हर application requirement का ज्ञान नहीं है।\nRBAC बताता है कौन action कर सकता है। Policy बताती है कौन-सी configuration स्वीकार्य है। Lock backup नहीं है। पहचान, recovery और cost management की अलग आवश्यकताओं के लिए इनका सही संयोजन करें।"}, {"id": "lesson-26", "title": "AI, analytics, IoT and hybrid: choose by task", "group": "09 · Beyond the basics", "en": "AI services help with tasks such as language, vision and model-based answers. Search retrieves relevant information; a generative model creates an answer from instructions and context. Analytics tools transform and query larger datasets for reporting. IoT services connect device telemetry. Hybrid tools extend management to resources outside Azure.\nStart with a concrete problem rather than a service list. A 55-district dashboard may first need clean SQL queries, aggregates and caching, not a large data platform or an AI agent. Choose advanced services only when the simpler design no longer fits.", "hi": "AI services language, images aur model-based answers ke kaam aati hain. Search relevant information nikalta hai; model answer banata hai. Analytics large data ko transform/query karta hai. IoT device telemetry ke liye aur hybrid tools Azure ke bahar resources manage karne ke liye hote hain.\nPehle actual problem likho. 55 district dashboard ko shayad clean SQL queries aur caching chahiye, turant giant analytics platform nahi. Requirement ho tab advanced service add karo.", "example": "HR assistant: authorized documents → retrieval → model response with references. / Model ko unrestricted private files mat do.", "steps": [["State the task", "Write input, expected output, users and acceptable latency. / Problem clear karo."], ["Choose a service family", "Search AI, analytics, IoT or Azure Arc depending on the task. / Family choose karo."], ["Inspect prerequisites", "Read region, quota, data access, licensing and deployment options. / Dependencies samjho."], ["Build a small proof of concept", "Use non-sensitive sample data and measure accuracy/cost before production. / Small POC test karo."]], "verify": ["The service solves the stated task.", "Access, accuracy and cost are measured with a small sample."], "fix": "An AI answer is not automatically correct. A dashboard platform cannot repair incorrect source data on its own. / Output aur data dono validate karo.", "cost": "Model tokens, search capacity, analytics compute and ingestion have different pricing meters. / One price model sab par apply nahi.", "flow": ["Business problem", "Suitable service", "Small test", "Measured result"], "source": "https://learn.microsoft.com/azure/architecture/guide/", "hindi": "AI services भाषा, images और model-based उत्तरों जैसे कार्यों में मदद करती हैं। Search प्रासंगिक जानकारी खोजता है; generative model निर्देशों और context से उत्तर बनाता है। Analytics डेटा बदलने और reporting के लिए query करने में उपयोगी है। IoT device telemetry और hybrid tools, Azure के बाहर के resources के प्रबंधन में काम आते हैं।\nपहले वास्तविक समस्या लिखें। 55 जिलों के dashboard को शायद सही SQL queries, aggregates और caching चाहिए; तुरंत बड़ा data platform या AI agent नहीं। सरल डिज़ाइन अपर्याप्त होने पर ही अतिरिक्त सेवाएँ चुनें।"}, {"id": "lesson-27", "title": "End-to-end HRMS lab and migration checklist", "group": "10 · Put it together", "en": "Build the simplest working chain: browser → frontend → API → database. The frontend knows the API URL; the API owns database access. Keep server credentials on the server. Treat hosting, deployment identity, database connectivity and application behavior as separate checks.\nFor a Container Apps to Web App migration, deploy a compatible code build to a suitable new Web App, copy required configuration securely, test the new endpoint and update the frontend API URL. Stop the old execution only after validation. A container image is not the same as a ready code-deployment package.", "hi": "Simple chain banao: browser → frontend → API → database. Frontend API URL janta hai; DB access API ka kaam hai. Server credentials backend par rahenge. Hosting, login, DB connectivity aur app behavior ko alag check karo.\nContainer se Web App shift karne ke liye compatible code build deploy karo, configuration securely set karo, naya endpoint test karo aur frontend API URL update karo. Successful test ke baad old execution stop karo. Sirf image ka naam copy karna migration nahi hai.", "example": "React calls /employees on the API; API runs a parameterized SQL query and returns JSON. / Browser SQL password nahi dekhta.", "steps": [["Inventory the source", "Record runtime, image/build version, environment variable names, port, CORS origins, jobs and storage mounts. / Source config list karo, secret values notes mein nahi."], ["Prepare a target", "Create a compatible code Web App on a deliberate plan; do not overwrite the existing frontend. / Separate API target banao."], ["Deploy and configure", "Publish API code/build, set server-side configuration and required identity/network permissions. / Runtime aur secrets sahi set karo."], ["Test without switching", "Check health endpoint, representative read/write behavior and logs. A paused SQL DB blocks data tests. / DB paused ho to test incomplete hai."], ["Update frontend", "Change the API base URL and allowed CORS origin, rebuild/redeploy if required. / Frontend ki build-time config check karo."], ["Validate and retire old execution", "Confirm user flows, keep a rollback path, then stop the old app; inspect environment and registry cost separately. / Old dependencies blindly delete mat karo."]], "verify": ["Frontend uses the new API URL.", "API can reach SQL securely.", "A real user flow works.", "Old compute is stopped only after successful testing.", "Cost analysis later confirms reduced usage."], "fix": "If health works but data fails, inspect SQL state/network/auth. If browser fails but direct API works, inspect CORS and frontend base URL. / Error layer identify karo.", "cost": "A free target must actually show the intended free tier. Existing paid plans, container environments and registries remain separate until addressed. / Migration ka matlab all charges automatically zero nahi.", "flow": ["Browser", "React frontend", ".NET API", "SQL Database"], "source": "https://learn.microsoft.com/azure/architecture/web-apps/", "hindi": "सबसे सरल कार्यशील क्रम बनाएँ: browser → frontend → API → database। Frontend को API URL पता होता है; डेटाबेस से जुड़ने का अधिकार API के पास रहता है। Server credentials backend पर रखें। Hosting, deployment identity, database connectivity और application behavior अलग-अलग जाँचें।\nContainer Apps से Web App में जाने के लिए उपयुक्त code build नए Web App पर deploy करें। आवश्यक configuration सुरक्षित रूप से लगाएँ, नया endpoint और वास्तविक user flows test करें, फिर frontend का API URL बदलें। पुराने execution को सफल जाँच के बाद ही रोकें। Container image और code deployment package एक ही चीज़ नहीं हैं।"}]</script><script id="catalogdata" type="application/json">[{"id": "availability-sets", "name": "Availability sets", "category": "Compute & virtual machines", "description": "VMs ko alag fault aur update domains mein distribute karne ki grouping; physical proximity guarantee nahi.", "example": "Do API VMs ko ek hardware failure se dono down hone ka risk kam karna.", "status": "", "core": false}, {"id": "compute-fleet", "name": "Compute Fleet", "category": "Compute & virtual machines", "description": "Multiple VM types aur purchasing options se capacity orchestrate karna.", "example": "Batch processing ke liye available

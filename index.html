n time aur dependencies pehle samjho.", "purpose": "", "working": "", "example": "An uploaded attendance file triggers validation and a queue message. / File aayi to validation chale.", "portal": "", "mistake": "A function with no invocations may have a disabled trigger, wrong queue/storage or incorrect endpoint. / Trigger aur binding config dekho.", "related": [], "chapter": 6, "diagramContext": true}, {"id": "diagram-7-342", "name": "User", "aliases": ["User"], "en": "A VM is a rented computer with an operating system. You choose CPU, memory, disks and networking, then maintain the OS and installed applications. Compared with App Service, it offers more control and more operational responsibility.\nStopping inside Windows is different from deallocating the VM in Azure. Deallocation normally releases compute allocation, but disks and other attached services can still cost money.", "hi": "VM cloud mein rented computer hai. CPU, RAM, disk aur OS choose karte ho. Software install karna, patching aur OS maintenance aapki responsibility hoti hai.\nWindows ke andar shutdown aur Azure mein deallocate alag hain. Deallocate se compute charge ruk sakta hai, lekin disk aur dusre resources ka charge reh sakta hai.", "purpose": "", "working": "", "example": "An older application requiring custom IIS modules may need a Windows VM. / Extra OS control ki zaroorat ho to VM.", "portal": "", "mistake": "Connection failure: check VM status, NSG source/port, route and OS firewall. / Sirf NSG nahi, OS firewall bhi dekho.", "related": [], "chapter": 7, "diagramContext": true}, {"id": "diagram-7-343", "name": "Network rules", "aliases": ["Network rules"], "en": "A VM is a rented computer with an operating system. You choose CPU, memory, disks and networking, then maintain the OS and installed applications. Compared with App Service, it offers more control and more operational responsibility.\nStopping inside Windows is different from deallocating the VM in Azure. Deallocation normally releases compute allocation, but disks and other attached services can still cost money.", "hi": "VM cloud mein rented computer hai. CPU, RAM, disk aur OS choose karte ho. Software install karna, patching aur OS maintenance aapki responsibility hoti hai.\nWindows ke andar shutdown aur Azure mein deallocate alag hain. Deallocate se compute charge ruk sakta hai, lekin disk aur dusre resources ka charge reh sakta hai.", "purpose": "", "working": "", "example": "An older application requiring custom IIS modules may need a Windows VM. / Extra OS control ki zaroorat ho to VM.", "portal": "", "mistake": "Connection failure: check VM status, NSG source/port, route and OS firewall. / Sirf NSG nahi, OS firewall bhi dekho.", "related": [], "chapter": 7, "diagramContext": true}, {"id": "diagram-7-344", "name": "VM operating system", "aliases": ["VM operating system"], "en": "A VM is a rented computer with an operating system. You choose CPU, memory, disks and networking, then maintain the OS and installed applications. Compared with App Service, it offers more control and more operational responsibility.\nStopping inside Windows is different from deallocating the VM in Azure. Deallocation normally releases compute allocation, but disks and other attached services can still cost money.", "hi": "VM cloud mein rented computer hai. CPU, RAM, disk aur OS choose karte ho. Software install karna, patching aur OS maintenance aapki responsibility hoti hai.\nWindows ke andar shutdown aur Azure mein deallocate alag hain. Deallocate se compute charge ruk sakta hai, lekin disk aur dusre resources ka charge reh sakta hai.", "purpose": "", "working": "", "example": "An older application requiring custom IIS modules may need a Windows VM. / Extra OS control ki zaroorat ho to VM.", "portal": "", "mistake": "Connection failure: check VM status, NSG source/port, route and OS firewall. / Sirf NSG nahi, OS firewall bhi dekho.", "related": [], "chapter": 7, "diagramContext": true}, {"id": "diagram-8-345", "name": "Users", "aliases": ["Users"], "en": "Scale up means giving an instance more capacity. Scale out means adding instances. A load balancer distributes traffic across healthy backends; an autoscaling controller decides when to add or remove capacity according to supported rules. These are separate jobs.\nAdding instances works only when the application supports it. Shared state, session storage, database capacity and connection pools can become bottlenecks. A bigger pool does not make the database infinitely fast.", "hi": "Scale up mein ek instance ko zyada CPU/RAM dete hain. Scale out mein instances ki count badhti hai. Load balancer requests baantta hai. Autoscaler rules ke hisaab se instances badhata ya ghatata hai.\nApp ko multiple instances par chalne layak banana bhi padta hai. Session, database aur connection pool bottleneck ho sakte hain. Pool ko bahut bada karna har problem ka solution nahi.", "purpose": "", "working": "", "example": "If three API instances are healthy, the balancer can distribute requests. An autoscale rule may later add a fourth. / Baantna aur count badhana alag kaam hain.", "portal": "", "mistake": "If scaling does not improve latency, inspect database time, external calls, locks and queue depth. / Bottleneck kahin aur ho sakta hai.", "related": [], "chapter": 8, "diagramContext": true}, {"id": "diagram-8-346", "name": "Healthy API instances", "aliases": ["Healthy API instances"], "en": "Scale up means giving an instance more capacity. Scale out means adding instances. A load balancer distributes traffic across healthy backends; an autoscaling controller decides when to add or remove capacity according to supported rules. These are separate jobs.\nAdding instances works only when the application supports it. Shared state, session storage, database capacity and connection pools can become bottlenecks. A bigger pool does not make the database infinitely fast.", "hi": "Scale up mein ek instance ko zyada CPU/RAM dete hain. Scale out mein instances ki count badhti hai. Load balancer requests baantta hai. Autoscaler rules ke hisaab se instances badhata ya ghatata hai.\nApp ko multiple instances par chalne layak banana bhi padta hai. Session, database aur connection pool bottleneck ho sakte hain. Pool ko bahut bada karna har problem ka solution nahi.", "purpose": "", "working": "", "example": "If three API instances are healthy, the balancer can distribute requests. An autoscale rule may later add a fourth. / Baantna aur count badhana alag kaam hain.", "portal": "", "mistake": "If scaling does not improve latency, inspect database time, external calls, locks and queue depth. / Bottleneck kahin aur ho sakta hai.", "related": [], "chapter": 8, "diagramContext": true}, {"id": "diagram-9-347", "name": "VNet 10.20.0.0/16", "aliases": ["VNet 10.20.0.0/16"], "en": "A virtual network is a private address network in Azure. A subnet is a smaller range inside it. Resources connected to a subnet can receive private IP addresses from that range. A private IP is not an internet address, but private addressing alone is not a complete security policy.\nFor a learning example, use VNet 10.20.0.0/16 and subnet 10.20.1.0/24. The subnet sits inside the VNet range. Avoid overlapping ranges when networks may later connect.", "hi": "VNet Azure ka private address network hai. Subnet us network ka chhota hissa hai. Subnet se connected resource ko us range ka private IP mil sakta hai. Private IP internet address nahi hota, lekin security ke liye rules bhi chahiye.\nExample VNet 10.20.0.0/16 aur subnet 10.20.1.0/24 hai. Subnet ki range VNet ke andar honi chahiye. Future connection ke liye overlapping range avoid karo.", "purpose": "", "working": "", "example": "Keep application VMs in an app subnet and database VMs in a data subnet, then apply appropriate traffic rules. / Sirf subnet alag karne se traffic block nahi hota.", "portal": "", "mistake": "Overlapping ranges prevent some network connections. An invalid subnet may be outside its VNet address space. / CIDR range check karo.", "related": [], "chapter": 9, "diagramContext": true}, {"id": "diagram-9-348", "name": "App subnet 10.20.1.0/24", "aliases": ["App subnet 10.20.1.0/24"], "en": "A virtual network is a private address network in Azure. A subnet is a smaller range inside it. Resources connected to a subnet can receive private IP addresses from that range. A private IP is not an internet address, but private addressing alone is not a complete security policy.\nFor a learning example, use VNet 10.20.0.0/16 and subnet 10.20.1.0/24. The subnet sits inside the VNet range. Avoid overlapping ranges when networks may later connect.", "hi": "VNet Azure ka private address network hai. Subnet us network ka chhota hissa hai. Subnet se connected resource ko us range ka private IP mil sakta hai. Private IP internet address nahi hota, lekin security ke liye rules bhi chahiye.\nExample VNet 10.20.0.0/16 aur subnet 10.20.1.0/24 hai. Subnet ki range VNet ke andar honi chahiye. Future connection ke liye overlapping range avoid karo.", "purpose": "", "working": "", "example": "Keep application VMs in an app subnet and database VMs in a data subnet, then apply appropriate traffic rules. / Sirf subnet alag karne se traffic block nahi hota.", "portal": "", "mistake": "Overlapping ranges prevent some network connections. An invalid subnet may be outside its VNet address space. / CIDR range check karo.", "related": [], "chapter": 9, "diagramContext": true}, {"id": "diagram-9-349", "name": "Private IP 10.20.1.4", "aliases": ["Private IP 10.20.1.4"], "en": "A virtual network is a private address network in Azure. A subnet is a smaller range inside it. Resources connected to a subnet can receive private IP addresses from that range. A private IP is not an internet address, but private addressing alone is not a complete security policy.\nFor a learning example, use VNet 10.20.0.0/16 and subnet 10.20.1.0/24. The subnet sits inside the VNet range. Avoid P can be reached from the internet when routing and security permit it. DNS converts a name into an address or another name. A custom domain gives your application a friendly name; it does not by itself add authentication or secure the application.\nA DNS record, TLS certificate and hosting binding are related but separate pieces. You must verify domain ownership and bind the hostname on the service. Private DNS is used for private network name resolution.", "hi": "Public IP internet se reachable address ho sakta hai, agar routing aur rules allow karein. DNS naam ko address se map karta hai. Custom domain app ko friendly naam deta hai, lekin login security apne aap nahi deta.\nDNS record, certificate aur hosting binding alag parts hain. Domain ownership verify karke app par hostname add karna hota hai. Private DNS private network ke names resolve karta hai.", "purpose": "", "working": "", "example": "hrms.example.com points to your supported hosting endpoint. / Browser pehle DNS se destination dhundhta hai.", "portal": "", "mistake": "Wrong DNS zone, cached records and missing domain bindings cause common failures. / Sirf DNS entry banana kaafi nahi.", "related": [], "chapter": 11, "diagramContext": true}, {"id": "diagram-11-355", "name": "DNS lookup", "aliases": ["DNS lookup"], "en": "A public IP can be reached from the internet when routing and security permit it. DNS converts a name into an address or another name. A custom domain gives your application a friendly name; it does not by itself add authentication or secure the application.\nA DNS record, TLS certificate and hosting binding are related but separate pieces. You must verify domain ownership and bind the hostname on the service. Private DNS is used for private network name resolution.", "hi": "Public IP internet se reachable address ho sakta hai, agar routing aur rules allow karein. DNS naam ko address se map karta hai. Custom domain app ko friendly naam deta hai, lekin login security apne aap nahi deta pe ke hisaab se service choose karo. Reverse proxy backend ko request forward karta hai. Sirf proxy lagane se backend ka direct access automatically secure nahi hota.", "purpose": "", "working": "", "example": "Global HRMS users → Front Door → regional web/API origins. / Ye architecture example hai, har chhoti app ko zaroorat nahi.", "portal": "", "mistake": "A failed health probe may use the wrong path, port or host header. / Probe ko actual app ke response se match karo.", "related": [], "chapter": 13, "diagramContext": true}, {"id": "diagram-13-362", "name": "Entry point", "aliases": ["Entry point"], "en": "Azure Load Balancer distributes TCP/UDP traffic to regional backends. Application Gateway routes HTTP traffic within a region and can use a WAF tier. Front Door provides a global HTTP entry point with edge routing and optional security features.\nChoose by protocol and scope. A TCP service does not need the same gateway as a global website. A reverse proxy forwards a client request to a backend; it can hide an origin from normal client use, but origin access must still be secured explicitly.", "hi": "Load Balancer regional TCP/UDP traffic baantta hai. Application Gateway regional HTTP routing karta hai. Front Door global website entry point de sakta hai. WAF capability selected tier par depend karti hai.\nProtocol aur scope ke hisaab se service choose karo. Reverse proxy backend ko request forward karta hai. Sirf proxy lagane se backend ka direct access automatically secure nahi hota.", "purpose": "", "working": "", "example": "Global HRMS users → Front Door → regional web/API origins. / Ye architecture example hai, har chhoti app ko zaroorat nahi.", "portal": "", "mistake": "A failed health probe may use the wrong path, port or host header. / Probe ko actual app ke response se match karo.", "related": [], "chapter": 13, "diagramContext": true}, {"id": "diagram-13-363", "name": "Health check", "aliases": ["Health check"], "en": "Azure Load Balancer distributes arges just to remove the message without deciding cost. / Error ka exact reason padho.", "related": [], "chapter": 14, "diagramContext": true}, {"id": "diagram-14-366", "name": "Rows", "aliases": ["Rows"], "en": "Azure SQL Database is a managed relational database. A logical SQL server groups databases and provides settings such as the server name and network access. It is not the same as renting a SQL Server VM. Tables store rows, while your API executes queries and returns only the required data.\nThe free offer has compute and storage limits. Its exact offer version and settings matter. When free compute is exhausted, a database configured to stop rather than bill can pause until the allowance resets. Storage size and compute usage are different limits.", "hi": "Azure SQL Database managed relational database hai. Logical SQL server databases ko group karta hai aur server name/network settings deta hai. Ye SQL Server wali VM nahi hai. API query chalakar required records leti hai.\nFree offer ki compute aur storage limits hoti hain. Agar extra billing disabled hai, free compute khatam hone par DB pause ho sakta hai. Database chhota hone ka matlab compute quota bacha hai, aisa nahi.", "purpose": "", "working": "", "example": "Your earlier DB showed 25 MB stored but zero free vCore seconds. / Data kam tha, phir bhi compute allowance khatam tha.", "portal": "", "mistake": "Paused due to exhausted free amount is different from an incorrect password. Do not enable additional charges just to remove the message without deciding cost. / Error ka exact reason padho.", "related": [], "chapter": 14, "diagramContext": true}, {"id": "diagram-15-367", "name": "Cache hit or miss", "aliases": ["Cache hit or miss"], "en": "A database connection is a communication session. ADO.NET pooling reuses suitable connections after application code closes or disposes them. Opening a connection often borrows one from the pool; it does not always create a new physical connection. Use connections briefly and release them reliably.\nRedis caches selected data in memory. It does not automatically put a terabyte database into a smaller RAM server. Cache popular results, choose an expiry and design how stale data is refreshed. Cache capacity, eviction and database capacity must be considered separately.", "hi": "DB connection communication session hai. ADO.NET connection pooling suitable connection ko reuse karta hai. Code mein Open karne par pool se existing connection mil sakta hai. Kaam hone ke baad Close/Dispose karna zaroori hai, taaki connection pool ko wapas mile.\nRedis memory mein selected data cache karta hai. 32 GB RAM mein 1 TB ka pura data automatically nahi aa jayega. Popular district results cache karo, expiry set karo aur refresh ka rule banao.", "purpose": "", "working": "", "example": "For 55 districts, cache frequently requested summaries rather than loading every raw row. / Required summary cache karo, pura DB nahi.", "portal": "", "mistake": "Pool exhaustion can be leaked connections or slow queries. More pool slots can overload SQL rather than fix it. / Pehle reason measure karo.", "related": [], "chapter": 15, "diagramContext": true}, {"id": "diagram-15-368", "name": "SQL on miss", "aliases": ["SQL on miss"], "en": "A database connection is a communication session. ADO.NET pooling reuses suitable connections after application code closes or disposes them. Opening a connection often borrows one from the pool; it does not always create a new physical connection. Use connections briefly and release them reliably.\nRedis caches selected data in memory. It does not automatically put a terabyte database into a smaller RAM server. Cache popular results, choose an expiry and design how stale data is refreshed. Cache capacity, eviction and database capacity must be considered separately.", "hi": "DB connection communication session hai. ADO.NET connection pooling suitable connection ko reuse karta hai. Code mein Open karne par pool se existing co r environment identity must match the trust settings.\nAn artifact is stored build output, not the source repository itself. Artifact storage quota failures occur during upload and do not prove the application code failed to compile. Login failures are another separate stage. Read the first failing step rather than changing unrelated settings.", "hi": "Deployment workflow source leta hai, build karta hai aur hosting par publish karta hai. OIDC short-lived token se GitHub ko Azure login deta hai. Repo, branch ya environment ka trust configuration match hona chahiye.\nArtifact stored build output hai. Artifact storage full ho to upload fail hota hai; iska matlab code compile error nahi. Login failure alag stage hai. Sabse pehla failed step dekho.", "purpose": "", "working": "", "example": "Frontend Node build → Azure login → deploy to frontend Web App. API uses its own runtime and target. / Dono targets mix mat karo.", "portal": "", "mistake": "For OIDC failure compare tenant/client/subscription IDs, federated subject and token audience; ensure workflow id-token permission. For quota failure remove unneeded artifacts and allow usage recalculation. / Error stage ke hisaab se fix karo.", "related": [], "chapter": 20, "diagramContext": true}, {"id": "diagram-20-384", "name": "Build", "aliases": ["Build"], "en": "A deployment workflow checks out source, builds it and publishes output to a hosting service. GitHub-to-Azure OIDC uses a short-lived token and a matching federated identity configuration. Repository, branch or environment identity must match the trust settings.\nAn artifact is stored build output, not the source repository itself. Artifact storage quota failures occur during upload and do not prove the application code failed to compile. Login failures are another separate stage. Read the first failing step rather than changing unrelated settings.", "hi": "Deployment workflow source leta hai, build karta hai aur hosting par publish karta hai. OIDC short-lived token se GitHub ko Azure login deta hai. Repo, branch ya environment ka trust configuration match hona chahiye.\nArtifact stored build output hai. Artifact storage full ho to upload fail hota hai; iska matlab code compile error nahi. Login failure alag stage hai. Sabse pehla failed step dekho.", "purpose": "", "working": "", "example": "Frontend Node build → Azure login → deploy to frontend Web App. API uses its own runtime and target. / Dono targets mix mat karo.", "portal": "", "mistake": "For OIDC failure compare tenant/client/subscription IDs, federated subject and token audience; ensure workflow id-token permission. For quota failure remove unneeded artifacts and allow usage recalculation. / Error stage ke hisaab se fix karo.", "related": [], "chapter": 20, "diagramContext": true}, {"id": "diagram-21-385", "name": "Application request", "aliases": ["Application request"], "en": "A metric is a numeric measurement over time, such as CPU percentage. A log is a detailed event record. Application Insights observes application requests, exceptions and dependencies. Activity log records Azure management operations such as changing a resource.\nBegin with the user symptom and time range. Check failed requests and slow dependencies before increasing resources. An alert evaluates a condition and triggers an action group; an alert alone does not fix the application.", "hi": "Metric time ke saath number hai, jaise CPU %. Log detailed event record hai. Application Insights request, exception aur dependency dekhta hai. Activity log Azure resource ke management changes dikhata hai.\nPehle user ka issue aur time range lo. Phir failed requests aur slow SQL calls dekho. Alert condition detect karta hai; app ko khud fix nahi karta.", "purpose": "", "working": "", "example": "An API can be slow with low CPU because it is waiting on SQL. / Low CPU ka matlab app healthy hona zaroori nahi.", "portal": "", "mistake": "No logs may mean diagnostics were not enabled or the selected workspa i.", "related": [], "chapter": 21, "diagramContext": true}, {"id": "diagram-22-389", "name": "API producer", "aliases": ["API producer"], "en": "A queue decouples work: the API records a message and a worker handles it later. Service Bus supports application messaging patterns. Event Grid routes notifications that something happened. Event Hubs ingests streams of events for consumers. These services are not interchangeable.\nDesign retries and duplicate handling. A worker may receive a message again after a failure, so processing should be idempotent when possible. Use dead-letter handling for messages that repeatedly fail.", "hi": "Queue se API aur background work alag ho jate hain. API message rakhti hai, worker baad mein process karta hai. Service Bus application messages ke liye, Event Grid event notifications ke liye aur Event Hubs event streams ke liye use hota hai.\nRetry aur duplicate handling plan karo. Same message dobara aa sakta hai, isliye same payment/report do baar create na ho. Repeated failure ko dead-letter mein investigate karo.", "purpose": "", "working": "", "example": "Leave request accepted → queue message → worker sends notification. / User ko long email process ka wait nahi.", "portal": "", "mistake": "A message disappearing from the active queue may be received, expired or dead-lettered. / Active count akela full picture nahi.", "related": [], "chapter": 22, "diagramContext": true}, {"id": "diagram-22-390", "name": "Queue", "aliases": ["Queue"], "en": "A queue decouples work: the API records a message and a worker handles it later. Service Bus supports application messaging patterns. Event Grid routes notifications that something happened. Event Hubs ingests streams of events for consumers. These services are not interchangeable.\nDesign retries and duplicate handling. A worker may receive a message again after a failure, so processing should be idempotent when possible. Use dead-letter handling for messages that repeatedly fail.", "hi": "Q p is only useful when a restore can be performed and tested. Retention and recovery permissions matter as much as the schedule.", "hi": "Backup recoverable versions rakhta hai. High availability kuch failures ke dauran service chalaye rakhti hai. Disaster recovery bade disruption ke baad service wapas lana hai. Replication galat changes bhi copy kar sakta hai, isliye backup ka full replacement nahi.\nRPO batata hai kitna recent data loss acceptable hai. RTO batata hai kitne time mein service wapas chahiye. Backup ka restore test karna zaroori hai.", "purpose": "", "working": "", "example": "An HRMS needs a tested restore point before a destructive migration. / Backup exists aur restore works alag claims hain.", "portal": "", "mistake": "A successful backup job is not evidence that application-level restore is complete. / Data aur app test karo.", "related": [], "chapter": 23, "diagramContext": true}, {"id": "diagram-23-394", "name": "Separate restore", "aliases": ["Separate restore"], "en": "A backup preserves recoverable versions. High availability keeps service operating through some failures. Disaster recovery restores service after a major disruption. Replication copies changes, including some accidental or unwanted changes, so it is not a universal substitute for backup.\nDefine RPO as the acceptable data-loss window and RTO as the acceptable recovery time. A backup is only useful when a restore can be performed and tested. Retention and recovery permissions matter as much as the schedule.", "hi": "Backup recoverable versions rakhta hai. High availability kuch failures ke dauran service chalaye rakhti hai. Disaster recovery bade disruption ke baad service wapas lana hai. Replication galat changes bhi copy kar sakta hai, isliye backup ka full replacement nahi.\nRPO batata hai kitna recent data loss acceptable hai. RTO batata hai kitne time mein service wapas chahiye. Backup ka restore test karna zaroori hai.", "purpose": "", "working": "", "example": "An HRMS ne ple": "HR assistant: authorized documents → retrieval → model response with references. / Model ko unrestricted private files mat do.", "portal": "", "mistake": "An AI answer is not automatically correct. A dashboard platform cannot repair incorrect source data on its own. / Output aur data dono validate karo.", "related": [], "chapter": 25, "diagramContext": true}, {"id": "diagram-25-401", "name": "Suitable service", "aliases": ["Suitable service"], "en": "AI services help with tasks such as language, vision and model-based answers. Search retrieves relevant information; a generative model creates an answer from instructions and context. Analytics tools transform and query larger datasets for reporting. IoT services connect device telemetry. Hybrid tools extend management to resources outside Azure.\nStart with a concrete problem rather than a service list. A 55-district dashboard may first need clean SQL queries, aggregates and caching, not a large data platform or an AI agent. Choose advanced services only when the simpler design no longer fits.", "hi": "AI services language, images aur model-based answers ke kaam aati hain. Search relevant information nikalta hai; model answer banata hai. Analytics large data ko transform/query karta hai. IoT device telemetry ke liye aur hybrid tools Azure ke bahar resources manage karne ke liye hote hain.\nPehle actual problem likho. 55 district dashboard ko shayad clean SQL queries aur caching chahiye, turant giant analytics platform nahi. Requirement ho tab advanced service add karo.", "purpose": "", "working": "", "example": "HR assistant: authorized documents → retrieval → model response with references. / Model ko unrestricted private files mat do.", "portal": "", "mistake": "An AI answer is not automatically correct. A dashboard platform cannot repair incorrect source data on its own. / Output aur data dono validate karo.", "related": [], "chapter": 25, "diagramContext": true}, {"id": "diagram-25-402", "name": "Small test em rather than a service list. A 55-district dashboard may first need clean SQL queries, aggregates and caching, not a large data platform or an AI agent. Choose advanced services only when the simpler design no longer fits.", "hi": "AI services language, images aur model-based answers ke kaam aati hain. Search relevant information nikalta hai; model answer banata hai. Analytics large data ko transform/query karta hai. IoT device telemetry ke liye aur hybrid tools Azure ke bahar resources manage karne ke liye hote hain.\nPehle actual problem likho. 55 district dashboard ko shayad clean SQL queries aur caching chahiye, turant giant analytics platform nahi. Requirement ho tab advanced service add karo.", "purpose": "", "working": "", "example": "HR assistant: authorized documents → retrieval → model response with references. / Model ko unrestricted private files mat do.", "portal": "", "mistake": "An AI answer is not automatically correct. A dashboard platform cannot repair incorrect source data on its own. / Output aur data dono validate karo.", "related": [], "chapter": 25, "diagramContext": true}, {"id": "diagram-26-404", "name": "React frontend", "aliases": ["React frontend"], "en": "The frontend is the user-facing application that renders screens and interacts with users. Browser-based frontend code runs on the user’s device.", "hi": "Frontend user ko screen dikhata hai aur interaction handle karta hai. Browser ka frontend code user ke device par run hota hai.", "purpose": "It presents data and collects user actions. / UI aur user experience ka layer.", "working": "It requests authorized data from an API and displays results. Static build-time configuration may need a rebuild when the API URL changes. / API base URL update ke baad build lag sakti hai.", "example": "React displays the employee table after receiving JSON from the API. / Database se direct connection nahi.", "portal": "Open the frontend Web App and its deployment workflow; inspect build settings and API base URL in the project. / Backend app ko overwrite mat karo.", "mistake": "Browser-delivered code is inspectable; environment variables included in a frontend bundle are not secret. / Frontend env ko secret store mat samjho.", "related": ["API", "CORS", "Deployment"], "chapter": 26, "diagramContext": true}, {"id": "diagram-26-405", "name": ".NET API", "aliases": [".NET API"], "en": "Build the simplest working chain: browser → frontend → API → database. The frontend knows the API URL; the API owns database access. Keep server credentials on the server. Treat hosting, deployment identity, database connectivity and application behavior as separate checks.\nFor a Container Apps to Web App migration, deploy a compatible code build to a suitable new Web App, copy required configuration securely, test the new endpoint and update the frontend API URL. Stop the old execution only after validation. A container image is not the same as a ready code-deployment package.", "hi": "Simple chain banao: browser → frontend → API → database. Frontend API URL janta hai; DB access API ka kaam hai. Server credentials backend par rahenge. Hosting, login, DB connectivity aur app behavior ko alag check karo.\nContainer se Web App shift karne ke liye compatible code build deploy karo, configuration securely set karo, naya endpoint test karo aur frontend API URL update karo. Successful test ke baad old execution stop karo. Sirf image ka naam copy karna migration nahi hai.", "purpose": "", "working": "", "example": "React calls /employees on the API; API runs a parameterized SQL query and returns JSON. / Browser SQL password nahi dekhta.", "portal": "", "mistake": "If health works but data fails, inspect SQL state/network/auth. If browser fails but direct API works, inspect CORS and frontend base URL. / Error layer identify karo.", "related": [], "chapter": 26, "diagramContext": true}]</script><script id="question-data" type="application/json">[[{"q": "Azure Portal opens, but your app URL returns 503. What does the portal opening prove? / Portal khul raha hai par app 503 hai. Kya prove hua?", "o": ["The application runtime is healthy", "The control panel is accessible, not necessarily the app", "The SQL connection is working", "The hosting plan has spare capacity"], "a": 1, "why": "The management portal and application data path are different. Portal access does not verify runtime, SQL or capacity. / Portal aur running app alag paths hain."}, {"q": "Your resource list is empty after switching directory. Best first investigation? / Directory change ke baad list empty hai. Pehle kya check?", "o": ["Create replacement resources immediately", "Upgrade the hosting tier", "Delete the old resource group", "Check directory, subscription filters and access"], "a": 3, "why": "The selected identity context, filters or permission can hide existing resources. Recreating them first can duplicate cost. / Pehle context verify karo."}, {"q": "You can edit a resource but a colleague cannot even see it. Both can open Azure Portal. Which evidence should you compare first?", "o": ["Their browser screen resolutions", "Their selected identity context, subscription filters and effective RBAC access", "Their preferred Azure region only", "The resource display name only"], "a": 1, "why": "Portal accessibility does not imply equal identity context or authorization. Compare those before changing the resource."}], [{"q": "A group named hrms-db costs ₹318, SQL Database shows ₹0 and Container Apps shows ₹318. Which conclusion follows? / Group DB naam ka hai, lekin split ye hai.", "o": ["The database is secretly charging ₹318", "The group name identifies SQL billing", "Container Apps produced the recorded group cost", "The credit expiry generated the charge"], "a": 2, "why": "Group names are labels. The service breakdown identifies Container Apps as the source. / Naam se nahi, breakdown se source pata chalta hai."}, {"q": "You need a separate billing boundary but the same identity directory. What fits? / Same directory, alag billing boundary chahiye.", "o": ["Another subscription associated with the tenant", "Another subnet in the same VNet", "Another blob in the same container", "Another user group only"], "a": 0, "why": "Subscriptions separate billing/management boundaries while remaining associated with the same tenant. Subnets and identity groups do not create a billing boundary."}, {"q": "A developer needs to manage only dev resources; billing must stay separate from prod, but both use the same identity directory. Best design?", "o": ["One tenant per resource and one shared admin password", "One subnet per billing account", "Separate dev/prod subscriptions under the tenant, with scoped dev roles", "One group name called free and no roles"], "a": 2, "why": "Separate subscriptions meet the billing-boundary requirement while scoped RBAC limits management access. A subnet or name does not separate billing."}], [{"q": "Two app instances are in separate zones but use one unprotected database. What is justified? / App multi-zone hai, DB single hai.", "o": ["The whole system is disaster-proof", "App placement alone does not remove the DB dependency risk", "Backups are no longer needed", "Both instances must be in different regions"], "a": 1, "why": "The dependency can still be a failure point. Zones and regions are different, and HA does not replace backup. / Puri dependency chain evaluate karo."}, {"q": "Why may a region be missing in a creation form? / Region dropdown mein option kyun missing ho sakta hai?", "o": ["Group name has the wrong prefix", "The region is unavailable to every Azure user", "The browser theme blocks deployment", "Service, offer or SKU availability may restrict it"], "a": 3, "why": "Availability depends on the service, subscription offer and SKU. A missing choice is not proof of a global outage."}, {"q": "An app is zone-redundant in one region, but recovery must survive loss of the whole region. What extra design is required?", "o": ["Only a larger subnet", "A tested cross-region recovery architecture for app and data", "Only a new tag", "No change because zones are regions"], "a": 1, "why": "Zone resilience is within a region. A regional disaster needs a deliberate app/data recovery design and testing outside that region."}], [{"q": "Actual cost ₹800, forecast ₹1,100 and budget ₹500. Which is the recorded usage figure? / Recorded usage kaunsa hai?", "o": ["₹500", "₹1,100", "₹800", "₹2,400"], "a": 2, "why": "Actual cost is recorded usage for the scope and period. Forecast is estimated, budget is a target, and these amounts should not be added."}, {"q": "A ₹500 budget alert fired while resources kept running. What failed? / Alert ke baad app chali. Kya fail hua?", "o": ["Not necessarily anything: a budget alone is not a shutdown cap", "The invoice must be wrong", "Every resource should stop automatically", "The subscription must be unlimited free"], "a": 0, "why": "A budget evaluates spending and notifies; stopping resources needs deliberate automation or offer-specific spending protection."}, {"q": "Group A costs ₹300, Group B ₹500, and the subscription total is ₹800 for matching period/metric with no other cost. What is the total usage?", "o": ["₹1,600 because all three totals must be added", "₹300 because groups are always free", "₹800 because the subscription total already includes both groups", "₹500 because only the larger group counts"], "a": 2, "why": "The group totals sum to ₹800 and are included in the subscription total. Adding parent and child scopes double-counts usage."}], [{"q": "A Web App is stopped but the dedicated paid App Service plan remains provisioned. What can happen? / App Stop, paid plan abhi hai.", "o": ["All related cost is guaranteed zero", "Plan compute charges can continue", "The plan converts itself to F1", "The source repository is deleted"], "a": 1, "why": "Paid plan capacity is billed separately from an individual app running state. Inspect plan resources and other apps before changing it."}, {"q": "You create an empty .NET Web App and see a default page. What is missing? / Default page aa rahi hai.", "o": ["A bigger SQL database", "A new tenant", "A public IP resource for every API", "Deployment of the actual application build/code"], "a": 3, "why": "Resource creation provisions hosting; it does not automatically publish your project. Verify deployment output and runtime."}, {"q": "Two apps share one paid plan. You want to stop paying only for the unused app without breaking the active app. Best first analysis?", "o": ["Delete the shared plan immediately", "Inspect plan capacity, app dependencies and a supported placement/tier change", "Stop the unused app and promise zero plan charge", "Rename the unused app to F1"], "a": 1, "why": "A shared paid plan supplies capacity to both apps. Inspect supported changes and impact rather than deleting shared capacity or assuming per-app stop removes its cost."}], [{"q": "A Container App uses a Consumption plan. Does using an image alone prove it must incur a charge? / Container image use ki, paid guaranteed?", "o": ["Yes, every container request is always billable", "Yes, registry storage includes execution charges", "No: free grant, plan and actual usage determine billing", "No: Consumption is unlimited free"], "a": 2, "why": "Consumption has a free allocation and charges beyond applicable allowances. Registry and logs are separate. Neither always-paid nor unlimited-free is accurate."}, {"q": "New revision is healthy but receives 0% traffic. Why are users still on the old version? / Healthy revision par traffic zero hai.", "o": ["Traffic assignment still points to another revision", "SQL data size must be zero", "The registry must be empty", "Healthy revisions always receive all traffic"], "a": 0, "why": "Health and traffic assignment are separate. A healthy revision can remain unused until routing is assigned."}, {"q": "A Consumption app has min replicas 0 yet recorded costs, and logs plus registry exist. Which claim is defensible?", "o": ["Min zero proves all Azure cost must be zero", "Every container image creates a fixed subscription fee", "Actual app usage and related resource meters must be inspected separately", "Only SQL can produce container charges"], "a": 2, "why": "Minimum zero permits supported scale-to-zero behavior; it does not erase runtime usage or related registry/log/environment meters."}], [{"q": "A file-processing task should run after a blob arrives. What is the key design check? / Blob ke baad processing chahiye.", "o": ["Use a timer and assume no duplicates", "Choose a suitable trigger, hosting limits and reliable retry behavior", "Select any free-looking service name", "Put server credentials in frontend code"], "a": 1, "why": "Functions are event-driven, but trigger wiring, execution limits and retries must fit the task. / Sirf Function App banana enough nahi."}, {"q": "A Function App is deployed but no queue messages trigger it. Best first check? / Queue function invoke nahi hota.", "o": ["Increase frontend image quality", "Switch tenant name", "Delete the API", "Check trigger enablement, binding and target queue/storage"], "a": 3, "why": "A disabled trigger or wrong binding destination can prevent invocations even when hosting exists."}, {"q": "A function processes an uploaded file, calls an external service, and may retry after a transient failure. What matters beyond choosing a blob trigger?", "o": ["Only the file extension", "Execution limits, safe retry/idempotency and dependency handling", "Only a longer resource name", "Publishing the external API key in the UI"], "a": 1, "why": "A correct event source does not guarantee reliable processing. Execution time, repeated work and dependency failures must fit the hosting and application design."}], [{"q": "You shut down Windows inside a VM. What should you verify before assuming compute billing stopped? / Windows shutdown ke baad bill?", "o": ["The VM wallpaper", "Only the application log", "Azure allocation/deallocation state", "The resource group spelling"], "a": 2, "why": "Guest shutdown is not the same as Azure deallocation. Disks and other resources can still charge after deallocation."}, {"q": "SSH fails although one NSG allow rule exists. Best investigation? / NSG allow hai, SSH fail.", "o": ["Check VM state, effective rules, routing and OS firewall", "Make every network port public", "Increase SQL Max Pool Size", "Remove authentication"], "a": 0, "why": "Connectivity has multiple layers. An allow rule alone does not verify route, source matching, service listener or guest firewall."}, {"q": "A VM is deallocated, but a retained disk, public IP and backup remain. What is the correct cost expectation?", "o": ["Every meter is zero because compute stopped", "Only CPU cost can exist in Azure", "Compute can stop while retained resources still incur their own charges", "Backup becomes permanently free"], "a": 2, "why": "Deallocation addresses compute allocation. Persistent disks, IP types and backup retention are separate cost components."}], [{"q": "CPU is low, API latency is high and SQL dependency time dominates. Best next action? / CPU low, SQL slow.", "o": ["Double every API replica immediately", "Investigate SQL query/dependency bottlenecks first", "Replace DNS with a bigger VM", "Set connection pool to unlimited"], "a": 1, "why": "Extra API capacity may not remove SQL waits and can increase DB pressure. Measure the actual slow dependency."}, {"q": "Load balancer distributes traffic to three instances. Who decides to add a fourth under configured scaling rules? / Fourth instance kaun add karega?", "o": ["The DNS record", "The client browser", "The database table", "The autoscaling controller"], "a": 3, "why": "The autoscaling controller changes capacity. The balancer distributes traffic to suitable healthy backends."}, {"q": "One API instance averages 80 active DB connections. You plan four instances and set Max Pool Size=100 per instance using the same pooling pattern. What should you plan for?", "o": ["One shared total pool of exactly 100 for all processes", "Potential aggregate demand across separate process pools, checked against DB capacity", "Exactly four database connections", "No DB effect because a load balancer owns the pool"], "a": 1, "why": "Pools are process/configuration related. Multiple app instances can create multiple pools, so aggregate concurrency and database capacity must be assessed."}], [{"q": "Which subnet fits inside VNet 10.20.0.0/16 without using another range? / Kaunsi range VNet ke andar hai?", "o": ["10.21.1.0/24", "192.168.1.0/24", "10.20.1.0/24", "172.16.1.0/24"], "a": 2, "why": "The /16 fixes the first two octets as 10.20. The /24 subnet 10.20.1.0/24 is contained within it."}, {"q": "App and data resources use separate subnets. Does that alone block all traffic between them? / Separate subnets enough?", "o": ["No, routing and applicable security rules determine access", "Yes, separation always denies every packet", "Only if both subnets have the same name", "Only if the portal is in dark mode"], "a": 0, "why": "Subnet separation organizes ranges; default routing and security behavior still apply. Explicit rules are needed for intended isolation."}, {"q": "An Azure IPv4 subnet is /24. Assuming the standard five reserved addresses and no additional service reservations, how many are assignable?", "o": ["256", "255", "251", "249"], "a": 2, "why": "A /24 has 256 total IPv4 addresses. Subtract five reserved addresses: 256 − 5 = 251 under the stated assumptions."}], [{"q": "NSG deny priority 100 matches traffic; allow priority 200 also matches. Which applies first? / Dono rules match hote hain.", "o": ["Allow 200 because allow wins", "Deny 100 because lower priority numbers evaluate first", "Both cancel out", "The newer rule always wins"], "a": 1, "why": "NSG rules are evaluated in priority order with lower numbers first. The matching deny at 100 takes precedence here."}, {"q": "NSG allows HTTPS but requests still fail. What is the best conclusion? / NSG allow ke baad failure.", "o": ["NSG guarantees application health", "The database must be full", "TLS must be disabled", "Inspect listener, route, other effective rules and application health"], "a": 3, "why": "NSG acceptance does not prove a running HTTPS listener, valid route, certificate or healthy application."}, {"q": "A subnet NSG allows a TCP flow, while an applicable interface NSG denies that flow. What is the expected result?", "o": ["Allowed because any allow is sufficient", "Denied because the applicable filtering must permit the flow", "Randomly selected by DNS", "Allowed if the resource group name contains app"], "a": 1, "why": "Traffic must satisfy applicable subnet and interface filtering. An allow at one layer does not bypass a deny at another."}], [{"q": "DNS points a custom hostname to the host, but HTTPS certificate name mismatches. What still needs attention? / DNS correct, cert mismatch.", "o": ["The resource group location", "The SQL table name", "TLS certificate and hostname binding", "The container registry retention"], "a": 2, "why": "DNS mapping, hosting binding and TLS certificate are separate. A correct address does not fix certificate identity."}, {"q": "A private SQL hostname resolves publicly inside your connected VNet when private access is required. First focus? / Private route ke liye public resolution aa raha hai.", "o": ["Private DNS zone links and resolution configuration", "Frontend CSS", "The DB row count only", "Changing the SQL password repeatedly"], "a": 0, "why": "Name resolution must direct the client to the intended private endpoint. Password changes do not fix a wrong network path."}, {"q": "DNS now resolves to the right host and TLS is valid, but a custom domain still serves a default site. What should be inspected?", "o": ["Only the SQL password", "Hosting hostname binding and request routing", "Only the domain registration year", "Only the VNet address size"], "a": 1, "why": "Resolution and TLS do not prove the host routes that name to the intended application. Inspect the application binding and routing configuration."}], [{"q": "A private endpoint was created. What must be verified separately? / Endpoint ban gaya; ab kya?", "o": ["Only the portal theme", "DNS, approval/connectivity and public network access settings", "Whether the group name says private", "Whether every user is Owner"], "a": 1, "why": "The endpoint does not universally disable public access. Correct resolution, authorization and connectivity are still required."}, {"q": "SQL authentication values are correct, but the client times out. What should be checked before rotating passwords? / Timeout hai, login details correct.", "o": ["Node version on the unrelated frontend", "Image file resolution", "A new invoice", "DNS, route, endpoint state and network access"], "a": 3, "why": "Timeouts commonly concern connectivity. Authentication cannot succeed if the client cannot reach the intended endpoint."}, {"q": "Private SQL access is required. A connected VM resolves SQL to the private IP and connects; the API outside that network times out. Best diagnosis?", "o": ["The successful VM test proves every app has the same network path", "The API needs its own supported network connectivity and name resolution to the endpoint", "The SQL table needs renaming", "Disable all SQL authentication"], "a": 1, "why": "A test validates only that client path. The API must have supported connectivity and DNS into the private endpoint network as well."}], [{"q": "You need regional raw TCP balancing to VM backends. Which service is the closest match? / Regional TCP traffic?", "o": ["Front Door caching only", "A blob container", "Azure Load Balancer", "An Entra user group"], "a": 2, "why": "Azure Load Balancer provides regional layer-4 TCP/UDP balancing. HTTP edge routing and identity groups serve different roles."}, {"q": "Backend app works directly, but gateway marks it unhealthy. Best initial check? / Direct app works, probe unhealthy.", "o": ["Probe path, port, host header and expected response", "Delete every backend", "Disable every security check", "Increase artifact retention"], "a": 0, "why": "Health checks have their own request settings. A mismatch can make a working backend appear unhealthy."}, {"q": "A global website needs HTTP edge routing; internal VM traffic also needs regional TCP balancing. Best choice principle?", "o": ["Use one DNS record as both services", "Use fit-for-purpose HTTP edge and regional layer-4 components where requirements justify them", "Assume NSG performs both routing roles", "Use a resource lock to distribute requests"], "a": 1, "why": "Protocol and scope differ. Global HTTP edge routing and regional TCP balancing have distinct capabilities and should be selected from their requirements."}], [{"q": "A free SQL DB stores 25 MB but has zero free vCore-seconds, with overage disabled. Why can it pause? / Data kam hai, DB pause.", "o": ["Storage and compute allowance are the same", "Compute allowance can be exhausted independently of storage", "The logical server must have been deleted", "All free databases pause at 25 MB"], "a": 1, "why": "Stored bytes and compute usage are separate limits. Exhausted compute with stop/auto-pause behavior can pause a small DB."}, {"q": "A logical SQL server costs ₹0. What can you conclude about child database cost? / Server zero hai.", "o": ["Every child DB is unlimited free", "The server is a free VM", "All backup retention is free", "Nothing definitive without inspecting database costs/settings"], "a": 3, "why": "Logical server and database resources have different roles and cost attribution. Inspect the actual database and its offer."}, {"q": "A DB has 100,000 free vCore-seconds. Under a simplified constant 2-vCore meter with no other minimums, how long would that compute allowance last?", "o": ["200,000 seconds", "50,000 seconds", "100,000 seconds", "2,000 seconds"], "a": 1, "why": "Under the stated simplified meter, time = 100,000 vCore-seconds ÷ 2 vCores = 50,000 seconds. Actual service metering can differ."}], [{"q": "An API holds pooled connections after each request without disposing them. Requests time out under load. Best first fix? / Connections return nahi ho rahe.", "o": ["Set pool size to one million", "Move credentials to React", "Release connections reliably and investigate long-held work", "Create a new DNS zone"], "a": 2, "why": "Leaked or long-held connections exhaust the pool. Capacity changes alone can hide the issue and overload SQL."}, {"q": "A 32 GB cache is proposed for a 1 TB dataset. What is a reasonable design? / Pura data cache?", "o": ["Cache selected hot results with expiry and eviction policy", "Assume Redis compresses everything to zero", "Keep all connections open forever", "Disable memory limits and rely on disk size"], "a": 0, "why": "Finite RAM needs a bounded working set, refresh and eviction strategy. A full 1 TB dataset is not automatically resident in 32 GB."}, {"q": "A cached district report must refresh when data changes, and stale values are allowed for at most five minutes. Which is best?", "o": ["No expiry and no invalidation", "An explicit refresh/invalidation design with bounded expiry and measurement", "Cache all reports forever because the dataset is not live", "Increase the connection pool to avoid cache refresh"], "a": 1, "why": "A bounded freshness requirement needs a defined refresh policy. Expiry and invalidation should be designed and tested against the allowed stale window."}], [{"q": "A user has management Contributor on storage but cannot read private blobs. What may be missing? / Manage kar sakta hai, blob read nahi.", "o": ["A different wallpaper", "The required data-plane role or permitted access path", "A bigger font in the portal", "A new API route name"], "a": 1, "why": "Management permissions and blob data permissions can differ. Network restrictions can also prevent data access."}, {"q": "Employee records include uploaded PDFs. Best separation? / Employee data aur PDFs?", "o": ["Store DB passwords in every PDF", "Use a Docker image as the document table", "Make all employee documents anonymous", "Keep structured records/metadata in SQL and files in private Blob storage"], "a": 3, "why": "Relational records and binary documents have different storage roles. Private access and server-side authorization remain necessary."}, {"q": "A private blob request returns 403 after a user receives management access. Which independent checks remain relevant?", "o": ["Data authorization, network restrictions and any scoped-token validity", "Only the resource name", "Only the amount of RAM on the frontend", "Only the PDF page count"], "a": 0, "why": "Data access, network policy and temporary access validity are separate from general management rights and can each explain a 403."}], [{"q": "A document workload has one partition key value receiving most requests. What risk exists? / Ek key par most traffic.", "o": ["Every query is automatically free", "All data becomes relational", "A hot partition can create uneven load", "The resource group cannot be tagged"], "a": 2, "why": "Partition distribution affects request load and throughput. A hot key can concentrate work despite unused capacity elsewhere."}, {"q": "A team wants Cosmos DB only because SQL queries are slow. Best first decision process? / Bas fast samajhkar replace?", "o": ["Evaluate query model, partitioning, consistency and measured bottleneck", "Change the service name and assume compatibility", "Remove every index", "Assume all SQL joins behave identically"], "a": 0, "why": "Database choice depends on data model and access patterns. A service swap does not repair an unsuitable query design automatically."}, {"q": "Most queries filter by district, but one district dominates traffic. What is the strongest partition-key decision process?", "o": ["Always use district without measuring", "Choose a random property without query analysis", "Evaluate distribution and access patterns together; test hot-key behavior", "Avoid all partition keys by changing the portal theme"], "a": 2, "why": "A useful key must support query patterns and distribute load. A dominant district can create a hot key, so test rather than selecting by label alone."}], [{"q": "An app identity is enabled but Key Vault access is denied. What is still required? / Identity on, vault denied.", "o": ["A new app name", "Target authorization and valid network access", "A bigger React bundle", "A second browser tab"], "a": 1, "why": "Identity gives a principal. The target must permit the intended operations, and networking must allow access."}, {"q": "What is the safest scope for an app needing to read one service resource? / Ek resource read chahiye.", "o": ["Owner on all subscriptions", "A shared admin password in JavaScript", "Disable authorization", "The narrowest suitable role at the intended scope"], "a": 3, "why": "Least privilege grants required actions at a limited scope. Broad ownership or exposed credentials increases unnecessary access."}, {"q": "A managed identity token is valid, RBAC allows management, but a SQL query is denied. What should you inspect?", "o": ["Only the Azure username spelling", "SQL data-plane/database authorization and supported identity configuration", "Only the web app screen size", "Only the billing forecast"], "a": 1, "why": "Valid identity and Azure management permissions do not universally grant SQL data access. SQL user/permission configuration is a separate check."}], [{"q": "A Key Vault exists but the API still contains a hard-coded secret. What has actually changed? / Vault bana par code same.", "o": ["The secret is automatically removed from Git history", "All frontend variables are now private", "Only vault provisioning; code and rotation work still remain", "Every caller now has secure function quizHtml(chapterIndex,mixed=false){const session='quiz-'+(++quizCounter);let qs=mixed?shuffled(questionBank.flatMap((a,ci)=>a.map((q,qi)=>({...q,ci,qi})))).slice(0,20):questionBank[chapterIndex].map((q,qi)=>({...q,ci:chapterIndex,qi}));qs=shuffled(qs).map(q=>({...q,order:shuffled([0,1,2,3])}));quizSessions.set(session,{qs,chapterIndex,mixed,submitted:false});const previous=assessment.results.filter(r=>r.key===(mixed?'mixed':'chapter-'+chapterIndex));return `<section class="quiz-section" id="${session}" data-quiz="${session}"><span class="tag">${mixed?'20-question mixed exam':'Chapter challenge · 3 scenario questions'}</span><h2>Test yourself / Khud ko evaluate karo</h2><p class="quiz-intro">Select one answer per question, then submit. Answers and explanations appear after submission. Choices are shuffled on each fresh attempt. / Pehle attempt karo, phir explanation dekho. ${mixed?'This is a randomized sample from the 81-question bank.':'Three questions are a quick diagnostic, not proof of mastery.'}</p>${previous.length?`<p class="tiny">Previous attempts: ${previous.length} · Best: ${Math.max(...previous.map(r=>r.percent))}%</p>`:''}${qs.map((q,i)=>`<fieldset class="quiz-q"><legend>${i+1}. ${esc(split(q.q))}</legend><div class="opts">${q.order.map((oi,j)=>`<label class="quiz-option"><input type="radio" name="${session}-q${i}" value="${oi}"><span>${String.fromCharCode(65+j)}. ${esc(q.o[oi])}</span></label>`).join('')}</div><div id="${session}-feedback${i}"></div></fieldset>`).join('')}<p class="quiz-message" aria-live="polite"></p><div class="quiz-tools"><button class="primary" data-quiz-submit="${session}">Submit & evaluate</button><button data-quiz-retry="${session}">Fresh attempt ↻</button></div><div class="quiz-result" aria-live="polite"></div>${!mixed?`<div class="challenge"><b>Practical reasoning challenge / Khud explain karo</b><p>Using this chapter’s example, explain the requirement, the relevant Azure setting, how you would verify the result, and on function submitQuiz(id){const session=quizSessions.get(id),root=$(id);if(!session||session.submitted)return;const chosen=session.qs.map((q,i)=>root.querySelector(`input[name="${id}-q${i}"]:checked`));if(chosen.some(x=>!x)){root.querySelector('.quiz-message').textContent='Answer every question before submitting. / Pehle saare answers select karo.';return}root.querySelector('.quiz-message').textContent='';let score=0;const misses=[];session.qs.forEach((q,i)=>{const v=+chosen[i].value,ok=v===q.a;if(ok)score++;else misses.push(lessons[q.ci].title);root.querySelectorAll(`input[name="${id}-q${i}"]`).forEach(input=>{input.disabled=true;const label=input.closest('label');if(+input.value===q.a)label.classList.add('correct');if(input.checked&&!ok)label.classList.add('incorrect')});const c=concepts.find(c=>c.chapter===q.ci&&!c.referenceOnly&&!c.diagramContext);$(id+'-feedback'+i).innerHTML=`<div class="feedback"><b>${ok?'✓ Your answer matches the scenario':'Review: '+esc(q.o[q.a])}</b><p>${esc(split(q.why))}</p><p class="tiny">${q.o.map((o,oi)=>`<span><b>${oi===q.a?'Expected choice':'Alternative'}:</b> ${esc(o)} — ${oi===q.a?'satisfies this scenario.':'does not satisfy the scenario; compare it with the reasoning above.'}</span>`).join('<br>')}</p>${c?`<button class="concept-chip" data-concept="${c.id}">Review ${esc(c.name)} ⓘ</button>`:''}</div>`});const percent=Math.round(score/session.qs.length*100),key=session.mixed?'mixed':'chapter-'+session.chapterIndex;assessment.results.push({key,percent,score,total:session.qs.length,date:new Date().toISOString(),misses:[...new Set(misses)]});assessment.results=assessment.results.slice(-200);assessmentSave();session.submitted=true;root.querySelector('[data-quiz-submit]').disabled=true;root.querySelector('.quiz-result').innerHTML=`<div class="callout"><div class="quiz-score">${score} / ${session.qs.length} · ${percent}%</div><p>${percent===100?'Strong performance on this attempt. Now explain the practical choices without looking.':percent>=70?'Good start. Review missed scenarios and explain why the alternatives fail.':'Re-read the linked concepts and practical checks before a fresh attempt.'}</p>${misses.length?'<p><b>Review:</b> '+esc([...new Set(misses)].join('; '))+'</p>':''}<p class="tiny">This score measures these questions only. Repeated questions become familiar and do not prove production readiness. / Familiar questions ka score mastery guarantee nahi.</p></div>`}
